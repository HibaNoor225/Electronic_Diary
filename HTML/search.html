</head>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search My Memories</title>
 <link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./themes.css">
<script type="module" src="./theme.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Georgia', 'Times New Roman', serif; }
body {
    background: var(--bg-gradient);
    min-height:100vh;
    padding:20px;
    line-height: 1.8;
}
.container {
    max-width:1000px;
    margin:0 auto;
    background: var(--surface-1-bg);
    border-radius:20px;
    padding:40px 50px;
    box-shadow:0 20px 60px var(--shadow-color);
    border: 3px solid var(--border-color);
    position: relative;
}
.container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 40px;
    width: 2px;
    height: 100%;
    background: var(--accent-1);
    opacity: 0.3;
}

.back-btn {
    padding: 12px 24px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.3s;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 30px;
    box-shadow: 0 4px 15px var(--shadow-color);
}
.back-btn:hover { background: var(--btn-hover); transform: translateY(-2px); }

.search-header {
    text-align: center;
    margin-bottom: 40px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 20px;
}

.search-title {
    font-size: 2.5rem;
    color: var(--heading);
    font-weight: bold;
    text-shadow: 1px 1px 3px var(--shadow-color);
    margin-bottom: 10px;
}

.search-subtitle {
    font-size: 1.2rem;
    color: var(--muted-text);
    font-style: italic;
}

.search-container {
    margin-bottom: 40px;
    background: var(--surface-2-bg);
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 8px 20px var(--shadow-color);
}

.search-tabs {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    justify-content: center;
}

.tab-btn {
    padding: 12px 25px;
    border: none;
    background: var(--border-color);
    color: var(--heading);
    border-radius: 25px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1rem;
}

.tab-btn.active {
    background: var(--btn-bg);
    color: var(--btn-fg);
    box-shadow: 0 4px 15px var(--shadow-color);
}

.tab-btn:hover:not(.active) {
    background: var(--btn-gradient);
    transform: translateY(-1px);
}

.search-form {
    display: none;
    animation: slideDown 0.3s ease;
}

.search-form.active {
    display: block;
}

.form-group {
    margin-bottom: 20px;
}

.form-label {
    display: block;
    color: var(--heading);
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 1.1rem;
}

.form-input, .form-select {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    font-size: 1rem;
    background: white;
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    transition: all 0.3s ease;
}

.form-input:focus, .form-select:focus {
    outline: none;
    border-color: var(--btn-bg);
    box-shadow: 0 0 0 3px rgba(139,69,19,0.1);
}

.search-btn {
    display: none;
    width: 100%;
    padding: 15px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px var(--shadow-color);
}

.search-btn:hover {
    background: var(--btn-hover);
    transform: translateY(-2px);
}

.search-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
}

.results-container {
    margin-top: 30px;
}

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 2px solid var(--border-color);
}

.results-count {
    font-size: 1.2rem;
    color: var(--heading);
    font-weight: bold;
}

.clear-results {
    padding: 8px 16px;
    background: transparent;
    color: var(--btn-bg);
    border: 2px solid var(--btn-bg);
    border-radius: 20px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
}

.clear-results:hover {
    background: var(--btn-bg);
    color: var(--btn-fg);
}

.search-result {
    background: var(--surface-2-bg);
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px var(--shadow-color);
    transition: transform 0.2s ease;
    position: relative;
    padding-left: 40px;
    cursor: pointer;
}

.search-result:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px var(--shadow-color);
}

.search-result::before {
    content: '●';
    position: absolute;
    left: 10px;
    top: 20px;
    color: var(--accent-1);
    font-size: 1.2rem;
}

.result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
}

.result-title {
    font-size: 1.3rem;
    color: var(--heading);
    font-weight: bold;
    margin: 0;
    flex: 1;
}

.result-date {
    background: var(--btn-bg);
    color: var(--btn-fg);
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
}

.result-meta {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    flex-wrap: wrap;
    align-items: center;
}

.meta-badge {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 500;
}

.mood-badge {
    background: #e3f2fd;
    color: #1976d2;
}

.category-badge {
    background: #f3e5f5;
    color: #7b1fa2;
}

.result-description {
    color: var(--text);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 15px;
}

.result-media {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.media-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    background: rgba(139,69,19,0.1);
    border-radius: 8px;
    font-size: 0.8rem;
    color: var(--btn-bg);
}

.no-results {
    text-align: center;
    color: var(--muted-text);
    font-style: italic;
    font-size: 1.2rem;
    padding: 60px 20px;
    background: var(--no-media-bg);
    border-radius: 15px;
    border: 2px dashed var(--border-color);
}

.loading {
    text-align: center;
    color: var(--btn-bg);
    font-size: 1.1rem;
    padding: 40px;
}

.loading::after {
    content: '';
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid var(--border-color);
    border-radius: 50%;
    border-top-color: var(--btn-bg);
    animation: spin 1s ease-in-out infinite;
    margin-left: 10px;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 768px) {
    .container {
        padding: 20px 25px;
    }
    
    .search-tabs {
        flex-direction: column;
        align-items: stretch;
    }
    
    .tab-btn {
        justify-content: center;
    }
    
    .result-header {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .result-date {
        align-self: flex-end;
    }
}

.mood-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin-top: 10px;
}

.mood-option {
    padding: 10px 15px;
    background: var(--surface-3-bg);
    border: 2px solid var(--panel-border);
    border-radius: 25px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9rem;
}

.mood-option:hover {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border-color: var(--btn-bg);
}

.mood-option.selected {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border-color: var(--btn-bg);
}

.category-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
    margin-top: 10px;
}

.category-option {
    padding: 10px 15px;
    background: var(--surface-3-bg);
    border: 2px solid var(--panel-border);
    border-radius: 25px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9rem;
}

.category-option:hover {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border-color: var(--btn-bg);
}

.category-option.selected {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border-color: var(--btn-bg);
}

.clear-option {
    padding: 8px 16px;
    background: transparent;
    color: var(--btn-bg);
    border: 2px solid var(--btn-bg);
    border-radius: 20px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
    font-size: 0.85rem;
    margin-top: 10px;
}

.clear-option:hover {
    background: var(--btn-bg);
    color: var(--btn-fg);
}

:root {
    --bg-gradient: linear-gradient(135deg, #f7f3e9, #e8dcc6);
    --surface-1-bg: #fdfbf7;
    --surface-2-bg: #fff8f0;
    --surface-3-bg: #f8f6f1;
    --border-color: #d4c5a9;
    --panel-border: #e6d8c5;
    --shadow-color: rgba(0,0,0,0.15);

    --text: #2c2c2c;
    --muted-text: #8d6e63;
    --heading: #5d4037;

    --accent-1: #e74c3c;

    --btn-bg: #8b4513;
    --btn-hover: #a0522d;
    --btn-fg: #ffffff;
    --btn-gradient: linear-gradient(135deg, #8b4513, #a0522d);

    --tab-bg: #ffffff;
    --tab-text: #8d6e63;
    --tab-active-bg: #8b4513;
    --tab-active-text: #ffffff;

    --badge-bg: #d4c5a9;
    --badge-text: #5d4037;

    --modal-backdrop: rgba(0,0,0,0.95);
    --modal-surface: #1a1a1a;
    --modal-text: #ffffff;
    --modal-border: #333333;
    --modal-close-bg: rgba(255,255,255,0.9);
    --modal-close-fg: #333333;

    --audio-gradient-start: #667eea;
    --audio-gradient-end: #764ba2;
    --no-media-bg: rgba(212,197,169,0.1);
}
</style>
</head>
<body>
<div class="container">
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
    
    <div class="search-header">
        <div class="search-title">🔍 Search My Memories</div>
        <div class="search-subtitle">Find your precious moments</div>
    </div>
    
    <div class="search-container">
        <div class="search-tabs">
            <button class="tab-btn active" data-tab="name">📝 Search by Title</button>
            <button class="tab-btn" data-tab="mood">😊 Search by Mood</button>
            <button class="tab-btn" data-tab="category">📂 Search by Category</button>
            <button class="tab-btn" data-tab="combined">🔍 Advanced Search</button>
        </div>
        
        <!-- Search by Name/Title Form -->
        <form class="search-form active" id="nameForm">
            <div class="form-group">
                <label class="form-label" for="titleSearch">Enter keywords from event title:</label>
                <input type="text" class="form-input" id="titleSearch" placeholder="e.g., birthday, vacation, meeting..." autocomplete="off">
            </div>
            <button type="submit" class="search-btn">🔍 Search by Title</button>
        </form>
        
        <!-- Search by Mood Form -->
        <form class="search-form" id="moodForm">
            <div class="form-group">
                <label class="form-label">Select your mood:</label>
                <div class="mood-options"></div>
                <input type="hidden" id="selectedMood" name="mood">
            </div>
            <button type="submit" class="search-btn" disabled>😊 Search by Mood</button>
        </form>
        
        <!-- Search by Category Form -->
        <form class="search-form" id="categoryForm">
            <div class="form-group">
                <label class="form-label">Select category:</label>
                <div class="category-options"></div>
                <input type="hidden" id="selectedCategory" name="category">
            </div>
            <button type="submit" class="search-btn" disabled>📂 Search by Category</button>
        </form>
        
        <!-- Combined Advanced Search Form -->
        <!-- Combined Advanced Search Form -->
<form class="search-form" id="combinedForm">
    <div class="form-group">
        <label for="combinedTitle">Search by title (optional):</label>
        <input type="text" class="form-input" id="combinedTitle" placeholder="Keywords from event title..." autocomplete="off">
    </div>
    <div class="form-group">
        <label>Category:</label>
        <div class="combined-category-options"></div>
        <input type="hidden" id="combinedSelectedCategory" name="category">
        <button type="button" class="clear-option" onclick="clearCombinedCategory()">Clear Category</button>
    </div>
    <div class="form-group">
        <label>Mood:</label>
        <div class="combined-mood-options"></div>
        <input type="hidden" id="combinedSelectedMood" name="mood">
        <button type="button" class="clear-option" onclick="clearCombinedMood()">Clear Mood</button>
    </div>
    <button type="submit" class="search-btn">🔍 Advanced Search</button>
</form>

    </div>

    <div id="resultsContainer"></div>
</div>
<script type="module">
import { fetchCategories, fetchMoods } from "./api.js";

async function getAllCategories(userId) {
    const defaultCategories = await fetchCategories();
    const response = await fetch(`http://localhost:3000/api/user/${userId}/customCategories`, {
        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
    });
    const data = await response.json();
    const customCategories = data.success ? data.data : [];
    return [...new Set([...defaultCategories.map(c => c.name), ...customCategories])];
}

async function getAllMoods(userId) {
    const defaultMoods = await fetchMoods();
    const response = await fetch(`http://localhost:3000/api/user/${userId}/customMoods`, {
        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
    });
    const data = await response.json();
    const customMoods = data.success ? data.data : [];
    return [...new Set([...defaultMoods.map(m => m.name), ...customMoods])];
}

document.addEventListener('DOMContentLoaded', async () => {
    const API_BASE_URL = "http://localhost:3000/api";
    const token = localStorage.getItem('token');
    if (!token) { alert("Please log in."); window.location.href = 'register_login.html'; }
    const userId = JSON.parse(atob(token.split('.')[1])).id;
    const resultsContainer = document.getElementById('resultsContainer');

    // Load categories & moods

    const categories = await getAllCategories(userId);
    // Populate categoryForm options
const categoryContainer = document.querySelector('#categoryForm .category-options');
categories.forEach(name => {
    const div = document.createElement('div');
    div.className = 'category-option';
    div.dataset.category = name;
    div.textContent = name;
    categoryContainer.appendChild(div);
});

    const moods = await getAllMoods(userId);

    // Populate moodForm
    const moodContainer = document.querySelector('#moodForm .mood-options');
    moods.forEach(name => {
        const div = document.createElement('div');
        div.className = 'mood-option';
        div.dataset.mood = name;
        div.textContent = name;
        moodContainer.appendChild(div);
    });

    // Populate combined form options (clickable divs)
    const combinedCategoryContainer = document.querySelector('.combined-category-options');
    categories.forEach(name => {
        const div = document.createElement('div');
        div.className = 'category-option';
        div.dataset.category = name;
        div.textContent = name;
        combinedCategoryContainer.appendChild(div);
    });

    const combinedMoodContainer = document.querySelector('.combined-mood-options');
    moods.forEach(name => {
        const div = document.createElement('div');
        div.className = 'mood-option';
        div.dataset.mood = name;
        div.textContent = name;
        combinedMoodContainer.appendChild(div);
    });

    // Hidden inputs for combined form
    const combinedCategorySelect = document.getElementById('combinedSelectedCategory');
    const combinedMoodSelect = document.getElementById('combinedSelectedMood');

    // Tab switching
    const tabButtons = document.querySelectorAll('.tab-btn');
    const searchForms = document.querySelectorAll('.search-form');
    tabButtons.forEach(button => {
        button.addEventListener('click', () => {
            const targetTab = button.dataset.tab;
            tabButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            searchForms.forEach(form => form.classList.remove('active'));
            document.getElementById(`${targetTab}Form`).classList.add('active');
            clearResults();
        });
    });

    // Setup selection for moodForm & categoryForm
    function setupSelection(containerId, hiddenInputId, callback, type) {
        const container = document.querySelector(`#${containerId} .${type}-options`);
        const hiddenInput = document.getElementById(hiddenInputId);
        if (!container) return;
        container.querySelectorAll(`.${type}-option`).forEach(option => {
            option.addEventListener('click', async () => {
                container.querySelectorAll(`.${type}-option`).forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                hiddenInput.value = option.dataset[type];
                if (typeof callback === 'function') await callback(hiddenInput.value);
            });
        });
    }

    setupSelection('moodForm', 'selectedMood', searchByMood, 'mood');
    setupSelection('categoryForm', 'selectedCategory', searchByCategory, 'category');

    // Setup selection for combined form
    function setupCombinedSelection(containerSelector, hiddenInputId, type) {
        const container = document.querySelector(containerSelector);
        const hiddenInput = document.getElementById(hiddenInputId);
        container.querySelectorAll(`.${type}-option`).forEach(option => {
            option.addEventListener('click', () => {
                container.querySelectorAll(`.${type}-option`).forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                hiddenInput.value = option.dataset[type];
                searchCombined();
            });
        });
    }

    setupCombinedSelection('.combined-category-options', 'combinedSelectedCategory', 'category');
    setupCombinedSelection('.combined-mood-options', 'combinedSelectedMood', 'mood');

    // Clear functions
    window.clearCombinedMood = function() {
        combinedMoodSelect.value = '';
        combinedMoodContainer.querySelectorAll('.mood-option').forEach(opt => opt.classList.remove('selected'));
        searchCombined();
    };
    window.clearCombinedCategory = function() {
        combinedCategorySelect.value = '';
        combinedCategoryContainer.querySelectorAll('.category-option').forEach(opt => opt.classList.remove('selected'));
        searchCombined();
    };

    document.getElementById('titleSearch').addEventListener('input', e => searchByName(e.target.value.trim()));
    document.getElementById('combinedTitle').addEventListener('input', searchCombined);

    // Search functions
    async function searchByName(query) {
        if (!query) return clearResults();
        await performSearch(`${API_BASE_URL}/diary/search/name?userId=${userId}&q=${encodeURIComponent(query)}`);
    }
    async function searchByMood(mood) {
        if (!mood) return clearResults();
        await performSearch(`${API_BASE_URL}/diary/search/mood?userId=${userId}&mood=${encodeURIComponent(mood)}`);
    }
    async function searchByCategory(category) {
        if (!category) return clearResults();
        await performSearch(`${API_BASE_URL}/diary/search/category?userId=${userId}&category=${encodeURIComponent(category)}`);
    }
    async function searchCombined() {
        const title = document.getElementById('combinedTitle').value.trim();
        const mood = combinedMoodSelect.value;
        const category = combinedCategorySelect.value;
        if (!title && !mood && !category) return clearResults();
        const params = new URLSearchParams({ userId });
        if (title) params.append('q', title);
        if (mood) params.append('mood', mood);
        if (category) params.append('category', category);
        await performSearch(`${API_BASE_URL}/diary/search?${params.toString()}`);
    }

    async function performSearch(url) {
        resultsContainer.innerHTML = '<div class="loading">Searching your memories...</div>';
        resultsContainer.style.display = 'block';
        try {
            const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Search failed');
            displayResults(data.results || []);
        } catch (err) {
            resultsContainer.innerHTML = `<div class="no-results"><p>❌ Search failed: ${err.message}</p></div>`;
        }
    }

    function displayResults(results) {
        if (!results || results.length === 0) {
            resultsContainer.innerHTML = `<div class="no-results"><p>📭 No memories found matching your search criteria.</p></div>`;
            return;
        }
        resultsContainer.innerHTML = `
            <div class="results-header">
                <div class="results-count">Found ${results.length} memory${results.length !== 1 ? 's' : ''}</div>
                <button class="clear-results" onclick="clearResults()">Clear Results</button>
            </div>
            ${results.map(createResultHTML).join('')}
        `;
    }

    function createResultHTML(result) {
        const date = new Date(result.diaryDate);
        const formattedDate = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const mediaIndicators = [];
       if (result.media && result.media.length > 0) {
    const types = {};
    result.media.forEach(m => {
        types[m.type] = (types[m.type] || 0) + 1;
        // Replace media URL with optimized path if available
        if (m.paths && m.paths.optimized) m.url = m.paths.optimized;
    });
    Object.entries(types).forEach(([type, count]) => {
        let icon = type === 'image' ? '🖼️' : type === 'video' ? '🎬' : '🎵';
        mediaIndicators.push(`<div class="media-indicator">${icon} ${count} ${type}${count>1?'s':''}</div>`);
    });
}

        return `
            <div class="search-result" onclick="viewDiary('${result.diaryDate}')">
                <div class="result-header">
                    <h3 class="result-title">${result.title}</h3>
                    <div class="result-date">${formattedDate}</div>
                </div>
                <div class="result-meta">
                    ${result.mood ? `<div class="meta-badge mood-badge">😊 ${result.mood}</div>` : ''}
                    ${result.category ? `<div class="meta-badge category-badge">📂 ${result.category}</div>` : ''}
                </div>
                ${result.description ? `<div class="result-description">${result.description}</div>` : ''}
                ${mediaIndicators.length>0 ? `<div class="result-media">${mediaIndicators.join('')}</div>` : ''}
            </div>
        `;
    }

    window.viewDiary = date => window.location.href = `diary_view.html?date=${encodeURIComponent(date)}`;
    window.clearResults = () => {
        resultsContainer.style.display = 'none';
        resultsContainer.innerHTML = '';
        document.getElementById('titleSearch').value = '';
        document.getElementById('combinedTitle').value = '';
        document.getElementById('selectedMood').value = '';
        combinedMoodSelect.value = '';
        document.getElementById('selectedCategory').value = '';
        combinedCategorySelect.value = '';
        document.querySelectorAll('.mood-option, .category-option').forEach(opt => opt.classList.remove('selected'));
    };
});
</script>

</body>
</html>
