<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitations</title>
    <link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./themes.css">
<script type="module" src="./theme.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Georgia', 'Times New Roman', serif; }
        body {
            background: var(--bg-gradient);
            min-height:100vh;
            padding:20px;
            line-height: 1.8;
        }
        .container {
            max-width:900px;
            margin:0 auto;
            background: var(--surface-1-bg);
            border-radius:20px;
            padding:50px 60px;
            box-shadow:0 20px 60px var(--shadow-color);
            border: 3px solid var(--border-color);
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 40px;
            width: 2px;
            height: 100%;
            background: var(--accent-1);
            opacity: 0.3;
        }
        .back-btn {
            padding: 12px 24px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        .back-btn:hover { background: var(--btn-hover); transform: translateY(-2px); }

        /* Modern Tab Styling */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.8);
            padding: 8px;
            border-radius: 25px;
            box-shadow: 0 8px 32px var(--shadow-color);
            backdrop-filter: blur(10px);
            border: 1px solid var(--no-media-bg);
        }
        .tab-btn {
            padding: 12px 24px;
            background: transparent;
            color: var(--muted-text);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-size: 0.95rem;
            min-width: 120px;
        }
        .tab-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        .tab-btn:hover::before {
            left: 100%;
        }
        .tab-btn.active {
            background: var(--btn-gradient);
            color: var(--btn-fg);
            box-shadow: 0 4px 15px var(--shadow-color);
            transform: translateY(-2px);
        }
        .tab-btn:hover:not(.active) {
            background: var(--no-media-bg);
            transform: translateY(-1px);
        }

        .invitation-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .invitation-item {
            background: var(--surface-2-bg);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 12px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .invitation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .invitation-info {
            font-size: 1rem;
            color: var(--text);
        }
        .view-btn {
            padding: 8px 16px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .view-btn:hover {
            background: var(--btn-hover);
        }
        .diary-content-container {
            display: none;
            padding: 15px;
            background: var(--surface-1-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .no-invitations {
            text-align: center;
            color: var(--muted-text);
            font-style: italic;
            padding: 40px;
        }

        /* Styles from diary_view.html for diary content */
        .diary-content { color: var(--text); font-size: 1.1rem; text-align: justify; }
        .event-story {
            margin-bottom: 35px;
            position: relative;
            padding-left: 40px;
            background: var(--surface-2-bg);
            border-radius: 15px;
            padding: 20px 30px;
            box-shadow: 0 8px 20px var(--shadow-color);
            transition: transform 0.2s ease;
        }
        .story-paragraph { margin-bottom: 20px; text-indent: 30px; color: var(--text); }
        .story-time { color: var(--muted-text); font-size: 0.9rem; font-style: italic; margin-bottom: 15px; text-indent: 0; }
        .meta-info { margin-bottom: 10px; color: var(--muted-text); font-style: italic; font-size: 0.95rem; }
        .category-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; background: var(--badge-bg); color: var(--badge-text); font-size: 0.85rem; margin-left: 6px; }

        /* Media Gallery Styles from diary_view.html */
        .media-gallery {
            margin-top: 20px;
            padding: 20px;
            background: var(--surface-3-bg);
            border-radius: 12px;
            border: 2px solid var(--panel-border);
        }

        .gallery-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .gallery-title {
            font-size: 1.1rem;
            color: var(--heading);
            font-weight: bold;
            flex: 1;
        }

        .media-tabs {
            display: flex;
            gap: 10px;
            background: var(--surface-1-bg);
            padding: 8px 16px;
            border-radius: 25px;
            box-shadow: 0 2px 8px var(--shadow-color);
            min-width: 350px;
            justify-content: center;
        }

        .media-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .media-grid.active {
            display: grid;
        }

        .media-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: transform 0.3s ease;
            cursor: pointer;
            background: var(--surface-1-bg);
        }

        .media-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-color);
        }

        .media-thumbnail {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }

        .audio-thumbnail {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, var(--audio-gradient-start), var(--audio-gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--modal-text);
        }

        .media-caption {
            padding: 8px 10px;
            font-size: 0.85rem;
            color: var(--muted-text);
            background: var(--surface-1-bg);
            border-top: 1px solid var(--panel-border);
            line-height: 1.3;
        }

        .no-media {
            text-align: center;
            color: var(--muted-text);
            font-style: italic;
            padding: 30px;
            background: var(--no-media-bg);
            border-radius: 8px;
            border: 2px dashed var(--border-color);
        }

        /* Modal Styles - Fixed for Audio */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-backdrop);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            max-width: 95vw;
            max-height: 95vh;
            background: var(--surface-1-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px var(--shadow-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .modal-media {
            width: 100%;
            max-height: calc(95vh - 80px);
            object-fit: contain;
            display: block;
            background: #000;
        }

        /* Fixed Audio Player Styling */
        .modal-content audio {
            width: 100%;
            height: 60px !important;
            background: var(--surface-3-bg);
            border-radius: 8px;
            border: 2px solid var(--panel-border);
            outline: none;
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .modal-content audio::-webkit-media-controls-panel {
            background: linear-gradient(135deg, var(--audio-gradient-start), var(--audio-gradient-end));
            border-radius: 6px;
        }

        .modal-content audio::-webkit-media-controls-play-button,
        .modal-content audio::-webkit-media-controls-pause-button {
            background: var(--btn-fg);
            border-radius: 50%;
            margin: 0 8px;
        }

        .modal-content audio::-webkit-media-controls-current-time-display,
        .modal-content audio::-webkit-media-controls-time-remaining-display {
            color: var(--modal-text);
            font-weight: bold;
        }

        .audio-modal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            min-width: 400px;
        }

        .audio-icon {
            font-size: 4rem;
            color: var(--audio-gradient-start);
            margin-bottom: 10px;
        }

        .modal-caption {
            padding: 15px 20px;
            background: var(--surface-3-bg);
            color: var(--text);
            font-size: 1rem;
            text-align: center;
            border-top: 1px solid var(--panel-border);
            border-radius: 0 0 12px 12px;
            margin: -20px -20px 0 -20px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--modal-close-bg);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--modal-close-fg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .modal-close:hover {
            background: var(--surface-1-bg);
            transform: scale(1.1);
        }

        .no-events {
            text-align: center;
            color: var(--muted-text);
            font-style: italic;
            font-size: 1.2rem;
            padding: 60px 20px;
            background: var(--no-media-bg);
            border-radius: 15px;
            border: 2px dashed var(--border-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .tabs {
                gap: 4px;
                padding: 6px;
            }
            
            .tab-btn {
                padding: 10px 16px;
                font-size: 0.9rem;
                min-width: 100px;
            }
            
            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }

            .audio-modal-container {
                min-width: 300px;
            }
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #f7f3e9, #e8dcc6);
            --surface-1-bg: #fdfbf7;
            --surface-2-bg: #fff8f0;
            --surface-3-bg: #f8f6f1;
            --border-color: #d4c5a9;
            --panel-border: #e6d8c5;
            --shadow-color: rgba(0,0,0,0.15);
            --error-text: #c62828;
            --no-media-bg: rgba(212,197,169,0.1);

            --text: #2c2c2c;
            --muted-text: #8d6e63;
            --heading: #5d4037;

            --accent-1: #e74c3c;

            --btn-bg: #8b4513;
            --btn-hover: #a0522d;
            --btn-fg: #ffffff;
            --btn-gradient: linear-gradient(135deg, #8b4513, #a0522d);

            --tab-bg: #ffffff;
            --tab-text: #8d6e63;
            --tab-active-bg: #8b4513;
            --tab-active-text: #ffffff;

            --badge-bg: #d4c5a9;
            --badge-text: #5d4037;

            --modal-backdrop: rgba(0,0,0,0.95);
            --modal-surface: #1a1a1a;
            --modal-text: #ffffff;
            --modal-border: #333333;
            --modal-close-bg: rgba(255,255,255,0.9);
            --modal-close-fg: #333333;

            --audio-gradient-start: #667eea;
            --audio-gradient-end: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

        <div class="tabs">
           <button class="tab-btn active" onclick="switchTab('received')">Received</button>
           <button class="tab-btn" onclick="switchTab('sent')">Sent</button>
        </div>

        <div id="received-list" class="invitation-list"></div>
        <div id="sent-list" class="invitation-list" style="display: none;"></div>
    </div>

    <!-- Modal for media viewing -->
    <div class="modal" id="mediaModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalMediaContainer"></div>
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <script>
const API_BASE_URL = "http://localhost:3000/api";
const token = localStorage.getItem('token');

// Current active tab
let currentTab = 'received';

// Load invitations from API
async function loadInvitations(type) {
    try {
        const res = await fetch(`${API_BASE_URL}/invitations/${type}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) return data.invitations || [];
        return [];
    } catch (err) {
        console.error(`Error fetching ${type} invitations:`, err);
        return [];
    }
}
// Render invitations
function renderInvitations(invitations, container, type) {
    container.innerHTML = '';
    if (invitations.length === 0) {
        container.innerHTML = '<p class="no-invitations">No invitations here.</p>';
        return;
    }

    invitations.forEach(invitation => {
        const item = document.createElement('div');
        item.className = 'invitation-item';

        // Header
        const header = document.createElement('div');
        header.className = 'invitation-header';

        const info = document.createElement('div');
        info.className = 'invitation-info';
        const fromTo = type === 'received' ? 'From' : 'To';
        const user = type === 'received'
            ? invitation.senderId?.username || 'Unknown User'
            : invitation.recipientId?.username || 'Unknown User';
        info.textContent = `${fromTo}: ${user} | Date: ${new Date(invitation.diaryDate).toLocaleDateString()}`;
        header.appendChild(info);

        // View Diary button for both tabs
        const viewBtn = document.createElement('button');
        viewBtn.className = 'view-btn';
        viewBtn.textContent = 'View Diary';
        viewBtn.onclick = () => {
            const diaryContainer = item.querySelector('.diary-content-container');
            const diaryDate = invitation.diaryDate;

            if (type === 'received') {
                // Received: toggle inline diary
                if (diaryContainer.style.display === 'block') {
                    diaryContainer.style.display = 'none';
                    viewBtn.textContent = 'View Diary';
                } else {
                    if (diaryContainer.innerHTML === '') {
                        const sharedBy = invitation.senderId._id || invitation.senderId;
                        toggleDiaryContent(item, diaryDate, sharedBy);
                    }
                    diaryContainer.style.display = 'block';
                    viewBtn.textContent = 'Hide Diary';
                }
            } else if (type === 'sent') {
                // Sent: redirect to diary_view.html with date param
                window.location.href = `diary_view.html?date=${diaryDate}`;
            }
        };
                            
        header.appendChild(viewBtn);

        item.appendChild(header);

        // Diary container
        const diaryContainer = document.createElement('div');
        diaryContainer.className = 'diary-content-container';
        diaryContainer.id = `diary-${invitation._id}`;
        item.appendChild(diaryContainer);

        container.appendChild(item);
    });
}

// Fixed tab switching function
function switchTab(tabName) {
    const receivedList = document.getElementById('received-list');
    const sentList = document.getElementById('sent-list');
    const receivedBtn = document.querySelector("button[onclick*='received']");
    const sentBtn = document.querySelector("button[onclick*='sent']");

    // Remove active class from all buttons
    receivedBtn.classList.remove('active');
    sentBtn.classList.remove('active');

    // Hide all lists
    receivedList.style.display = 'none';
    sentList.style.display = 'none';

    // Show selected tab and activate button
    if (tabName === 'received') {
        receivedList.style.display = 'flex';
        receivedBtn.classList.add('active');
        currentTab = 'received';
        
        // Load data if not already loaded
        if (receivedList.children.length === 0) {
            loadInvitations('received').then(inv => renderInvitations(inv, receivedList, 'received'));
        }
    } else if (tabName === 'sent') {
        sentList.style.display = 'flex';
        sentBtn.classList.add('active');
        currentTab = 'sent';
        
        // Load data if not already loaded
        if (sentList.children.length === 0) {
            loadInvitations('sent').then(inv => renderInvitations(inv, sentList, 'sent'));
        }
    }
}

// Toggle diary content display
async function toggleDiaryContent(item, date, sharedBy) {
    const diaryContainer = item.querySelector('.diary-content-container');
    if (diaryContainer.style.display === 'block') {
        diaryContainer.style.display = 'none';
        item.querySelector('.view-btn').textContent = 'View Diary';
    } else {
        if (diaryContainer.innerHTML === '') {
            await loadDiaryContent(diaryContainer, date, sharedBy);
        }
        diaryContainer.style.display = 'block';
        item.querySelector('.view-btn').textContent = 'Hide Diary';
    }
}

// Load full diary content from API with media gallery
async function loadDiaryContent(container, date, sharedBy) {
    try {
        const res = await fetch(`${API_BASE_URL}/invitation-diary/${date}?senderId=${sharedBy}`, {
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });

        const data = await res.json();

        if (data.success) {
            const dayEvents = data.data?.events || [];
            if (dayEvents.length === 0) {
                container.innerHTML = `<div class="no-events"><p>No memories were captured on this day...</p></div>`;
                return;
            }

            const diaryContent = document.createElement('div');
            diaryContent.className = 'diary-content';

            dayEvents.forEach((event, index) => {
                const storySection = document.createElement('div');
                storySection.className = 'event-story';

                // Chapter
                const chapterElement = document.createElement('div');
                chapterElement.className = 'story-time';
                chapterElement.textContent = `Chapter ${index + 1}`;
                storySection.appendChild(chapterElement);

                // Title & Description
                const storyParagraph = document.createElement('div');
                storyParagraph.className = 'story-paragraph';
                storyParagraph.innerHTML = `<strong>${event.title}</strong> - ${event.description || 'A moment worth remembering.'}`;
                storySection.appendChild(storyParagraph);

                // Category / Meta Info
                if (event.category) {
                    const meta = document.createElement('div');
                    meta.className = 'meta-info';
                    meta.innerHTML = `Category: <span class="category-badge">${event.category}</span>`;
                    storySection.appendChild(meta);
                }

                // Media Gallery
                if (event.media && event.media.length > 0) {
                    const gallery = document.createElement('div');
                    gallery.className = 'media-gallery';

                    const grid = document.createElement('div');
                    grid.className = 'media-grid active';

                    event.media.forEach(media => {
                        const mediaItem = document.createElement('div');
                        mediaItem.className = 'media-item';

                        if (media.type === 'image') {
                            const img = document.createElement('img');
                            img.src = `http://localhost:3000/uploads/${media.url.original || media.url}`;
                            img.className = 'media-thumbnail';
                            img.alt = media.caption || '';
                            img.onclick = () => openModal(media.url.original || media.url, media.caption || '', 'image');
                            mediaItem.appendChild(img);
                        } else if (media.type === 'video') {
                            const vid = document.createElement('video');
                            vid.src = `http://localhost:3000/uploads/${media.url}`;
                            vid.className = 'media-thumbnail';
                            vid.controls = true;
                            vid.onclick = () => openModal(media.url, media.caption || '', 'video');
                            mediaItem.appendChild(vid);
                        } else if (media.type === 'audio') {
                            const audioDiv = document.createElement('div');
                            audioDiv.className = 'audio-thumbnail';
                            audioDiv.textContent = '🎵';
                            audioDiv.onclick = () => openModal(media.url, media.caption || '', 'audio');
                            mediaItem.appendChild(audioDiv);
                        }

                        // Caption
                        if (media.caption) {
                            const caption = document.createElement('div');
                            caption.className = 'media-caption';
                            caption.textContent = media.caption;
                            mediaItem.appendChild(caption);
                        }

                        grid.appendChild(mediaItem);
                    });

                    gallery.appendChild(grid);
                    storySection.appendChild(gallery);
                }

                diaryContent.appendChild(storySection);
            });

            container.appendChild(diaryContent);
        } else {
            container.innerHTML = `<div class="no-events"><p style="color:var(--error-text);">Unable to load diary entries.</p></div>`;
        }
    } catch (err) {
        console.error('Error loading diary content:', err);
        container.innerHTML = `<div class="no-events"><p style="color:var(--error-text);">Unable to load diary entries.</p></div>`;
    }
}

// Fixed modal function with proper audio handling
function openModal(mediaUrl, caption = '', mediaType = '') {
    const modal = document.getElementById('mediaModal');
    const container = document.getElementById('modalMediaContainer');
    const modalCaption = document.getElementById('modalCaption');

    // Clear previous media
    container.innerHTML = '';
    modalCaption.textContent = caption;

    // Auto-detect media type if not provided
    if (!mediaType) {
        const extension = mediaUrl.split('.').pop().toLowerCase();
        if (['mp4', 'webm', 'mov'].includes(extension)) {
            mediaType = 'video';
        } else if (['mp3', 'wav', 'ogg'].includes(extension)) {
            mediaType = 'audio';
        } else {
            mediaType = 'image';
        }
    }

    if (mediaType === 'video') {
        const video = document.createElement('video');
        video.src = `http://localhost:3000/uploads/${mediaUrl}`;
        video.controls = true;
        video.autoplay = true;
        video.style.maxHeight = '80vh';
        video.style.width = '100%';
        container.appendChild(video);
    } else if (mediaType === 'audio') {
        // Create a special container for audio with visual elements
        const audioContainer = document.createElement('div');
        audioContainer.className = 'audio-modal-container';
        
        // Add visual icon
        const audioIcon = document.createElement('div');
        audioIcon.className = 'audio-icon';
        audioIcon.textContent = '🎵';
        audioContainer.appendChild(audioIcon);
        
        // Add audio player with proper styling
        const audio = document.createElement('audio');
        audio.src = `http://localhost:3000/uploads/${mediaUrl}`;
        audio.controls = true;
        audio.autoplay = true;
        audioContainer.appendChild(audio);
        
        container.appendChild(audioContainer);
    } else {
        // Image
        const img = document.createElement('img');
        img.src = `http://localhost:3000/uploads/${mediaUrl}`;
        img.style.maxHeight = '80vh';
        img.style.maxWidth = '95vw';
        img.style.objectFit = 'contain';
        container.appendChild(img);
    }

    modal.classList.add('active');
}

// Close modal
function closeModal() {
    const modal = document.getElementById('mediaModal');
    const container = document.getElementById('modalMediaContainer');

    // Pause videos or audios if any
    const media = container.querySelector('video, audio');
    if (media) media.pause();

    container.innerHTML = '';
    modal.classList.remove('active');
}

// Initialize page with received tab active
document.addEventListener('DOMContentLoaded', () => {
    switchTab('received');
});
</script>
