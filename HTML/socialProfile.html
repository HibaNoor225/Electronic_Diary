
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; }

        body {
            background: linear-gradient(135deg, #f7f3e9, #e8dcc6);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fdfbf7;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(139,69,19,0.15);
            border: 3px solid #d4c5a9;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 40px;
            width: 2px;
            height: 100%;
            background: #e74c3c;
            opacity: 0.3;
            z-index: 0;
        }

        .profile-header {
            background: linear-gradient(135deg, #8b4513, #a0522d);
            padding: 40px 30px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .profile-name {
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .profile-email {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .profile-content {
            padding: 30px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .section-title {
            font-size: 1.8rem;
            color: #333;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-button {
            background: #8b4513;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0 0 20px;
            box-shadow: 0 4px 15px rgba(139,69,19,0.3);
            font-family: 'Georgia', serif;
        }

        .back-button:hover {
            background: #a0522d;
            transform: translateY(-2px);
        }

        .section-title {
            font-size: 1.8rem;
            color: #5d4037;
            background: none;
            -webkit-background-clip: unset;
            -webkit-text-fill-color: unset;
        }

        .profile-content {
            padding: 40px 50px;
            position: relative;
            z-index: 1;
        }

        .post-card {
            background: #fff8f0;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(139,69,19,0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 2px solid #e6d8c5;
            position: relative;
        }

        .post-card::before {
            content: '●';
            position: absolute;
            left: 15px;
            top: 20px;
            color: #e74c3c;
            font-size: 1.2rem;
            z-index: 1;
        }

        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(139,69,19,0.15);
        }

        .post-content {
            padding: 25px 25px 20px 40px;
            color: #2c2c2c;
        }

        .post-date {
            color: #8d6e63;
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-style: italic;
        }

        .diary-events {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .diary-event {
            background: #8b4513;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(139,69,19,0.3);
        }

        .post-stats {
            display: flex;
            gap: 20px;
            padding: 15px 25px 15px 40px;
            border-top: 1px solid #e6d8c5;
            background: #f8f6f1;
            font-size: 0.9rem;
            color: #8d6e63;
        }

        .no-posts {
            text-align: center;
            padding: 80px 20px;
            color: #8d6e63;
            background: rgba(212,197,169,0.1);
            border-radius: 15px;
            border: 2px dashed #d4c5a9;
        }

        .no-posts h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #5d4037;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px;
            border: 2px solid rgba(231, 76, 60, 0.2);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #8d6e63;
            font-size: 1.3rem;
            font-style: italic;
        }

        .page-btn {
            padding: 10px 16px;
            background: #fdfbf7;
            border: 2px solid #d4c5a9;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #8d6e63;
            font-family: 'Georgia', serif;
            box-shadow: 0 2px 8px rgba(139,69,19,0.1);
        }

        .page-btn:hover {
            background: #f8f6f1;
            border-color: #8b4513;
            transform: translateY(-1px);
        }

        .page-btn.active {
            background: #8b4513;
            color: white;
            border-color: #8b4513;
            box-shadow: 0 4px 15px rgba(139,69,19,0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2rem;
        }

        .post-card {
            background: white;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #f5f5f5;
        }

        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .post-content {
            padding: 20px;
        }

        .post-date {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .diary-events {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .diary-event {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .post-stats {
            display: flex;
            gap: 20px;
            padding: 15px 20px;
            border-top: 1px solid #f0f0f0;
            background: #fafafa;
            font-size: 0.9rem;
            color: #666;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .no-posts {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-posts h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #999;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .page-btn {
            padding: 10px 16px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: #666;
        }

        .page-btn:hover {
            background: #f8f9fa;
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .page-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .profile-header {
                padding: 30px 20px;
            }

            .profile-avatar {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }

            .profile-name {
                font-size: 2rem;
            }

            .profile-stats {
                gap: 25px;
            }

            .profile-content {
                padding: 20px;
            }

            .section-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="goBack()" style="margin: 20px 0 0 20px;">
            <span>←</span> Back to Posts
        </button>

        <div class="profile-header">
            <div id="profile-avatar" class="profile-avatar"></div>
            <h1 id="profile-name" class="profile-name">Loading...</h1>
            <p id="profile-email" class="profile-email"></p>
            
            <div class="profile-stats">
                <div class="stat-item">
                    <span id="posts-count" class="stat-number">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-item">
                    <span id="likes-count" class="stat-number">0</span>
                    <span class="stat-label">Likes</span>
                </div>
                <div class="stat-item">
                    <span id="comments-count" class="stat-number">0</span>
                    <span class="stat-label">Comments</span>
                </div>
            </div>
        </div>

        <div class="profile-content">
            <div class="section-header">
                <h2 class="section-title">📝 Recent Posts</h2>
            </div>

            <div id="loading" class="loading">
                <p>Loading user posts...</p>
            </div>

            <div id="posts-container"></div>

            <div id="no-posts" class="no-posts" style="display: none;">
                <h3>📭 No posts yet</h3>
                <p>This user hasn't shared anything yet</p>
            </div>

            <div id="error-message" class="error-message" style="display: none;">
                <h3>❌ Error loading profile</h3>
                <p>Unable to load user profile. Please try again later.</p>
            </div>

            <div id="pagination" class="pagination" style="display: none;"></div>
        </div>
    </div>

    <script>
let currentPage = 1;
const postsPerPage = 10; // posts per page
let totalPosts = 0;
let userId = null;

// Get user ID from URL
function getUserIdFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('userId');
}

// Get initials for avatar
function getUserInitials(username) {
    return username ? username.substring(0, 2).toUpperCase() : 'U';
}

// Format date nicely
function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

function goBack() {
    window.location.href = 'post.html';
}

// Load user profile and posts together
async function loadUserProfile(userId, page = 1) {
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error-message');
    const profileAvatar = document.getElementById('profile-avatar');
    const profileName = document.getElementById('profile-name');
    const profileEmail = document.getElementById('profile-email');
    const postsContainer = document.getElementById('posts-container');
    const noPostsDiv = document.getElementById('no-posts');
    const paginationDiv = document.getElementById('pagination');

    loading.style.display = 'block';
    errorDiv.style.display = 'none';
    postsContainer.innerHTML = '';
    noPostsDiv.style.display = 'none';
    paginationDiv.style.display = 'none';

    try {
        const response = await fetch(`http://localhost:3000/api/users/profile/${userId}?page=${page}&limit=${postsPerPage}`);
        const data = await response.json();

        loading.style.display = 'none';

        if (data.success && data.user) {
            const user = data.user;
            const posts = data.posts || [];
            totalPosts = data.totalPosts || posts.length;

            // Update profile info
            profileAvatar.textContent = getUserInitials(user.username);
            profileName.textContent = user.username;
            profileEmail.textContent = user.email;

            // Update stats
            const postsCountEl = document.getElementById('posts-count');
            const likesCountEl = document.getElementById('likes-count');
            const commentsCountEl = document.getElementById('comments-count');

            postsCountEl.textContent = totalPosts;
            likesCountEl.textContent = posts.reduce((sum, p) => sum + p.likes.length, 0);
            commentsCountEl.textContent = posts.reduce((sum, p) => sum + p.comments.length, 0);

            // Display posts
            if (posts.length > 0) {
                postsContainer.innerHTML = posts.map(post => createUserPostHTML(post)).join('');
                if (totalPosts > postsPerPage) {
                    createPagination(page, Math.ceil(totalPosts / postsPerPage));
                    paginationDiv.style.display = 'flex';
                }
            } else {
                noPostsDiv.style.display = 'block';
            }
        } else {
            errorDiv.style.display = 'block';
        }
    } catch (error) {
        console.error('Error loading profile:', error);
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
    }
}

// Create post HTML
function createUserPostHTML(post) {
    const likesCount = post.likes.length;
    const commentsCount = post.comments.length;

    return `
        <div class="post-card">
            <div class="post-content">
                <div class="post-date">${formatDate(post.createdAt)}</div>
                <div class="diary-events">
                    ${post.diaryEvents.map(event => `
                        <span class="diary-event">${event.title || 'Beautiful Moment'}</span>
                    `).join('')}
                </div>
                ${post.content ? `<p>${post.content}</p>` : ''}
            </div>
            <div class="post-stats">
                <div class="stat">
                    <span>❤️</span>
                    <span>${likesCount} ${likesCount === 1 ? 'like' : 'likes'}</span>
                </div>
                <div class="stat">
                    <span>💬</span>
                    <span>${commentsCount} ${commentsCount === 1 ? 'comment' : 'comments'}</span>
                </div>
            </div>
        </div>
    `;
}

// Pagination buttons
function createPagination(currentPage, totalPages) {
    const paginationDiv = document.getElementById('pagination');
    let html = '';

    html += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Previous</button>`;

    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);

    if (startPage > 1) {
        html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
        if (startPage > 2) html += `<span class="page-btn" disabled>...</span>`;
    }

    for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
    }

    if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<span class="page-btn" disabled>...</span>`;
        html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
    }

    html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>`;

    paginationDiv.innerHTML = html;
}

// Change page
function changePage(page) {
    if (page < 1 || page > Math.ceil(totalPosts / postsPerPage)) return;
    currentPage = page;
    loadUserProfile(userId, page);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    userId = getUserIdFromURL();
    if (!userId) {
        document.getElementById('error-message').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
        return;
    }
    loadUserProfile(userId, currentPage);
});
</script>

</body>
</html>
