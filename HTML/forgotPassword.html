<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password - Daily Diary</title>
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./themes.css">
<script type="module" src="./theme.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Georgia', 'Times New Roman', serif; }

body {
    background: var(--bg-gradient);
    min-height:100vh;
    padding:20px;
    line-height: 1.8;
    display: flex;
    align-items: center;
    justify-content: center;
}

.reset-container {
    max-width: 500px;
    width: 100%;
    background: var(--surface-1-bg);
    border-radius: 20px;
    padding: 50px 60px;
    box-shadow: 0 20px 60px var(--shadow-color);
    border: 3px solid var(--border-color);
    position: relative;
    animation: slideUp 0.6s ease forwards;
}

.reset-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 40px;
    width: 2px;
    height: 100%;
    background: var(--accent-1);
    opacity: 0.3;
}

.reset-header {
    text-align: center;
    margin-bottom: 40px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 20px;
}

.reset-icon {
    font-size: 3rem;
    margin-bottom: 15px;
    color: var(--btn-bg);
    text-shadow: 2px 2px 4px var(--shadow-color);
}

.reset-title {
    font-size: 2.2rem;
    color: var(--heading);
    font-weight: bold;
    text-shadow: 1px 1px 3px var(--shadow-color);
    margin-bottom: 10px;
}

.reset-subtitle {
    font-size: 1.1rem;
    color: var(--muted-text);
    font-style: italic;
    line-height: 1.5;
}

.reset-form {
    margin-top: 30px;
}

.form-group {
    margin-bottom: 25px;
    position: relative;
}

.form-label {
    display: block;
    color: var(--heading);
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 10px;
    padding-left: 5px;
}

.form-input {
    width: 100%;
    padding: 18px 25px;
    border: 2px solid var(--border-color);
    border-radius: 15px;
    font-size: 1.1rem;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--surface-2-bg);
    color: var(--text);
    transition: all 0.3s ease;
    box-shadow: inset 0 3px 6px var(--shadow-color);
}

.form-input:focus {
    outline: none;
    border-color: var(--btn-bg);
    background: var(--surface-1-bg);
    box-shadow: 0 0 0 4px rgba(139,69,19,0.15), inset 0 3px 6px var(--shadow-color);
    transform: translateY(-2px);
}

.form-input::placeholder {
    color: var(--muted-text);
    font-style: italic;
}

.password-strength {
    margin-top: 10px;
    font-size: 0.95rem;
    color: var(--muted-text);
    font-style: italic;
    padding-left: 5px;
}

.strength-weak { color: var(--accent-1); }
.strength-medium { color: #f39c12; }
.strength-strong { color: #27ae60; }

.password-match {
    margin-top: 10px;
    font-size: 0.95rem;
    padding-left: 5px;
    font-style: italic;
}

.match-success { color: #27ae60; }
.match-error { color: var(--accent-1); }

.security-tips {
    background: var(--no-media-bg);
    border: 2px solid var(--panel-border);
    border-radius: 12px;
    padding: 20px;
    margin: 25px 0;
    font-size: 0.95rem;
    color: var(--heading);
}

.security-tips h4 {
    color: var(--btn-bg);
    margin-bottom: 10px;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 8px;
}

.security-tips ul {
    list-style: none;
    padding-left: 0;
}

.security-tips li {
    margin: 6px 0;
    padding-left: 20px;
    position: relative;
}

.security-tips li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--btn-bg);
    font-weight: bold;
}

.submit-btn {
    width: 100%;
    padding: 18px 20px;
    background: var(--btn-gradient);
    color: var(--btn-fg);
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 600;
    font-size: 1.2rem;
    font-family: 'Georgia', 'Times New Roman', serif;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px var(--shadow-color);
    position: relative;
    overflow: hidden;
}

.submit-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.6s;
}

.submit-btn:hover {
    background: linear-gradient(135deg, var(--btn-hover), var(--btn-bg));
    transform: translateY(-3px);
    box-shadow: 0 8px 25px var(--shadow-color);
}

.submit-btn:hover::before {
    left: 100%;
}

.submit-btn:active {
    transform: translateY(-1px);
}

.submit-btn:disabled {
    background: var(--badge-bg);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.loading-spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: var(--btn-fg);
    animation: spin 1s ease-in-out infinite;
    margin-right: 10px;
}

.back-link {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--panel-border);
}

.back-link a {
    color: var(--btn-bg);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 20px;
    transition: all 0.3s ease;
    display: inline-block;
}

.back-link a:hover {
    background: var(--no-media-bg);
    color: var(--heading);
    transform: translateY(-1px);
}

.success-message {
    background: linear-gradient(135deg, #d4edda, #c3e6cb);
    border: 2px solid #b7ddb8;
    color: #155724;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 1.1rem;
    display: none;
    animation: fadeIn 0.5s ease;
}

.error-message {
    background: linear-gradient(135deg, #f8d7da, #f1b7bb);
    border: 2px solid #f1a7ab;
    color: #721c24;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 1.1rem;
    display: none;
    animation: fadeIn 0.5s ease;
}

@keyframes slideUp {
    from { 
        transform: translateY(30px);
        opacity: 0;
    }
    to { 
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}

.shake {
    animation: shake 0.5s ease-in-out;
}

@media (max-width: 768px) {
    .reset-container {
        margin: 20px;
        padding: 40px 30px;
        max-width: none;
    }
    
    .reset-title {
        font-size: 1.8rem;
    }
    
    .form-input {
        padding: 15px 20px;
        font-size: 1rem;
    }
    
    .submit-btn {
        font-size: 1.1rem;
        padding: 16px 20px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 10px;
    }
    
    .reset-container {
        padding: 30px 25px;
    }
    
    .reset-container::before {
        left: 20px;
    }
}

:root {
    --bg-gradient: linear-gradient(135deg, #f7f3e9, #e8dcc6);
    --surface-1-bg: #fdfbf7;
    --surface-2-bg: #fff8f0;
    --surface-3-bg: #f8f6f1;
    --border-color: #d4c5a9;
    --panel-border: #e6d8c5;
    --shadow-color: rgba(0,0,0,0.15);
    --error-text: #c62828;
    --no-media-bg: rgba(212,197,169,0.1);

    --text: #2c2c2c;
    --muted-text: #8d6e63;
    --heading: #5d4037;

    --accent-1: #e74c3c;

    --btn-bg: #8b4513;
    --btn-hover: #a0522d;
    --btn-fg: #ffffff;
    --btn-gradient: linear-gradient(135deg, #8b4513, #a0522d);

    --tab-bg: #ffffff;
    --tab-text: #8d6e63;
    --tab-active-bg: #8b4513;
    --tab-active-text: #ffffff;

    --badge-bg: #d4c5a9;
    --badge-text: #5d4037;

    --modal-backdrop: rgba(0,0,0,0.95);
    --modal-surface: #1a1a1a;
    --modal-text: #ffffff;
    --modal-border: #333333;
    --modal-close-bg: rgba(255,255,255,0.9);
    --modal-close-fg: #333333;

    --audio-gradient-start: #667eea;
    --audio-gradient-end: #764ba2;
}
</style>
</head>
<body>

<div class="reset-container">
    <div class="reset-header">
        <div class="reset-icon">🔐</div>
        <div class="reset-title">Reset Password</div>
        <div class="reset-subtitle">Create a new secure password for your diary</div>
    </div>

    <div id="success-message" class="success-message"></div>
    <div id="error-message" class="error-message"></div>

    <form id="reset-form" class="reset-form" onsubmit="submitReset(event)">
        <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <div style="position: relative;">
                <input 
                    type="password" 
                    id="new-password" 
                    class="form-input"
                    placeholder="Enter your new secure password" 
                    required 
                />
                <button type="button" class="password-toggle" id="new-password-toggle" 
                    style="position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer;">
                    <span class="icon-hidden">👁️</span>
                    <span class="icon-visible" style="display:none;">🙈</span>
                </button>
            </div>
            <div id="password-strength" class="password-strength"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <div style="position: relative;">
                <input 
                    type="password" 
                    id="confirm-password" 
                    class="form-input"
                    placeholder="Confirm your new password" 
                    required 
                />
                <button type="button" class="password-toggle" id="confirm-password-toggle" 
                    style="position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer;">
                    <span class="icon-hidden">👁️</span>
                    <span class="icon-visible" style="display:none;">🙈</span>
                </button>
            </div>
            <div id="password-match" class="password-match"></div>
        </div>

        <div class="security-tips">
            <h4>🛡️ Password Security Tips</h4>
            <ul>
                <li>Use at least 8 characters</li>
                <li>Include uppercase and lowercase letters</li>
                <li>Add numbers and special characters</li>
                <li>Avoid common words or personal information</li>
            </ul>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">
            <span id="btn-text">Reset My Password</span>
        </button>
    </form>

    <div class="back-link">
        <a href="register_login.html">← Back to Login</a>
    </div>
</div>

<script>
// Replace with your actual API base URL
const API_BASE_URL = "http://localhost:3000";

// Password strength checker
document.getElementById('new-password').addEventListener('input', function(e) {
    const password = e.target.value;
    const strengthDiv = document.getElementById('password-strength');
    
    if (password.length === 0) {
        strengthDiv.textContent = '';
        strengthDiv.className = 'password-strength';
        return;
    }
    
    let strength = 0;
    let feedback = [];
    
    if (password.length >= 8) strength += 1;
    else feedback.push('at least 8 characters');
    
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 1;
    else feedback.push('both upper and lowercase letters');
    
    if (/\d/.test(password)) strength += 1;
    else feedback.push('at least one number');
    
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength += 1;
    else feedback.push('at least one special character');
    
    if (strength <= 1) {
        strengthDiv.className = 'password-strength strength-weak';
        strengthDiv.textContent = `⚠️ Weak password. Add: ${feedback.slice(0, 2).join(', ')}`;
    } else if (strength <= 2) {
        strengthDiv.className = 'password-strength strength-medium';
        strengthDiv.textContent = `⚡ Medium strength. Consider: ${feedback.slice(0, 1).join(', ')}`;
    } else if (strength <= 3) {
        strengthDiv.className = 'password-strength strength-strong';
        strengthDiv.textContent = '✅ Good password strength';
    } else {
        strengthDiv.className = 'password-strength strength-strong';
        strengthDiv.textContent = '🔒 Excellent password strength!';
    }
    
    // Re-check password match when new password changes
    checkPasswordMatch();
});

// Password confirmation checker
document.getElementById('confirm-password').addEventListener('input', checkPasswordMatch);

function checkPasswordMatch() {
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const matchDiv = document.getElementById('password-match');
    
    if (confirmPassword.length === 0) {
        matchDiv.textContent = '';
        matchDiv.className = 'password-match';
        return;
    }
    
    if (newPassword === confirmPassword) {
        matchDiv.className = 'password-match match-success';
        matchDiv.textContent = '✅ Passwords match perfectly!';
    } else {
        matchDiv.className = 'password-match match-error';
        matchDiv.textContent = '❌ Passwords do not match';
    }
}

function showMessage(message, type = 'error') {
    const successDiv = document.getElementById('success-message');
    const errorDiv = document.getElementById('error-message');
    
    // Hide both messages first
    successDiv.style.display = 'none';
    errorDiv.style.display = 'none';
    
    if (type === 'success') {
        successDiv.textContent = message;
        successDiv.style.display = 'block';
        successDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        errorDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        
        // Add shake animation to the form
        document.getElementById('reset-form').classList.add('shake');
        setTimeout(() => {
            document.getElementById('reset-form').classList.remove('shake');
        }, 500);
    }
}

function setButtonLoading(loading) {
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    
    if (loading) {
        btn.disabled = true;
        btnText.innerHTML = '<span class="loading-spinner"></span>Resetting Password...';
    } else {
        btn.disabled = false;
        btnText.textContent = 'Reset My Password';
    }
}

async function submitReset(e) {
    e.preventDefault();
    
    // Hide any previous messages
    document.getElementById('success-message').style.display = 'none';
    document.getElementById('error-message').style.display = 'none';
    
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const token = params.get('token');
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    // Client-side validation
    if (!newPassword || !confirmPassword) {
        showMessage('Please fill in both password fields.', 'error');
        return;
    }

    if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match. Please check and try again.', 'error');
        return;
    }

    if (newPassword.length < 8) {
        showMessage('Password must be at least 8 characters long.', 'error');
        return;
    }

    if (!id || !token) {
        showMessage('Invalid reset link. Please request a new password reset.', 'error');
        return;
    }

    setButtonLoading(true);

    try {
        const res = await fetch(`${API_BASE_URL}/auth/reset-password?id=${id}&token=${token}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ newPassword, confirmPassword })
        });

        const data = await res.json();
        
        if (!res.ok) {
            throw new Error(data.message || 'Failed to reset password. Please try again.');
        }

        // Success
        showMessage('🎉 Password reset successfully! Redirecting to login...', 'success');
        
        // Clear the form
        document.getElementById('reset-form').reset();
        document.getElementById('password-strength').textContent = '';
        document.getElementById('password-match').textContent = '';
        
        // Redirect after a delay
        setTimeout(() => {
            window.location.href = 'register_login.html';
        }, 2500);
        
    } catch (err) {
        console.error('Reset error:', err);
        showMessage(err.message || 'Something went wrong. Please try again.', 'error');
    } finally {
        setButtonLoading(false);
    }
}

// Auto-focus on the first input when page loads
window.addEventListener('load', () => {
    document.getElementById('new-password').focus();
});

// Handle Enter key on inputs
document.querySelectorAll('.form-input').forEach(input => {
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const form = document.getElementById('reset-form');
            const submitEvent = new Event('submit', { cancelable: true });
            form.dispatchEvent(submitEvent);
        }
    });
});

function setupPasswordToggle(inputId, toggleId) {
    const input = document.getElementById(inputId);
    const toggleBtn = document.getElementById(toggleId);
    const iconHidden = toggleBtn.querySelector('.icon-hidden');
    const iconVisible = toggleBtn.querySelector('.icon-visible');

    toggleBtn.addEventListener('click', () => {
        if (input.type === 'password') {
            input.type = 'text';
            iconHidden.style.display = 'none';
            iconVisible.style.display = 'inline';
        } else {
            input.type = 'password';
            iconHidden.style.display = 'inline';
            iconVisible.style.display = 'none';
        }
    });
}

// Setup toggles for both fields
setupPasswordToggle('new-password', 'new-password-toggle');
setupPasswordToggle('confirm-password', 'confirm-password-toggle');
</script>

</body>
</html>
