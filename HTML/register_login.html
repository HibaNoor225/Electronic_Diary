<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Daily Diary</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Georgia', 'Times New Roman', serif; }

body {
    background: linear-gradient(135deg, #f7f3e9, #e8dcc6);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    transition: background 0.3s ease;
    line-height: 1.6;
}

.main-content {
    width: 100%;
    max-width: 450px;
    background: #fdfbf7;
    border-radius: 20px;
    padding: 50px 45px;
    box-shadow: 0 20px 60px rgba(139,69,19,0.15);
    border: 3px solid #d4c5a9;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    animation: fadeIn 0.6s ease;
    position: relative;
}

.main-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 35px;
    width: 2px;
    height: 100%;
    background: #e74c3c;
    opacity: 0.3;
}

@keyframes fadeIn {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
}

.auth-toggle {
    display: flex;
    background: #e8dcc6;
    border-radius: 15px;
    padding: 6px;
    margin-bottom: 35px;
    width: 100%;
    transition: all 0.3s ease;
    box-shadow: inset 0 2px 4px rgba(139,69,19,0.1);
}

.toggle-btn {
    flex: 1;
    padding: 15px 20px;
    background: transparent;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    color: #8d6e63;
    font-family: 'Georgia', 'Times New Roman', serif;
}

.toggle-btn.active {
    background: #8b4513;
    color: white;
    box-shadow: 0 4px 15px rgba(139,69,19,0.3);
    transform: translateY(-1px);
}

.toggle-btn:hover:not(.active) {
    background: rgba(139,69,19,0.1);
    color: #5d4037;
}

.title {
    font-size: 2.2rem;
    color: #5d4037;
    margin-bottom: 25px;
    font-weight: bold;
    text-align: center;
    transition: all 0.3s ease;
    text-shadow: 1px 1px 3px rgba(93,64,55,0.2);
}

.social-buttons { 
    width: 100%; 
    margin-bottom: 25px; 
}

.social-btn {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid #d4c5a9;
    border-radius: 12px;
    background: #fff8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 1rem;
    color: #5d4037;
    cursor: pointer;
    transition: all 0.3s ease, transform 0.2s ease;
    margin-bottom: 15px;
    text-decoration: none;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-weight: 500;
    box-shadow: 0 4px 12px rgba(139,69,19,0.1);
}

.social-btn:hover { 
    background: #ffffff; 
    transform: translateY(-2px); 
    box-shadow: 0 6px 20px rgba(139,69,19,0.15);
    border-color: #8b4513;
}

.social-btn:active { 
    transform: translateY(0); 
}

.google-btn .icon { 
    width: 20px; 
    height: 20px; 
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23EA4335" d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115Z"/><path fill="%2334A853" d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 0 1-6.723-4.823l-4.04 3.067A11.965 11.965 0 0 0 12 24c2.933 0 5.735-1.043 7.834-3l-3.793-2.987Z"/><path fill="%23FBBC05" d="M19.834 21c2.195-2.048 3.62-5.096 3.62-9 0-.71-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 21Z"/><path fill="%23EA4335" d="M5.277 14.268A7.12 7.12 0 0 1 4.909 12c0-.782.125-1.533.357-2.235L1.24 6.65A11.934 11.934 0 0 0 0 12c0 1.92.445 3.73 1.237 5.335l4.04-3.067Z"/></svg>') center/contain no-repeat; 
}

.facebook-btn .icon { 
    width: 20px; 
    height: 20px; 
    background: #1877F2; 
    border-radius: 3px; 
    position: relative; 
}

.facebook-btn .icon::after { 
    content: 'f'; 
    position: absolute; 
    color: white; 
    font-family: Arial, sans-serif; 
    font-weight: bold; 
    font-size: 14px; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
}

.divider { 
    width: 100%; 
    text-align: center; 
    margin: 25px 0; 
    position: relative; 
    font-size: 1.1rem; 
    color: #8d6e63; 
    font-style: italic;
}

.divider::before, .divider::after { 
    content: ''; 
    position: absolute; 
    top: 50%; 
    width: 42%; 
    height: 2px; 
    background: linear-gradient(to right, #d4c5a9, #e6d8c5);
}

.divider::before { left: 0; } 
.divider::after { right: 0; }

.auth-form { 
    width: 100%; 
}

.form-group { 
    margin-bottom: 25px; 
    position: relative; 
}

.form-label { 
    display: block; 
    font-size: 1rem; 
    color: #5d4037; 
    margin-bottom: 10px; 
    font-weight: 500; 
    transition: all 0.3s ease;
    padding-left: 5px;
}

.form-input { 
    width: 100%; 
    padding: 16px 20px; 
    border: 2px solid #d4c5a9; 
    border-radius: 12px; 
    font-size: 1rem; 
    background: #fff8f0; 
    color: #2c2c2c; 
    transition: all 0.3s ease;
    font-family: 'Georgia', 'Times New Roman', serif;
    box-shadow: inset 0 2px 4px rgba(139,69,19,0.05);
}

.form-input:focus { 
    border-color: #8b4513; 
    outline: none; 
    box-shadow: 0 0 0 3px rgba(139,69,19,0.1), inset 0 2px 4px rgba(139,69,19,0.05);
    background: #ffffff;
    transform: translateY(-1px);
}

.form-input::placeholder {
    color: #a5a5a5;
    font-style: italic;
}

.password-group { 
    position: relative; 
}

.password-toggle { 
    position: absolute; 
    right: 15px; 
    top: 50%; 
    transform: translateY(-50%); 
    background: none; 
    border: none; 
    color: #8d6e63; 
    cursor: pointer; 
    font-size: 1.2rem; 
    transition: all 0.3s ease;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.password-toggle:hover { 
    background: rgba(139,69,19,0.1);
    color: #5d4037;
}

.password-toggle .icon-visible { 
    display: none; 
}

.password-toggle.show .icon-visible { 
    display: inline; 
}

.password-toggle.show .icon-hidden { 
    display: none; 
}

.continue-btn { 
    width: 100%; 
    padding: 18px 20px; 
    background: linear-gradient(135deg, #8b4513, #a0522d);
    color: white; 
    border: none; 
    border-radius: 25px; 
    font-size: 1.1rem; 
    font-weight: 600; 
    cursor: pointer; 
    transition: all 0.3s ease; 
    margin-top: 15px;
    font-family: 'Georgia', 'Times New Roman', serif;
    box-shadow: 0 6px 20px rgba(139,69,19,0.3);
    position: relative;
    overflow: hidden;
}

.continue-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.6s;
}

.continue-btn:hover { 
    background: linear-gradient(135deg, #a0522d, #8b4513);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(139,69,19,0.4);
}

.continue-btn:hover::before {
    left: 100%;
}

.continue-btn:active {
    transform: translateY(0);
}

.signup-only { 
    display: none; 
}

.login-only { 
    display: block; 
}

.signup-mode .signup-only { 
    display: block; 
}

.signup-mode .login-only { 
    display: none; 
}

.error-msg { 
    color: #c62828; 
    font-size: 0.9rem; 
    margin-top: 8px; 
    display: none; 
    position: absolute; 
    bottom: -22px; 
    left: 5px; 
    transition: all 0.3s ease;
    font-style: italic;
}

.server-msg { 
    color: #c62828; 
    font-size: 1rem; 
    text-align: center; 
    margin-bottom: 15px; 
    display: none; 
    transition: all 0.3s ease;
    background: rgba(198,40,40,0.1);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(198,40,40,0.2);
}

.forgot-password-btn {
    background: none;
    border: none;
    color: #8b4513;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: underline;
    font-family: 'Georgia', 'Times New Roman', serif;
    margin-top: 10px;
    transition: all 0.3s ease;
    padding: 5px 10px;
    border-radius: 5px;
}

.forgot-password-btn:hover {
    background: rgba(139,69,19,0.1);
    color: #5d4037;
}

/* Modal Styles */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(93, 64, 55, 0.8);
    backdrop-filter: blur(5px);
    z-index: 1000;
    animation: fadeIn 0.3s ease;
    padding: 20px;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: #fdfbf7;
    border-radius: 20px;
    padding: 40px 45px;
    box-shadow: 0 20px 60px rgba(139,69,19,0.25);
    border: 3px solid #d4c5a9;
    position: relative;
    max-width: 400px;
    width: 100%;
    transform: translateY(-20px);
    animation: slideUp 0.3s ease forwards;
}

.modal-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 35px;
    width: 2px;
    height: 100%;
    background: #e74c3c;
    opacity: 0.3;
}

.modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    background: none;
    border: none;
    font-size: 2rem;
    color: #8d6e63;
    cursor: pointer;
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.3s ease;
}

.modal-close:hover {
    background: rgba(139, 69, 19, 0.1);
    color: #5d4037;
    transform: rotate(90deg);
}

.modal-header {
    text-align: center;
    margin-bottom: 30px;
    border-bottom: 2px solid #d4c5a9;
    padding-bottom: 15px;
}

.modal-title {
    font-size: 1.6rem;
    color: #5d4037;
    font-weight: bold;
    text-shadow: 1px 1px 3px rgba(93,64,55,0.1);
}

.btn {
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 500;
    font-size: 1rem;
    font-family: 'Georgia', 'Times New Roman', serif;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.btn-primary {
    background: #8b4513;
    color: white;
}

.btn-primary:hover {
    background: #a0522d;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(139,69,19,0.3);
}

@keyframes slideUp {
    from { 
        transform: translateY(20px);
        opacity: 0;
    }
    to { 
        transform: translateY(0);
        opacity: 1;
    }
}

/* Responsive adjustments */
@media (max-width: 480px) {
    .main-content { 
        padding: 40px 30px; 
        width: 100%; 
        max-width: 95%; 
        margin: 10px;
    }
    
    .main-content::before {
        left: 25px;
    }
    
    .title { 
        font-size: 1.8rem; 
    }
    
    .modal-content {
        padding: 30px 25px;
        margin: 20px;
        max-width: none;
    }
    
    .modal-content::before {
        left: 20px;
    }
}

@media (max-width: 350px) {
    .toggle-btn {
        padding: 12px 15px;
        font-size: 0.9rem;
    }
    
    .form-input {
        padding: 14px 18px;
    }
    
    .continue-btn {
        padding: 16px 18px;
        font-size: 1rem;
    }
}
</style>
</head>
<body>

<div class="main-content" id="main-content">
    <div class="auth-toggle">
        <button type="button" class="toggle-btn active" id="login-tab" data-mode="login">Login</button>
        <button type="button" class="toggle-btn" id="signup-tab" data-mode="signup">Sign Up</button>
    </div>

    <h1 class="title" id="page-title">Welcome Back</h1>
    <div class="server-msg" id="server-msg"></div>

    <div class="social-buttons">
        <a class="social-btn google-btn" href="#"><div class="icon"></div><span>Continue with Google</span></a>
        <a class="social-btn facebook-btn" href="#"><div class="icon"></div><span>Continue with Facebook</span></a>
    </div>

    <div class="divider">or</div>

    <form class="auth-form" id="auth-form" autocomplete="off">
        <div class="form-group signup-only">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-input" id="username" placeholder="Enter your username" autocomplete="off">
            <div class="error-msg" id="username-error"></div>
        </div>

        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-input" id="email" placeholder="Enter your email" required autocomplete="off">
            <div class="error-msg" id="email-error"></div>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-group">
                <input type="password" name="password" class="form-input" id="password" placeholder="Enter your password" required autocomplete="new-password">
                <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                    <span class="icon-hidden">👁️</span>
                    <span class="icon-visible">🙈</span>
                </button>
            </div>
            <input type="password"  id="login-password" placeholder="Password"  style="display: none;" />
            <button type="button" class="forgot-password-btn login-only" onclick="showForgotPasswordForm()">Forgot Password?</button>
            <div class="error-msg" id="password-error"></div>
        </div>

        <div class="form-group signup-only">
            <label class="form-label">Confirm Password</label>
            <div class="password-group">
                <input type="password" name="confirmPassword" class="form-input" id="confirmPassword" placeholder="Confirm your password" autocomplete="new-password">
                <button type="button" class="password-toggle" id="confirm-password-toggle" aria-label="Toggle confirm password visibility">
                    <span class="icon-hidden">👁️</span>
                    <span class="icon-visible">🙈</span>
                </button>
            </div>
            <div class="error-msg" id="confirmPassword-error"></div>
        </div>

        <button type="submit" class="continue-btn" id="submit-btn">Login</button>
    </form>
</div>

<!-- Forgot Password Modal -->
<div id="forgot-password-modal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeForgotModal()">&times;</button>
    <div class="modal-header">
      <div class="modal-title">Forgot Password</div>
    </div>

    <form id="forgot-password-form" onsubmit="submitForgotPassword(event)">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="forgot-email" class="form-input" placeholder="Enter your email" required />
      </div>
      <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>
  </div>
</div>

<script>
let currentMode = 'login';
const API_BASE_URL = "http://localhost:3000";

const mainContent = document.getElementById('main-content');
const loginTab = document.getElementById('login-tab');
const signupTab = document.getElementById('signup-tab');
const pageTitle = document.getElementById('page-title');
const submitBtn = document.getElementById('submit-btn');
const serverMsg = document.getElementById('server-msg');
const form = document.getElementById('auth-form');

const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const usernameInput = document.getElementById('username');
const confirmPasswordInput = document.getElementById('confirmPassword');

// -----------------
// ERROR HANDLING
// -----------------
function showError(fieldId, message) {
    const errorEl = document.getElementById(fieldId);
    if (errorEl) {
        errorEl.textContent = message;
        errorEl.style.display = message ? 'block' : 'none';
    }
}

function clearAllErrors() {
    ['username-error', 'email-error', 'password-error', 'confirmPassword-error'].forEach(id => showError(id, ''));
    serverMsg.style.display = 'none';
}

// -----------------
// SWITCH MODE
// -----------------
function switchMode(mode) {
    currentMode = mode;
    clearAllErrors();

    loginTab.classList.toggle('active', mode === 'login');
    signupTab.classList.toggle('active', mode === 'signup');

    pageTitle.textContent = mode === 'signup' ? 'Create Account' : 'Welcome Back';
    submitBtn.textContent = mode === 'signup' ? 'Sign Up' : 'Login';
    mainContent.classList.toggle('signup-mode', mode === 'signup');

    usernameInput.required = mode === 'signup';
    confirmPasswordInput.required = mode === 'signup';

    // Clear inputs when switching
    usernameInput.value = '';
    emailInput.value = '';
    passwordInput.value = '';
    confirmPasswordInput.value = '';

    // Only prefill email in login mode
    if (mode === 'login') {
        const userData = JSON.parse(localStorage.getItem('user'));
        if (userData) emailInput.value = userData.email || '';
    }
}

loginTab.addEventListener('click', () => switchMode('login'));
signupTab.addEventListener('click', () => switchMode('signup'));
async function submitForgotPassword(e) {
  e.preventDefault();
  const emailInputEl = document.getElementById('forgot-email');
  const email = emailInputEl.value.trim();
  const btn = e.currentTarget.querySelector('button[type="submit"]');
  const btnText = btn.textContent;

  if (!email) {
    alert("Enter your email");
    return;
  }

  // Disable button and show loading
  btn.disabled = true;
  btn.textContent = 'Sending mail...';

  try {
    const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Failed to send reset link');

    // Success message
    showForgotMessage('✅ Password reset link sent! Check your email.', 'success');

    // Optionally close modal after a delay
    setTimeout(() => closeForgotModal(), 2500);
  } catch (err) {
    console.error(err);
    showForgotMessage(err.message || 'Something went wrong.', 'error');
  } finally {
    // Re-enable button
    btn.disabled = false;
    btn.textContent = btnText;
  }
}

// Helper function to show message instead of alert
function showForgotMessage(message, type='error') {
  let msgDiv = document.getElementById('forgot-msg');
  if (!msgDiv) {
    msgDiv = document.createElement('div');
    msgDiv.id = 'forgot-msg';
    msgDiv.style.marginTop = '10px';
    msgDiv.style.fontWeight = 'bold';
    document.getElementById('forgot-password-form').appendChild(msgDiv);
  }
  msgDiv.style.color = type === 'success' ? 'green' : 'red';
  msgDiv.textContent = message;
}


// -----------------
// PASSWORD TOGGLE
// -----------------
function togglePasswordVisibility(inputEl, toggleBtnEl) {
    const isPassword = inputEl.type === 'password';
    inputEl.type = isPassword ? 'text' : 'password';
    toggleBtnEl.classList.toggle('show', isPassword);
}

document.getElementById('password-toggle').addEventListener('click', (e) => {
    e.preventDefault();
    togglePasswordVisibility(passwordInput, e.currentTarget);
});

document.getElementById('confirm-password-toggle').addEventListener('click', (e) => {
    e.preventDefault();
    togglePasswordVisibility(confirmPasswordInput, e.currentTarget);
});

function showForgotPasswordForm() {
  document.getElementById('forgot-password-modal').classList.add('active');
}

function closeForgotModal() {
  document.getElementById('forgot-password-modal').classList.remove('active');
}

// Close modal when clicking outside
document.getElementById('forgot-password-modal').onclick = function(e) {
    if (e.target === this) closeForgotModal();
};


// -----------------
// FORM SUBMIT
// -----------------
form.addEventListener('submit', async function(e) {
    e.preventDefault();
    clearAllErrors();

    const payload = {
        email: emailInput.value.trim(),
        password: passwordInput.value.trim()
    };

    if (currentMode === 'signup') {
        payload.username = usernameInput.value.trim();
        payload.confirmPassword = confirmPasswordInput.value.trim();
    }

    const url = `http://localhost:3000/auth/${currentMode === 'login' ? 'login' : 'register'}`;

    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        

        const data = await res.json();
        console.log('Received login data:', data);


        if (data.success) {
            if (data.data && data.data.token) {
                localStorage.setItem('token', data.data.token);
                localStorage.setItem('userId', data.data.user.id); 
                localStorage.setItem('user', JSON.stringify(data.data.user));
            }

            if (data.data.isAdmin) {
                window.location.href = '/HTML/adminPanel.html'; // redirect admin
            } else if (currentMode === 'login') {
                window.location.href = data.data.user.hasProfile ? '/HTML/dashboard.html' : '/HTML/profile.html';
            } else {
                window.location.href = '/HTML/profile.html';
            }
        } else {
            if (data.errors && typeof data.errors === 'object') {
                Object.keys(data.errors).forEach(field => {
                    showError(`${field}-error`, data.errors[field]);
                });
            } else {
                serverMsg.textContent = data.message || 'Something went wrong.';
                serverMsg.style.display = 'block';
            }
        }
    } catch(err) {
        serverMsg.textContent = 'Server error, please try again.';
        serverMsg.style.display = 'block';
        console.error(err);
    }
});

// -----------------
// OAUTH BUTTONS
// -----------------
function handleOAuth(buttonSelector, provider) {
    document.querySelector(buttonSelector).addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = `http://localhost:3000/auth/${provider}`;
    });
}

handleOAuth('.google-btn', 'google');
handleOAuth('.facebook-btn', 'facebook');

// -----------------
// HANDLE TOKEN FROM URL AFTER SOCIAL LOGIN
// -----------------
(function handleOAuthToken() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (!token) return;

    localStorage.setItem('token', token);
    window.history.replaceState({}, document.title, window.location.pathname);

    fetch('http://localhost:3000/auth/me', {
        headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            localStorage.setItem('user', JSON.stringify(data.data.user));
            if (data.data.user.isAdmin) {
                window.location.href = '/HTML/adminPanel.html';
            } else {
                window.location.href = data.data.user.hasProfile ? '/HTML/dashboard.html' : '/HTML/profile.html';
            }
        } else {
            serverMsg.textContent = 'Failed to get user info after login.';
            serverMsg.style.display = 'block';
        }
    })
    .catch(err => console.error(err));
})();

// -----------------
// LOAD USER DATA ON DOM LOAD
// -----------------
window.addEventListener('DOMContentLoaded', () => {
    switchMode(currentMode); // Ensure initial mode setup
});
</script>
