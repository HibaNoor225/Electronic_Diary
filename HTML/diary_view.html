<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Diary</title>
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./themes.css">
<script type="module" src="./theme.js"></script>
</head>
<body>
<div class="container">
    <div class="header-menu">
        <span id="hamburger">&#9776;</span> 
        <div id="menu-dropdown" class="menu-dropdown">
            <a href="profile.html">Edit Profile</a>
            <a href="post.html">Explore</a>
            <a href="search.html">Search</a>
            <a href="chat.html">Chat</a>
            <div class="theme-menu">
                <a href="#" id="theme-btn">Themes</a>
                <div class="theme-submenu" id="theme-submenu">
                    <a href="#" data-theme="parchment">Parchment</a>
                    <a href="#" data-theme="espresso">Espresso</a>
                    <a href="#" data-theme="ocean">Ocean</a>
                    <a href="#" data-theme="forest">Forest</a>
                    <a href="#" data-theme="sakura">Sakura</a>
                </div>
            </div>
            <a href="invitations.html">Invitations</a>
            <a href="notifications.html">Notifications</a>
            <a href="resetPassword.html">Reset Password</a>
            <a href="#" id="logout-btn">Logout</a>
        </div>
    </div>
    <div class="top-buttons">
        <a href="dashboard.html" class="btn">← Back to Dashboard</a>
        <button id="make-public-btn" class="btn">🌍 Make Public</button>
        <button id="send-invitation-btn" class="btn">📩 Send Invitation</button>
    </div>
    <div class="diary-header">
        <div class="diary-date" id="diary-date">Loading...</div>
        <div class="diary-subtitle">My Daily Story</div>
    </div>
    <div class="diary-content" id="diary-content"></div>
</div>
<div class="modal" id="mediaModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div id="modalMediaContainer"></div>
        <div class="modal-caption" id="modalCaption"></div>
    </div>
</div>
<div class="modal invitation-modal" id="invitationModal">
    <div class="invitation-modal-content">
        <button class="invitation-close" onclick="closeInvitationModal()">&times;</button>
        <div class="invitation-header">Select Users to Invite</div>
        <div id="user-list-container" class="user-list"></div>
        <button class="send-invitation-btn" id="send-invitations">Send Invitations</button>
    </div>
</div>
<div class="modal invitation-modal" id="tagModal">
    <div class="invitation-modal-content">
        <button class="invitation-close" onclick="closeTagModal()">&times;</button>
        <div class="invitation-header">Tag Friends</div>
        <div id="tag-list-container" class="user-list"></div>
        <button class="send-invitation-btn" id="publish-with-tags">Publish</button>
        <button class="send-invitation-btn secondary-btn" id="publish-without-tags">Publish Without Tagging</button>
    </div>
</div>
<script type="module">
import { setTheme } from './theme.js';

const API_BASE_URL = "http://localhost:3000/api";
const token = localStorage.getItem('token');
const urlParams = new URLSearchParams(window.location.search);
let date = urlParams.get('date');
const sharedBy = urlParams.get('sharedBy');
if (date) {
    const parsed = new Date(date);
    if (!isNaN(parsed)) date = parsed.toISOString().split('T')[0];
}
const readableDate = new Date(date).toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
});
document.getElementById('diary-date').textContent = readableDate;
const contentContainer = document.getElementById('diary-content');
function getFileUrl(file) {
    if (!file.url) return '';
    let path = '';
    if (typeof file.url === 'object') {
        path = file.url.optimized || file.url.original;
    } else {
        path = file.url;
    }
    if (!path) return '';
    path = path.replace(/\\/g, '/');
    return `http://localhost:3000/uploads/${path}`;
}
function createMediaGallery(media, eventTitle) {
    if (!media || media.length === 0) return null;
    const galleryContainer = document.createElement('div');
    galleryContainer.className = 'media-gallery';
    const imageMedia = media.filter(m => m.type === 'image');
    const videoMedia = media.filter(m => m.type === 'video');
    const audioMedia = media.filter(m => m.type === 'audio');
    const galleryHeader = document.createElement('div');
    galleryHeader.className = 'gallery-header';
    const galleryTitle = document.createElement('div');
    galleryTitle.className = 'gallery-title';
    galleryTitle.innerHTML = '📁 Media Gallery';
    const tabsContainer = document.createElement('div');
    tabsContainer.className = 'media-tabs';
    const tabs = [
        { type: 'images', label: '🖼️ Images', data: imageMedia, icon: '🖼️', text: 'Images' },
        { type: 'videos', label: '🎬 Videos', data: videoMedia, icon: '🎬', text: 'Videos' },
        { type: 'audio', label: '🎵 Audio', data: audioMedia, icon: '🎵', text: 'Audio' }
    ];
    let activeTab = null;
    tabs.forEach((tab, index) => {
        if (tab.data.length > 0) {
            const tabBtn = document.createElement('button');
            tabBtn.className = 'tab-btn';
            tabBtn.innerHTML = `
                <span>${tab.icon}</span>
                <span>${tab.text}</span>
                <span class="tab-count">${tab.data.length}</span>
            `;
            tabBtn.onclick = (e) => switchTab(tab.type, galleryContainer, e);
            tabsContainer.appendChild(tabBtn);
            if (!activeTab) {
                activeTab = tab.type;
                tabBtn.classList.add('active');
            }
        }
    });
    galleryHeader.appendChild(galleryTitle);
    galleryHeader.appendChild(tabsContainer);
    galleryContainer.appendChild(galleryHeader);
    tabs.forEach(tab => {
        if (tab.data.length > 0) {
            const mediaGrid = document.createElement('div');
            mediaGrid.className = 'media-grid';
            mediaGrid.id = `${tab.type}-grid`;
            if (tab.type === activeTab) mediaGrid.classList.add('active');
            tab.data.forEach(file => {
                const mediaItem = document.createElement('div');
                mediaItem.className = 'media-item';
                mediaItem.onclick = () => openModal(file, eventTitle);
                if (file.type === 'image') {
                    const img = document.createElement('img');
                    img.className = 'media-thumbnail';
                    img.src = getFileUrl(file);
                    img.alt = file.caption || eventTitle;
                    mediaItem.appendChild(img);
                } else if (file.type === 'video') {
                    const video = document.createElement('video');
                    video.className = 'media-thumbnail';
                    video.src = getFileUrl(file);
                    video.muted = true;
                    mediaItem.appendChild(video);
                } else if (file.type === 'audio') {
                    const audioThumb = document.createElement('div');
                    audioThumb.className = 'audio-thumbnail';
                    audioThumb.innerHTML = '🎵';
                    mediaItem.appendChild(audioThumb);
                }
                const caption = document.createElement('div');
                caption.className = 'media-caption';
                caption.textContent = file.caption || `${file.type} from ${eventTitle}`;
                mediaItem.appendChild(caption);
                mediaGrid.appendChild(mediaItem);
            });
            galleryContainer.appendChild(mediaGrid);
        }
    });
    if (media.length === 0) {
        const noMedia = document.createElement('div');
        noMedia.className = 'no-media';
        noMedia.textContent = 'No media files for this memory';
        galleryContainer.appendChild(noMedia);
    }
    return galleryContainer;
}
function switchTab(tabType, galleryContainer, event) {
    galleryContainer.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    galleryContainer.querySelectorAll('.media-grid').forEach(grid => grid.classList.remove('active'));
    if (event) {
        const btn = event.currentTarget;
        if (btn) btn.classList.add('active');
    }
    const targetGrid = galleryContainer.querySelector(`#${tab.type}-grid`);
    if (targetGrid) targetGrid.classList.add('active');
}
function openModal(file, eventTitle) {
    const modal = document.getElementById('mediaModal');
    const modalMediaContainer = document.getElementById('modalMediaContainer');
    const modalCaption = document.getElementById('modalCaption');
    modalMediaContainer.innerHTML = '';
    if (file.type === 'image') {
        const img = document.createElement('img');
        img.className = 'modal-media';
        img.src = getFileUrl(file);
        img.alt = file.caption || eventTitle;
        modalMediaContainer.appendChild(img);
    } else if (file.type === 'video') {
        const video = document.createElement('video');
        video.className = 'modal-media';
        video.src = getFileUrl(file);
        video.controls = true;
        video.style.width = '100%';
        modalMediaContainer.appendChild(video);
    } else if (file.type === 'audio') {
        const audioContainer = document.createElement('div');
        audioContainer.className = 'audio-container';
        audioContainer.style.display = 'flex';
        audioContainer.style.alignItems = 'center';
        audioContainer.style.justifyContent = 'center';
        audioContainer.style.minHeight = '200px';
        audioContainer.style.background = 'linear-gradient(135deg, var(--audio-gradient-start) 0%, var(--audio-gradient-end) 100%)';
        const audio = document.createElement('audio');
        audio.src = getFileUrl(file);
        audio.controls = true;
        audioContainer.appendChild(audio);
        modalMediaContainer.appendChild(audioContainer);
    }
    modalCaption.textContent = file.caption || `Media from: ${eventTitle}`;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeModal() {
    const modal = document.getElementById('mediaModal');
    modal.classList.remove('active');
    const modalMedia = modal.querySelectorAll('video, audio');
    modalMedia.forEach(media => { media.pause(); media.currentTime = 0; });
    document.body.style.overflow = 'auto';
}
function closeInvitationModal() {
    document.getElementById('invitationModal').style.display = 'none';
    document.body.style.overflow = 'auto';
    const searchInput = document.querySelector('#invitationModal .search-input');
    if (searchInput) searchInput.remove();
}
function closeTagModal() {
    document.getElementById('tagModal').style.display = 'none';
    document.body.style.overflow = 'auto';
    const searchInput = document.querySelector('#tagModal .search-input');
    if (searchInput) searchInput.remove();
}
document.getElementById('mediaModal').onclick = e => { if (e.target === document.getElementById('mediaModal')) closeModal(); };
document.getElementById('invitationModal').onclick = e => { if (e.target === document.getElementById('invitationModal')) closeInvitationModal(); };
document.getElementById('tagModal').onclick = e => { if (e.target === document.getElementById('tagModal')) closeTagModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeInvitationModal(); closeTagModal(); } });
function debounce(func, delay) {
    let timer;
    return function() {
        const context = this;
        const args = arguments;
        clearTimeout(timer);
        timer = setTimeout(() => func.apply(context, args), delay);
    };
}
async function fetchAllUsers() {
    try {
        const res = await fetch(`${API_BASE_URL}/users`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            return data.users.filter(user => user._id !== localStorage.getItem('userId'));
        }
        return [];
    } catch (err) {
        console.error('Error fetching users:', err);
        return [];
    }
}
async function fetchAllFriends() {
    try {
        const userId = localStorage.getItem('userId');
        const res = await fetch(`http://localhost:3000/chat/api/friends/${userId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            return data.friends;
        }
        return [];
    } catch (err) {
        console.error('Error fetching friends:', err);
        return [];
    }
}
document.getElementById('send-invitation-btn').addEventListener('click', async () => {
    const modal = document.getElementById('invitationModal');
    const userListContainer = document.getElementById('user-list-container');
    userListContainer.innerHTML = '';
    const allUsers = await fetchAllUsers();
    let filteredUsers = allUsers;
    const pageSize = 10;
    let currentPage = 1;
    const loadMoreUsers = () => {
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const chunk = filteredUsers.slice(start, end);
        if (chunk.length === 0) return;
        chunk.forEach(user => {
            const userItem = document.createElement('div');
            userItem.className = 'user-item';
            userItem.innerHTML = `
                <input type="checkbox" data-user-id="${user._id}">
                <span class="user-name">${user.username || 'User'}</span>
            `;
            userListContainer.appendChild(userItem);
        });
        currentPage++;
    };
    const searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.placeholder = 'Search users...';
    searchInput.className = 'search-input';
    const invitationModalContent = document.querySelector('#invitationModal .invitation-modal-content');
    invitationModalContent.insertBefore(searchInput, userListContainer);
    const handleSearch = debounce((e) => {
        const searchTerm = e.target.value.toLowerCase();
        filteredUsers = allUsers.filter(user => (user.username || '').toLowerCase().includes(searchTerm));
        currentPage = 1;
        userListContainer.innerHTML = '';
        loadMoreUsers();
    }, 300);
    searchInput.addEventListener('input', handleSearch);
    loadMoreUsers();
    const scrollHandler = () => {
        if (userListContainer.scrollTop + userListContainer.clientHeight >= userListContainer.scrollHeight - 5) {
            loadMoreUsers();
        }
    };
    userListContainer.addEventListener('scroll', scrollHandler);
    if (userListContainer.children.length === 0) {
        userListContainer.innerHTML = '<p>No users available to invite.</p>';
    }
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
});
document.getElementById('make-public-btn').addEventListener('click', async () => {
    const modal = document.getElementById('tagModal');
    const tagListContainer = document.getElementById('tag-list-container');
    tagListContainer.innerHTML = '';
    const allFriends = await fetchAllFriends();
    let filteredFriends = allFriends;
    const pageSize = 10;
    let currentPage = 1;
    const loadMoreFriends = () => {
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const chunk = filteredFriends.slice(start, end);
        if (chunk.length === 0) return;
        chunk.forEach(friend => {
            const userItem = document.createElement('div');
            userItem.className = 'user-item';
            userItem.innerHTML = `
                <input type="checkbox" data-user-id="${friend._id}">
                <span class="user-name">${friend.username}</span>
            `;
            tagListContainer.appendChild(userItem);
        });
        currentPage++;
    };
    const searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.placeholder = 'Search friends...';
    searchInput.className = 'search-input';
    const tagModalContent = document.querySelector('#tagModal .invitation-modal-content');
    tagModalContent.insertBefore(searchInput, tagListContainer);
    const handleSearch = debounce((e) => {
        const searchTerm = e.target.value.toLowerCase();
        filteredFriends = allFriends.filter(friend => (friend.username || '').toLowerCase().includes(searchTerm));
        currentPage = 1;
        tagListContainer.innerHTML = '';
        loadMoreFriends();
    }, 300);
    searchInput.addEventListener('input', handleSearch);
    loadMoreFriends();
    const scrollHandler = () => {
        if (tagListContainer.scrollTop + tagListContainer.clientHeight >= tagListContainer.scrollHeight - 5) {
            loadMoreFriends();
        }
    };
    tagListContainer.addEventListener('scroll', scrollHandler);
    if (tagListContainer.children.length === 0) {
        tagListContainer.innerHTML = '<p>No friends available to tag.</p>';
    }
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
});
document.getElementById('publish-with-tags').addEventListener('click', async () => {
    try {
        const resDiary = await fetch(`${API_BASE_URL}/diary/${encodeURIComponent(date)}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const diaryData = await resDiary.json();
        const diaryEventIds = (diaryData.data.events || []).map(e => e._id);
        const selectedTags = Array.from(document.querySelectorAll('#tag-list-container input[type="checkbox"]:checked'))
            .map(cb => cb.dataset.userId);
        const res = await fetch(`${API_BASE_URL}/posts`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ date, diaryEventIds, taggedUserIds: selectedTags })
        });
        const data = await res.json();
        if (res.ok) {
            alert("Diary published with tags!");
            closeTagModal();
            window.location.href = "post.html";
        } else {
            alert(`Failed: ${data.message || 'Could not publish'}`);
        }
    } catch (err) {
        console.error("Error publishing post:", err);
        alert("Error publishing post.");
    }
});
document.getElementById('publish-without-tags').addEventListener('click', async () => {
    try {
        const resDiary = await fetch(`${API_BASE_URL}/diary/${encodeURIComponent(date)}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const diaryData = await resDiary.json();
        const diaryEventIds = (diaryData.data.events || []).map(e => e._id);
        const res = await fetch(`${API_BASE_URL}/posts`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ date, diaryEventIds, taggedUserIds: [] })
        });
        const data = await res.json();
        if (res.ok) {
            alert("Diary published without tagging anyone!");
            closeTagModal();
            window.location.href = "post.html";
        } else {
            alert(`Failed: ${data.message || 'Could not publish'}`);
        }
    } catch (err) {
        console.error("Error publishing post:", err);
        alert("Error publishing post.");
    }
});
document.getElementById('send-invitations').addEventListener('click', async () => {
    const selectedUsers = Array.from(document.querySelectorAll('#user-list-container input[type="checkbox"]:checked'))
        .map(checkbox => checkbox.dataset.userId);
    if (selectedUsers.length === 0) {
        alert('Please select at least one user');
        return;
    }
    try {
        const res = await fetch(`${API_BASE_URL}/invitations`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ recipientIds: selectedUsers, diaryDate: date })
        });
        const data = await res.json();
        if (data.success) {
            alert('Invitations sent successfully!');
            closeInvitationModal();
        } else {
            alert(data.message || 'Failed to send invitations');
        }
    } catch (err) {
        console.error('Error sending invitations:', err);
        alert('Error sending invitations');
    }
});
async function loadDiaryStory() {
    contentContainer.innerHTML = '';
    try {
        const url = sharedBy ? `${API_BASE_URL}/diary/${encodeURIComponent(date)}?sharedBy=${sharedBy}` : `${API_BASE_URL}/diary/${encodeURIComponent(date)}`;
        const res = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 404) {
            contentContainer.innerHTML = `<div class="no-events"><p>No memories were captured on this day...</p></div>`;
            return;
        }
        if (res.status === 401) {
            alert("Session expired. Please log in again.");
            localStorage.removeItem('token');
            window.location.href = 'register_login.html';
            return;
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        const dayEvents = data.data?.events || [];
        if (dayEvents.length === 0) {
            contentContainer.innerHTML = `<div class="no-events"><p>No memories were captured on this day...</p></div>`;
            return;
        }
        dayEvents.forEach((event, index) => {
            const storySection = document.createElement('div');
            storySection.className = 'event-story';
            const timeElement = document.createElement('div');
            timeElement.className = 'story-time';
            timeElement.textContent = `Chapter ${index + 1}`;
            storySection.appendChild(timeElement);
            if (event.mood || event.category) {
                const metaContainer = document.createElement('div');
                metaContainer.className = 'meta-info';
                let metaText = '';
                if (event.mood) metaText += `Mood: ${event.mood}`;
                metaContainer.textContent = metaText;
                if (event.category) {
                    const badge = document.createElement('span');
                    badge.className = 'category-badge';
                    badge.textContent = event.category;
                    metaContainer.appendChild(badge);
                }
                storySection.appendChild(metaContainer);
            }
            const storyParagraph = document.createElement('div');
            storyParagraph.className = 'story-paragraph';
            storyParagraph.innerHTML = `<strong>${event.title}</strong> - ${event.description || 'A moment worth remembering.'}`;
            storySection.appendChild(storyParagraph);
            if (event.media && event.media.length > 0) {
                const gallery = createMediaGallery(event.media, event.title);
                if (gallery) storySection.appendChild(gallery);
            }
            contentContainer.appendChild(storySection);
        });
        const closingThought = document.createElement('div');
        closingThought.className = 'closing-thought';
        closingThought.innerHTML = `<em>And so ended another day in my journey...</em>`;
        contentContainer.appendChild(closingThought);
    } catch (err) {
        console.error(err);
        contentContainer.innerHTML = `<div class="no-events"><p style="color: var(--error-text);">Unable to load diary entries.</p></div>`;
    }
}
// Hamburger menu
const hamburger = document.getElementById('hamburger');
const menuDropdown = document.getElementById('menu-dropdown');
const themeBtn = document.getElementById('theme-btn');
const themeSubmenu = document.getElementById('theme-submenu');
const logoutBtn = document.getElementById('logout-btn');

hamburger.onclick = () => {
    menuDropdown.style.display = menuDropdown.style.display === 'block' ? 'none' : 'block';
};
document.addEventListener('click', (e) => {
    if (!hamburger.contains(e.target) && !menuDropdown.contains(e.target) && !themeSubmenu.contains(e.target)) {
        menuDropdown.style.display = 'none';
        themeSubmenu.style.display = 'none';
    }
});

// Theme menu toggle
themeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    themeSubmenu.style.display = themeSubmenu.style.display === 'block' ? 'none' : 'block';
});

// Theme selection
themeSubmenu.querySelectorAll('a').forEach(themeLink => {
    themeLink.addEventListener('click', (e) => {
        e.preventDefault();
        const theme = e.target.dataset.theme;
        setTheme(theme);
        themeSubmenu.style.display = 'none';
        menuDropdown.style.display = 'none';
    });
});

// Close theme submenu when clicking outside
document.addEventListener('click', (e) => {
    if (!themeBtn.contains(e.target) && !themeSubmenu.contains(e.target)) {
        themeSubmenu.style.display = 'none';
    }
});

logoutBtn.onclick = () => {
    localStorage.removeItem('token');
    window.location.href = 'register_login.html';
};

loadDiaryStory();
</script>
</body>
</html>
