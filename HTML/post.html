<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Posts - Daily Stories</title>
    <link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./themes.css">
<script type="module" src="./theme.js"></script>
   <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; }

    body {
        background: var(--bg-gradient);
        min-height: 100vh;
        padding: 20px;
        line-height: 1.8;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        background: var(--surface-1-bg);
        border-radius: 20px;
        padding: 40px 50px;
        box-shadow: 0 20px 60px var(--shadow-color);
        border: 3px solid var(--border-color);
        position: relative;
    }

    .container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 40px;
        width: 2px;
        height: 100%;
        background: var(--accent-1);
        opacity: 0.3;
    }

    .header {
        text-align: center;
        margin-bottom: 40px;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 30px;
    }

    .header h1 {
        font-size: 2.8rem;
        color: var(--heading);
        font-weight: bold;
        text-shadow: 1px 1px 3px var(--shadow-color);
        margin-bottom: 15px;
    }

    .header p {
        font-size: 1.2rem;
        color: var(--muted-text);
        font-style: italic;
    }

    .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .nav-btn {
        padding: 12px 24px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 500;
        transition: 0.3s;
        text-decoration: none;
        display: inline-block;
        box-shadow: 0 4px 15px var(--shadow-color);
        font-family: 'Georgia', serif;
    }

    .nav-btn:hover {
        background: var(--btn-hover);
        transform: translateY(-2px);
    }

    .search-container {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
    }

    .search-input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid var(--border-color);
        border-radius: 20px;
        font-size: 1rem;
        outline: none;
        background: var(--surface-1-bg);
        font-family: 'Georgia', serif;
    }

    .search-input:focus {
        border-color: var(--btn-bg);
    }

    .search-btn {
        padding: 12px 20px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: 'Georgia', serif;
        box-shadow: 0 4px 15px var(--shadow-color);
    }

    .search-btn:hover {
        background: var(--btn-hover);
        transform: translateY(-1px);
    }

    .clear-btn {
        padding: 12px 20px;
        background: var(--badge-bg);
        color: var(--badge-text);
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: 'Georgia', serif;
        box-shadow: 0 4px 15px var(--shadow-color);
    }

    .clear-btn:hover {
        background: var(--border-color);
        transform: translateY(-1px);
    }

    .loading {
        text-align: center;
        padding: 60px;
        color: var(--muted-text);
        font-size: 1.3rem;
        font-style: italic;
    }

    .loading::before {
        content: '';
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 3px solid var(--muted-text);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
        vertical-align: middle;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .post-card {
        background: var(--surface-2-bg);
        border-radius: 15px;
        margin-bottom: 30px;
        box-shadow: 0 8px 25px var(--shadow-color);
        border: 2px solid var(--panel-border);
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        position: relative;
    }

    .post-card::before {
        content: '●';
        position: absolute;
        left: 15px;
        top: 20px;
        color: var(--accent-1);
        font-size: 1.2rem;
        z-index: 1;
    }

    .post-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px var(--shadow-color);
    }

    .post-header {
        padding: 25px 25px 20px 40px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        align-items: center;
        gap: 15px;
        background: var(--surface-1-bg);
    }

    .user-avatar {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background: var(--btn-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--btn-fg);
        font-weight: bold;
        font-size: 1.3rem;
        cursor: pointer;
        transition: transform 0.2s ease;
        box-shadow: 0 4px 12px var(--shadow-color);
        overflow: hidden;
    }

    .user-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }

    .user-avatar:hover {
        transform: scale(1.1);
    }

    .user-info h3 {
        color: var(--heading);
        margin-bottom: 5px;
        cursor: pointer;
        transition: color 0.2s ease;
        font-size: 1.2rem;
    }

    .user-info h3:hover {
        color: var(--btn-bg);
    }

    .user-info p {
        color: var(--muted-text);
        font-size: 0.95rem;
        font-style: italic;
    }

    .post-content {
        padding: 25px 25px 20px 40px;
        color: var(--text);
    }

    .diary-events {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
    }

    .diary-event {
        background: var(--btn-bg);
        color: var(--btn-fg);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: 0 2px 8px var(--shadow-color);
    }

    .diary-content {
        margin-top: 20px;
    }

    .diary-entry {
        background: var(--surface-3-bg);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 15px;
        border-left: 4px solid var(--btn-bg);
    }

    .diary-entry-title {
        color: var(--heading);
        font-weight: 600;
        margin-bottom: 10px;
        font-size: 1.1rem;
    }

    .diary-entry-text {
        color: var(--text);
        line-height: 1.7;
        margin-bottom: 15px;
        text-indent: 20px;
    }

    .diary-entry-photo {
        width: 100%;
        max-width: 400px;
        height: 250px;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 4px 15px var(--shadow-color);
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .diary-entry-photo:hover {
        transform: scale(1.02);
    }

    .diary-entry-date {
        color: var(--muted-text);
        font-size: 0.9rem;
        font-style: italic;
        margin-top: 10px;
    }

    .post-actions {
        padding: 20px 25px 20px 40px;
        border-top: 1px solid var(--panel-border);
        display: flex;
        gap: 25px;
        align-items: center;
        background: var(--surface-3-bg);
    }

    .action-btn {
        background: none;
        border: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 15px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1rem;
        color: var(--muted-text);
        font-family: 'Georgia', serif;
    }

    .action-btn:hover {
        background: var(--no-media-bg);
        transform: translateY(-1px);
    }

    .action-btn.liked {
        color: var(--accent-1);
        background: rgba(231, 76, 60, 0.1);
    }

    .comments-section {
        padding: 0 25px 25px 40px;
        border-top: 1px solid var(--panel-border);
        margin-top: 10px;
        background: var(--surface-2-bg);
        max-height: 400px;
        overflow-y: auto;
    }

    .comment-form {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        padding-top: 20px;
    }

    .comment-input {
        flex: 1;
        padding: 12px 18px;
        border: 2px solid var(--border-color);
        border-radius: 20px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease;
        background: var(--surface-1-bg);
        font-family: 'Georgia', serif;
    }

    .comment-input:focus {
        border-color: var(--btn-bg);
    }

    .comment-btn {
        padding: 12px 20px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: 'Georgia', serif;
        box-shadow: 0 4px 15px var(--shadow-color);
    }

    .comment-btn:hover {
        background: var(--btn-hover);
        transform: translateY(-1px);
    }

    .comment {
        margin-bottom: 18px;
        padding: 15px 20px;
        background: var(--surface-3-bg);
        border-radius: 12px;
        border: 1px solid var(--panel-border);
    }

    .comment-user {
        font-weight: 600;
        color: var(--heading);
        margin-bottom: 8px;
        cursor: pointer;
        font-size: 1.05rem;
    }

    .comment-user:hover {
        color: var(--btn-bg);
    }

    .comment-text {
        color: var(--text);
        line-height: 1.6;
    }

    .comment-reply {
        margin-left: 0;
        margin-top: 10px;
        background: var(--surface-3-bg);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 15px 20px;
    }

    .no-posts {
        text-align: center;
        padding: 80px 20px;
        color: var(--muted-text);
        background: var(--no-media-bg);
        border-radius: 15px;
        border: 2px dashed var(--border-color);
    }

    .no-posts h3 {
        font-size: 1.8rem;
        margin-bottom: 15px;
        color: var(--heading);
    }

    .no-posts p {
        font-style: italic;
        font-size: 1.1rem;
    }

    .end-message {
        text-align: center;
        padding: 40px;
        color: var(--muted-text);
        font-size: 1.2rem;
        font-style: italic;
        background: var(--no-media-bg);
        border-radius: 15px;
        border: 2px dashed var(--border-color);
        margin-top: 20px;
    }

    .photo-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: var(--modal-backdrop);
        cursor: pointer;
    }

    .modal-content {
        margin: auto;
        display: block;
        max-width: 90%;
        max-height: 90%;
        margin-top: 5%;
    }

    .close-modal {
        position: absolute;
        top: 15px;
        right: 35px;
        color: var(--modal-text);
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .container {
            margin: 10px;
            padding: 25px 30px;
            border-radius: 15px;
        }

        .header h1 {
            font-size: 2.2rem;
        }

        .post-header {
            padding: 20px;
        }

        .post-content {
            padding: 20px;
        }

        .post-actions {
            padding: 15px 20px;
            flex-wrap: wrap;
        }

        .comment-form {
            flex-direction: column;
        }

        .search-container {
            flex-direction: column;
        }

        .top-nav {
            flex-direction: column;
            gap: 15px;
        }

        .diary-entry-photo {
            height: 200px;
        }
    }

    .diary-entry-photo, .diary-entry-video {
        display: block;
        margin: 10px auto;
        max-width: 400px;
        max-height: 300px;
        object-fit: cover;
    }

    .comment-actions {
        margin-top: 5px;
        display: flex;
        gap: 15px;
    }

    .comment-actions .action-btn {
        font-size: 0.9rem;
        padding: 5px 10px;
    }

    .comment-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 5px var(--shadow-color);
    }

    .parent-comment-context {
        font-size: 0.9rem;
        color: var(--muted-text);
        font-style: italic;
        margin-bottom: 8px;
    }

    .reply-form {
        margin-left: 0;
        margin-top: 10px;
        padding: 15px 20px;
    }

    .comment-loading {
        text-align: center;
        padding: 20px;
        color: var(--muted-text);
        font-size: 1rem;
        font-style: italic;
        display: none;
    }

    .comment-loading::before {
        content: '';
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid var(--muted-text);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
    }

    .comment-end-message {
        text-align: center;
        padding: 20px;
        color: var(--muted-text);
        font-size: 1rem;
        font-style: italic;
        display: none;
    }

    .comment-error-message {
        text-align: center;
        padding: 20px;
        color: var(--error-text);
        font-size: 1rem;
        font-style: italic;
        display: none;
    }

    :root {
        --bg-gradient: linear-gradient(135deg, #f7f3e9, #e8dcc6);
        --surface-1-bg: #fdfbf7;
        --surface-2-bg: #fff8f0;
        --surface-3-bg: #f8f6f1;
        --border-color: #d4c5a9;
        --panel-border: #e6d8c5;
        --shadow-color: rgba(0,0,0,0.15);
        --error-text: #c62828;
        --no-media-bg: rgba(212,197,169,0.1);

        --text: #2c2c2c;
        --muted-text: #8d6e63;
        --heading: #5d4037;

        --accent-1: #e74c3c;

        --btn-bg: #8b4513;
        --btn-hover: #a0522d;
        --btn-fg: #ffffff;

        --tab-bg: #ffffff;
        --tab-text: #8d6e63;
        --tab-active-bg: #8b4513;
        --tab-active-text: #ffffff;

        --badge-bg: #d4c5a9;
        --badge-text: #5d4037;

        --modal-backdrop: rgba(0,0,0,0.95);
        --modal-surface: #1a1a1a;
        --modal-text: #ffffff;
        --modal-border: #333333;
        --modal-close-bg: rgba(255,255,255,0.9);
        --modal-close-fg: #333333;

        --audio-gradient-start: #667eea;
        --audio-gradient-end: #764ba2;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="dashboard.html" class="nav-btn">← Back to Dashboard</a>
        </div>

        <div class="header">
            <h1>📖 Community Stories</h1>
            <p>Discover the beautiful moments shared by our community</p>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="Search posts by title or description...">
            <button class="search-btn" onclick="searchPosts()">Search</button>
            <button class="clear-btn" onclick="clearSearch()">Clear</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <p>Loading wonderful stories...</p>
        </div>

        <div id="posts-container"></div>

        <div id="no-posts" class="no-posts" style="display: none;">
            <h3>📝 No stories found</h3>
            <p>Try a different search or be the first to share your moments</p>
        </div>

        <div id="end-message" class="end-message" style="display: none;">
            <p>No more stories to show</p>
        </div>

        <!-- Photo Modal -->
        <div id="photo-modal" class="photo-modal" onclick="closePhotoModal()">
            <span class="close-modal" onclick="closePhotoModal()">&times;</span>
            <img class="modal-content" id="modal-image">
        </div>
    </div>

    <script>
        let currentPage = 1;
        const postsPerPage = 5;
        let totalPosts = 0;
        let isLoading = false;
        let searchQuery = '';
        let currentUser = null;
        const commentsPerPage = 10;
        const commentState = {};

        function getCurrentUser() {
            const user = localStorage.getItem('user');
            return user ? JSON.parse(user) : null;
        }

        function getUserInitials(username) {
            return username ? username.substring(0, 2).toUpperCase() : 'U';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function viewUserProfile(userId) {
            window.location.href = `socialProfile.html?userId=${userId}`;
        }

        function openPhotoModal(photoUrl) {
            const modal = document.getElementById('photo-modal');
            const modalImg = document.getElementById('modal-image');
            modal.style.display = 'block';
            modalImg.src = photoUrl;
        }

        function closePhotoModal() {
            document.getElementById('photo-modal').style.display = 'none';
        }

        function debounce(func, delay) {
            let timer;
            return function (...args) {
                clearTimeout(timer);
                timer = setTimeout(() => func.apply(this, args), delay);
            };
        }

        function getExpandedState(postId) {
            const expanded = { comments: false, replies: {} };
            const commentsSection = document.getElementById(`comments-${postId}`);
            if (commentsSection && commentsSection.style.display === 'block') {
                expanded.comments = true;
            }
            const replySections = document.querySelectorAll(`#posts-container [id^="replies-"]`);
            replySections.forEach(sec => {
                if (sec.style.display === 'block') {
                    expanded.replies[sec.id.split('-')[1]] = true;
                }
            });
            return expanded;
        }

        function restoreExpandedState(postId, expandedState) {
            const commentsSection = document.getElementById(`comments-${postId}`);
            if (commentsSection && expandedState.comments) {
                commentsSection.style.display = 'block';
                addCommentScrollListener(postId);
            }
            Object.keys(expandedState.replies).forEach(replyId => {
                const replySec = document.getElementById(`replies-${replyId}`);
                if (replySec) {
                    replySec.style.display = 'block';
                }
            });
        }

        async function toggleLike(postId) {
            const scrollPos = window.scrollY;
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to appreciate posts');
                return;
            }

            const expandedState = getExpandedState(postId);

            try {
                const response = await fetch(`http://localhost:3000/api/posts/${postId}/like`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                if (data.success) {
                    const postResponse = await fetch(`http://localhost:3000/api/posts/${postId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const postData = await postResponse.json();
                    if (postData.success) {
                        const postElement = document.querySelector(`.post-card[data-post-id="${postId}"]`);
                        if (postElement) {
                            postElement.outerHTML = createPostHTML(postData.post);
                            restoreExpandedState(postId, expandedState);
                        }
                    }
                }
            } catch (error) {
                console.error('Error toggling like:', error);
            } finally {
                window.scrollTo(0, scrollPos);
            }
        }

        async function addComment(postId) {
            const scrollPos = window.scrollY;
            const commentInput = document.getElementById(`comment-input-${postId}`);
            const commentText = commentInput.value.trim();
            if (!commentText) return;

            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to share your thoughts');
                return;
            }

            const postElement = document.querySelector(`.post-card[data-post-id="${postId}"]`);
            const commentsSection = document.getElementById(`comments-${postId}`);
            if (!postElement || !commentsSection) return;

            const expandedState = getExpandedState(postId);

            try {
                const response = await fetch(`http://localhost:3000/api/posts/${postId}/comment`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: commentText })
                });

                const data = await response.json();
                if (data.success) {
                    commentState[postId] = { currentPage: 1, totalComments: 0, isLoading: false, retryAttempts: 0 };
                    const postResponse = await fetch(`http://localhost:3000/api/posts/${postId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const postData = await postResponse.json();
                    if (postData.success) {
                        postElement.outerHTML = createPostHTML(postData.post);
                        restoreExpandedState(postId, expandedState);
                        const updatedCommentInput = document.getElementById(`comment-input-${postId}`);
                        if (updatedCommentInput) updatedCommentInput.value = '';
                    }
                }
            } catch (error) {
                console.error('Error adding comment:', error);
            } finally {
                window.scrollTo(0, scrollPos);
            }
        }

        async function addReply(postId, parentCommentId) {
            const scrollPos = window.scrollY;
            const replyInput = document.getElementById(`reply-input-${postId}-${parentCommentId}`);
            const replyText = replyInput.value.trim();
            if (!replyText) return;

            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to reply');
                return;
            }

            const postElement = document.querySelector(`.post-card[data-post-id="${postId}"]`);
            const commentsSection = document.getElementById(`comments-${postId}`);
            if (!postElement || !commentsSection) return;

            const expandedState = getExpandedState(postId);
            expandedState.replies[parentCommentId] = true;

            try {
                const response = await fetch(`http://localhost:3000/api/posts/${postId}/comment`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: replyText, parentId: parentCommentId })
                });

                const data = await response.json();
                if (data.success) {
                    const postResponse = await fetch(`http://localhost:3000/api/posts/${postId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const postData = await postResponse.json();
                    if (postData.success) {
                        postElement.outerHTML = createPostHTML(postData.post);
                        restoreExpandedState(postId, expandedState);
                        const updatedReplyInput = document.getElementById(`reply-input-${postId}-${parentCommentId}`);
                        if (updatedReplyInput) {
                            updatedReplyInput.value = '';
                            const replyForm = document.getElementById(`reply-form-${parentCommentId}`);
                            if (replyForm) replyForm.style.display = 'block';
                            const repliesSection = document.getElementById(`replies-${parentCommentId}`);
                            if (repliesSection) repliesSection.style.display = 'block';
                        }
                    }
                }
            } catch (error) {
                console.error('Error adding reply:', error);
            } finally {
                window.scrollTo(0, scrollPos);
            }
        }

        async function toggleCommentLike(postId, commentId) {
            const scrollPos = window.scrollY;
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to like comments');
                return;
            }

            const expandedState = getExpandedState(postId);

            try {
                const response = await fetch(`http://localhost:3000/api/posts/${postId}/comment/${commentId}/like`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                if (data.success) {
                    const postResponse = await fetch(`http://localhost:3000/api/posts/${postId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const postData = await postResponse.json();
                    if (postData.success) {
                        const postElement = document.querySelector(`.post-card[data-post-id="${postId}"]`);
                        if (postElement) {
                            postElement.outerHTML = createPostHTML(postData.post);
                            restoreExpandedState(postId, expandedState);
                        }
                    }
                }
            } catch (error) {
                console.error('Error toggling comment like:', error);
            } finally {
                window.scrollTo(0, scrollPos);
            }
        }

        async function loadComments(postId, page = 1, append = false, retryCount = 0) {
            if (commentState[postId]?.isLoading) return;
            commentState[postId] = commentState[postId] || { currentPage: 1, totalComments: 0, isLoading: false, retryAttempts: 0 };
            if (commentState[postId].retryAttempts >= 3) {
                console.warn(`Max retry attempts reached for post ${postId}`);
                return;
            }

            const commentsList = document.getElementById(`comments-list-${postId}`);
            const commentLoading = document.getElementById(`comment-loading-${postId}`);
            const commentEndMessage = document.getElementById(`comment-end-message-${postId}`);
            const commentErrorMessage = document.getElementById(`comment-error-message-${postId}`);

            commentLoading.style.display = 'block';
            if (commentErrorMessage) commentErrorMessage.style.display = 'none';
            if (!append) {
                commentsList.innerHTML = '';
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`http://localhost:3000/api/posts/${postId}?page=${page}&limit=${commentsPerPage}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 429) {
                    const retryAfter = response.headers.get('Retry-After');
                    const delay = retryAfter ? parseInt(retryAfter) * 1000 : Math.pow(2, retryCount) * 1000;
                    console.warn(`Rate limit hit for post ${postId}, retrying after ${delay}ms`);
                    commentState[postId].retryAttempts = (commentState[postId].retryAttempts || 0) + 1;
                    setTimeout(() => loadComments(postId, page, append, retryCount + 1), delay);
                    return;
                }

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.message || 'Failed to load comments');
                }

                commentState[postId].totalComments = data.post.totalComments || data.post.comments.length;
                commentState[postId].retryAttempts = 0; // Reset retry count on success
                const comments = data.post.comments
                    .filter(c => !c.parentComment)
                    .slice((page - 1) * commentsPerPage, page * commentsPerPage);

                if (comments.length > 0) {
                    commentsList.innerHTML += comments.map(comment => renderComment(comment, postId, data.post.comments)).join('');
                    commentState[postId].currentPage = page;
                }
                if (page * commentsPerPage >= commentState[postId].totalComments) {
                    commentEndMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading comments:', error);
                if (commentErrorMessage) {
                    commentErrorMessage.textContent = 'Unable to load comments due to too many requests. Please try again later.';
                    commentErrorMessage.style.display = 'block';
                }
            } finally {
                commentLoading.style.display = 'none';
                commentState[postId].isLoading = false;
            }
        }

        function addCommentScrollListener(postId) {
            const commentsSection = document.getElementById(`comments-${postId}`);
            if (!commentsSection) return;

            commentsSection.removeEventListener('scroll', commentState[postId]?.scrollHandler);
            commentState[postId] = commentState[postId] || { currentPage: 1, totalComments: 0, isLoading: false, retryAttempts: 0 };

            const debouncedScrollHandler = debounce(() => {
                if (commentState[postId].isLoading || commentState[postId].currentPage * commentsPerPage >= commentState[postId].totalComments) return;
                if (commentsSection.scrollTop + commentsSection.clientHeight >= commentsSection.scrollHeight - 50) {
                    loadComments(postId, commentState[postId].currentPage + 1, true);
                }
            }, 300);

            commentState[postId].scrollHandler = debouncedScrollHandler;
            commentsSection.addEventListener('scroll', debouncedScrollHandler);
        }

        function createPostHTML(post) {
            const user = post.userId || { _id: '', username: 'Unknown', profilePhoto: '' };
            const isLiked = currentUser && post.likes && post.likes.includes(currentUser.id);
            const likesCount = post.likes ? post.likes.length : 0;
            const commentsCount = post.totalComments || (post.comments ? post.comments.length : 0);

            const avatarHTML = user.profilePhoto ? `
                <img src="http://localhost:3000${user.profilePhoto}" 
                     alt="${user.username}"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div style="display:none; width:100%; height:100%; background:#8b4513; border-radius:50%; 
                            align-items:center; justify-content:center; color:white; font-weight:bold; font-size:1.3rem;">
                    ${getUserInitials(user.username)}
                </div>
            ` : `
                <div style="width:100%; height:100%; background:#8b4513; border-radius:50%; 
                            display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:1.3rem;">
                    ${getUserInitials(user.username)}
                </div>
            `;

            let diaryContentHTML = '';
            if (post.diaryEvents && post.diaryEvents.length > 0) {
                diaryContentHTML = `
                    <div class="diary-content">
                        ${post.diaryEvents.map(entry => {
                            const title = entry.title || 'A Beautiful Moment';
                            const description = entry.description ? `<div class="diary-entry-text">${entry.description}</div>` : '';
                            const dateStr = entry.date ? formatDate(entry.date) : (post.createdAt ? formatDate(post.createdAt) : '');

                            let mediaHTML = '';
                            if (entry.media && entry.media.length > 0) {
                                mediaHTML = entry.media.map(m => {
                                    if (!m || !m.url) return '';
                                    if (m.type === 'image') {
                                        const src = typeof m.url === 'object' ? (m.url.optimized || m.url.original) : m.url;
                                        const original = typeof m.url === 'object' ? m.url.original : m.url;
                                        return `<img src="http://localhost:3000${src}" 
                                                     alt="${title}"
                                                     class="diary-entry-photo"
                                                     style="max-width:400px; max-height:300px; object-fit:cover; cursor:pointer;"
                                                     onclick="openPhotoModal('http://localhost:3000${original}')">`;
                                    } else if (m.type === 'video') {
                                        const src = typeof m.url === 'object' ? m.url.original : m.url;
                                        return `<video controls class="diary-entry-video" style="width:100%; max-width:400px; height:auto; margin-top:10px;">
                                                    <source src="http://localhost:3000${src}" type="video/mp4">
                                                    Your browser does not support the video tag.
                                                </video>`;
                                    } else if (m.type === 'audio') {
                                        const src = typeof m.url === 'object' ? m.url.original : m.url;
                                        return `<audio controls class="diary-entry-audio" style="display:block; margin-top:10px; width:100%;">
                                                    <source src="http://localhost:3000${src}" type="audio/mpeg">
                                                    Your browser does not support the audio tag.
                                                </audio>`;
                                    }
                                    return '';
                                }).join('');
                            }

                            return `
                                <div class="diary-entry">
                                    <div class="diary-entry-title">${title}</div>
                                    ${description}
                                    ${mediaHTML}
                                    <div class="diary-entry-date">Captured on ${dateStr}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            let taggedUsersHTML = '';
            if (post.tags && post.tags.length > 0) {
                taggedUsersHTML = `
                    <div style="margin-bottom:12px; margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;">
                        <span style="color:#8d6e63; font-size:0.97rem; font-style:italic;">Tagged:</span>
                        ${post.tags.map(tagUser => `
                            <div style="display:flex; align-items:center; gap:5px; background:#f8f6f1; border-radius:15px; padding:3px 10px; cursor:pointer;"
                                 onclick="viewUserProfile('${tagUser._id}')">
                                ${
                                    tagUser.profilePhoto
                                    ? `<img src="http://localhost:3000${tagUser.profilePhoto}" alt="${tagUser.username}" style="width:26px; height:26px; border-radius:50%; object-fit:cover;"/>`
                                    : `<span style="width:26px; height:26px; border-radius:50%; background:#8b4513; color:white; display:flex; align-items:center; justify-content:center; font-size:0.85rem;">${getUserInitials(tagUser.username)}</span>`
                                }
                                <span style="font-weight:600; color:#5d4037; font-size:0.99rem;">${tagUser.username}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            function renderComment(comment, postId, allComments) {
                const commentUser = comment.userId || { _id: '', username: 'Unknown', profilePhoto: '' };
                const isCommentLiked = currentUser && comment.likes && comment.likes.includes(currentUser.id);
                const commentLikesCount = comment.likes ? comment.likes.length : 0;
                const replies = allComments.filter(c => c.parentComment && c.parentComment.toString() === comment._id.toString());

                const commentAvatarHTML = commentUser.profilePhoto ? `
                    <div class="comment-avatar">
                        <img src="http://localhost:3000${commentUser.profilePhoto}" alt="${commentUser.username}" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div style="display:none; width:100%; height:100%; background:#8b4513; border-radius:50%; 
                                    align-items:center; justify-content:center; color:white; font-weight:bold; font-size:0.8rem;">
                            ${getUserInitials(commentUser.username)}
                        </div>
                    </div>
                ` : `
                    <div class="comment-avatar">
                        <div style="width:100%; height:100%; background:#8b4513; border-radius:50%; 
                                    display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:0.8rem;">
                            ${getUserInitials(commentUser.username)}
                        </div>
                    </div>
                `;

                const parentComment = comment.parentComment ? allComments.find(c => c._id.toString() === comment.parentComment.toString()) : null;
                const parentContext = parentComment ? `
                    <div class="parent-comment-context">
                        Replying to ${parentComment.userId.username}: "${parentComment.text.length > 30 ? parentComment.text.substring(0, 30) + '...' : parentComment.text}"
                    </div>
                ` : '';

                const commentHTML = `
                    <div class="comment ${parentComment ? 'comment-reply' : ''}">
                        <div style="display: flex; align-items: flex-start; gap: 10px;">
                            ${commentAvatarHTML}
                            <div style="flex: 1;">
                                ${parentContext}
                                <div class="comment-user" onclick="viewUserProfile('${commentUser._id}')">${commentUser.username}</div>
                                <div class="comment-text">${comment.text}</div>
                                <div class="comment-actions">
                                    <button class="action-btn ${isCommentLiked ? 'liked' : ''}" onclick="toggleCommentLike('${postId}', '${comment._id}')">
                                        <span>${isCommentLiked ? '❤️' : '🤍'}</span>
                                        <span>${commentLikesCount} ${commentLikesCount === 1 ? 'Like' : 'Likes'}</span>
                                    </button>
                                    ${replies.length > 0 ? `<button class="action-btn" onclick="toggleReplies('${comment._id}')">
                                        <span>👁️</span> View ${replies.length} ${replies.length === 1 ? 'Reply' : 'Replies'}
                                    </button>` : ''}
                                    <button class="action-btn" onclick="showReplyInput('${postId}', '${comment._id}')">
                                        <span>💬</span> Reply
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const repliesHTML = replies.length > 0 ? `
                    <div id="replies-${comment._id}" class="replies-section" style="display: none;">
                        ${replies.map(reply => renderComment(reply, postId, allComments)).join('')}
                    </div>
                ` : '';

                const replyFormHTML = `
                    <div id="reply-form-${comment._id}" class="comment-form reply-form" style="display: none;">
                        <input type="text" id="reply-input-${postId}-${comment._id}" class="comment-input" placeholder="Write a reply..." onkeypress="if(event.key==='Enter') addReply('${postId}', '${comment._id}')">
                        <button class="comment-btn" onclick="addReply('${postId}', '${comment._id}')">Reply</button>
                    </div>
                `;

                return commentHTML + repliesHTML + replyFormHTML;
            }

            commentState[post._id] = commentState[post._id] || { currentPage: 1, totalComments: commentsCount, isLoading: false, retryAttempts: 0 };
            const commentsToShow = post.comments
                .filter(c => !c.parentComment)
                .slice(0, commentsPerPage);

            const commentsHTML = commentsToShow.length > 0
                ? commentsToShow.map(c => renderComment(c, post._id, post.comments)).join('')
                : '';

            return `
                <div class="post-card" data-post-id="${post._id}">
                    <div class="post-header">
                        <div class="user-avatar" onclick="viewUserProfile('${user._id}')">${avatarHTML}</div>
                        <div class="user-info">
                            <h3 onclick="viewUserProfile('${user._id}')">${user.username}</h3>
                            <p>Shared on ${formatDate(post.createdAt)}</p>
                        </div>
                    </div>

                    <div class="post-content">
                        ${post.content ? `<p style="text-indent:30px; color:#2c2c2c; margin-bottom:20px;">${post.content}</p>` : ''}
                        ${diaryContentHTML}
                        ${taggedUsersHTML}
                    </div>

                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post._id}')">
                            <span>${isLiked ? '❤️' : '🤍'}</span>
                            <span>${likesCount} ${likesCount === 1 ? 'Like' : 'Likes'}</span>
                        </button>
                        <button class="action-btn" onclick="document.getElementById('comments-${post._id}').style.display = document.getElementById('comments-${post._id}').style.display === 'block' ? 'none' : 'block'; addCommentScrollListener('${post._id}')">
                            <span>💬</span>
                            <span>${commentsCount} ${commentsCount === 1 ? 'Thought' : 'Thoughts'}</span>
                        </button>
                    </div>

                    <div id="comments-${post._id}" class="comments-section" style="display:none;">
                        <div class="comment-form">
                            <input type="text" id="comment-input-${post._id}" class="comment-input" placeholder="Share your thoughts..." onkeypress="if(event.key==='Enter') addComment('${post._id}')">
                            <button class="comment-btn" onclick="addComment('${post._id}')">Share</button>
                        </div>
                        <div id="comments-list-${post._id}" class="comments-list">${commentsHTML}</div>
                        <div id="comment-loading-${post._id}" class="comment-loading">Loading more comments...</div>
                        <div id="comment-end-message-${post._id}" class="comment-end-message">No more comments to show</div>
                        <div id="comment-error-message-${post._id}" class="comment-error-message"></div>
                    </div>
                </div>
            `;
        }

        function showReplyInput(postId, commentId) {
            const replyForm = document.getElementById(`reply-form-${commentId}`);
            replyForm.style.display = replyForm.style.display === 'block' ? 'none' : 'block';
        }

        function toggleReplies(commentId) {
            const repliesDiv = document.getElementById(`replies-${commentId}`);
            repliesDiv.style.display = repliesDiv.style.display === 'block' ? 'none' : 'block';
        }

        async function loadPosts(page = 1, append = false) {
            if (isLoading) return;
            isLoading = true;

            const loading = document.getElementById('loading');
            const postsContainer = document.getElementById('posts-container');
            const noPostsDiv = document.getElementById('no-posts');
            const endMessageDiv = document.getElementById('end-message');

            loading.style.display = 'block';
            if (!append) {
                postsContainer.innerHTML = '';
                noPostsDiv.style.display = 'none';
                endMessageDiv.style.display = 'none';
            }

            try {
                const token = localStorage.getItem('token');
                const url = `http://localhost:3000/api/posts?page=${page}&limit=${postsPerPage}${searchQuery ? `&search=${encodeURIComponent(searchQuery)}` : ''}`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.success && data.posts.length > 0) {
                    totalPosts = data.totalPosts;
                    postsContainer.innerHTML += data.posts.map(post => createPostHTML(post)).join('');
                    if (page * postsPerPage >= totalPosts) {
                        endMessageDiv.style.display = 'block';
                    }
                } else if (!append) {
                    noPostsDiv.style.display = 'block';
                }
            } catch (error) {
                loading.style.display = 'none';
                console.error('Error loading posts:', error);
                postsContainer.innerHTML = '<div class="no-posts"><h3>📖 Error loading stories</h3><p>Please try again in a moment</p></div>';
            } finally {
                isLoading = false;
            }
        }

        function searchPosts() {
            searchQuery = document.getElementById('search-input').value.trim();
            currentPage = 1;
            loadPosts(1, false);
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            currentPage = 1;
            loadPosts(1, false);
        }

        const debouncedSearch = debounce(() => {
            searchPosts();
        }, 300);

        window.addEventListener('scroll', () => {
            if (isLoading || currentPage * postsPerPage >= totalPosts) return;
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
                currentPage++;
                loadPosts(currentPage, true);
            }
        });

        document.getElementById('search-input').addEventListener('input', debouncedSearch);

        document.addEventListener('DOMContentLoaded', function() {
            currentUser = getCurrentUser();
            loadPosts(1, false);
        });

        window.onclick = function(event) {
            const modal = document.getElementById('photo-modal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };
    </script>
</body>
</html>
