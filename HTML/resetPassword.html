<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password Modal - Diary Theme</title>
 <link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./themes.css">
<script type="module" src="./theme.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Georgia', 'Times New Roman', serif; }

body {
    background: var(--bg-gradient);
    min-height:100vh;
    padding:20px;
    line-height: 1.8;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Demo button to show modal */
.demo-btn {
    padding: 15px 30px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.3s;
    box-shadow: 0 4px 15px var(--shadow-color);
    font-size: 1.1rem;
}

.demo-btn:hover { 
    background: var(--btn-hover); 
    transform: translateY(-2px); 
}

/* Reset Password Modal Styles */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(var(--heading-rgb), 0.8);
    backdrop-filter: blur(5px);
    z-index: 1000;
    animation: fadeIn 0.3s ease;
    padding: 20px;
}

.modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: var(--surface-1-bg);
    border-radius: 20px;
    padding: 40px 50px;
    box-shadow: 0 20px 60px var(--shadow-color);
    border: 3px solid var(--border-color);
    position: relative;
    max-width: 450px;
    width: 100%;
    transform: translateY(-20px);
    animation: slideUp 0.3s ease forwards;
}

.modal-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 40px;
    width: 2px;
    height: 100%;
    background: var(--accent-1);
    opacity: 0.3;
}

.modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    background: none;
    border: none;
    font-size: 2rem;
    color: var(--muted-text);
    cursor: pointer;
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.3s ease;
}

.modal-close:hover {
    background: rgba(139, 69, 19, 0.1);
    color: var(--heading);
    transform: rotate(90deg);
}

.modal-header {
    text-align: center;
    margin-bottom: 30px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 15px;
}

.modal-title {
    font-size: 1.8rem;
    color: var(--heading);
    font-weight: bold;
    text-shadow: 1px 1px 3px var(--shadow-color);
    margin-bottom: 5px;
}

.modal-subtitle {
    font-size: 1rem;
    color: var(--muted-text);
    font-style: italic;
}

.form-group {
    margin-bottom: 25px;
    position: relative;
}

.form-label {
    display: block;
    color: var(--heading);
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 8px;
    padding-left: 5px;
}

.form-input {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    font-size: 1rem;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--surface-2-bg);
    color: var(--text);
    transition: all 0.3s ease;
    box-shadow: inset 0 2px 4px var(--shadow-color);
}

.form-input:focus {
    outline: none;
    border-color: var(--btn-bg);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(139,69,19,0.1), inset 0 2px 4px var(--shadow-color);
    transform: translateY(-1px);
}

.form-input::placeholder {
    color: #a0a0a0;
    font-style: italic;
}

.password-strength {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--muted-text);
    font-style: italic;
}

.strength-weak { color: var(--accent-1); }
.strength-medium { color: #f39c12; }
.strength-strong { color: #27ae60; }

.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 35px;
}

.btn {
    flex: 1;
    padding: 15px 20px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 500;
    font-size: 1rem;
    font-family: 'Georgia', 'Times New Roman', serif;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px var(--shadow-color);
}

.btn-primary {
    background: var(--btn-bg);
    color: var(--btn-fg);
}

.btn-primary:hover {
    background: var(--btn-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--shadow-color);
}

.btn-secondary {
    background: var(--surface-3-bg);
    color: var(--heading);
    border: 2px solid var(--border-color);
}

.btn-secondary:hover {
    background: var(--border-color);
    transform: translateY(-2px);
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.security-note {
    background: var(--no-media-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 15px;
    margin-top: 20px;
    font-size: 0.9rem;
    color: var(--heading);
    text-align: center;
    font-style: italic;
}

.security-note::before {
    content: '🔒';
    display: block;
    margin-bottom: 5px;
    font-size: 1.2rem;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideUp {
    from { 
        transform: translateY(20px);
        opacity: 0;
    }
    to { 
        transform: translateY(0);
        opacity: 1;
    }
}

@media (max-width: 768px) {
    .modal-content {
        margin: 20px;
        padding: 30px 25px;
        max-width: none;
    }
    
    .form-actions {
        flex-direction: column;
    }
    
    .btn {
        padding: 12px 20px;
    }
}


</style>
</head>
<body>

<!-- Demo button to show modal -->
<button class="demo-btn" onclick="showResetModal()">Reset Password</button>

<!-- Reset Password Modal -->
<div id="reset-password-modal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeResetModal()">&times;</button>
        
        <div class="modal-header">
            <div class="modal-title">Reset Password</div>
            <div class="modal-subtitle">Secure your diary with a new password</div>
        </div>

        <form id="reset-password-form" onsubmit="resetPassword(event)">
            <div class="form-group">
                <label class="form-label" for="old-password">Current Password</label>
                <input type="password" id="old-password" class="form-input" placeholder="Enter your current password" required />
            </div>

            <div class="form-group">
                <label class="form-label" for="new-password">New Password</label>
                <input type="password" id="new-password" class="form-input" placeholder="Create a strong new password" required />
                <div id="password-strength" class="password-strength"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" class="form-input" placeholder="Confirm your new password" required />
                <div id="password-match" class="password-strength"></div>
            </div>

            <div class="security-note">
                Your new password should be at least 8 characters long and include a mix of letters, numbers, and symbols for better security.
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeResetModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="reset-btn">Update Password</button>
            </div>
        </form>
    </div>
</div>

<script>
// Mock API configuration - replace with your actual API
const API_BASE_URL = "http://localhost:3000/api";
const token = localStorage.getItem('token') || 'demo-token';
let currentEditId = 'user123'; // This would be passed from your main app

function showResetModal() {
    const modal = document.getElementById('reset-password-modal');
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    
    // Focus on first input
    setTimeout(() => {
        document.getElementById('old-password').focus();
    }, 300);
}

function closeResetModal() {
    const modal = document.getElementById('reset-password-modal');
    modal.classList.remove('active');
    document.body.style.overflow = 'auto';
    
    // Clear form
    document.getElementById('reset-password-form').reset();
    clearValidationMessages();
}

function clearValidationMessages() {
    document.getElementById('password-strength').textContent = '';
    document.getElementById('password-match').textContent = '';
}

// Password strength checker
document.getElementById('new-password').addEventListener('input', function(e) {
    const password = e.target.value;
    const strengthDiv = document.getElementById('password-strength');
    
    if (password.length === 0) {
        strengthDiv.textContent = '';
        return;
    }
    
    let strength = 0;
    let feedback = [];
    
    if (password.length >= 8) strength += 1;
    else feedback.push('at least 8 characters');
    
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 1;
    else feedback.push('both uppercase and lowercase letters');
    
    if (/\d/.test(password)) strength += 1;
    else feedback.push('at least one number');
    
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength += 1;
    else feedback.push('at least one special character');
    
    if (strength <= 1) {
        strengthDiv.className = 'password-strength strength-weak';
        strengthDiv.textContent = `Weak password. Add: ${feedback.slice(0, 2).join(', ')}`;
    } else if (strength <= 2) {
        strengthDiv.className = 'password-strength strength-medium';
        strengthDiv.textContent = `Medium strength. Consider adding: ${feedback.slice(0, 1).join(', ')}`;
    } else {
        strengthDiv.className = 'password-strength strength-strong';
        strengthDiv.textContent = 'Strong password ✓';
    }
});

// Password confirmation checker
document.getElementById('confirm-password').addEventListener('input', function(e) {
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = e.target.value;
    const matchDiv = document.getElementById('password-match');
    
    if (confirmPassword.length === 0) {
        matchDiv.textContent = '';
        return;
    }
    
    if (newPassword === confirmPassword) {
        matchDiv.className = 'password-strength strength-strong';
        matchDiv.textContent = 'Passwords match ✓';
    } else {
        matchDiv.className = 'password-strength strength-weak';
        matchDiv.textContent = 'Passwords do not match';
    }
});

// Close modal when clicking outside
document.getElementById('reset-password-modal').onclick = function(e) {
    if (e.target === this) closeResetModal();
};

// Close modal with Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeResetModal();
});
async function resetPassword(event) {
    event.preventDefault();

    const oldPassword = document.getElementById("old-password").value.trim();
    const newPassword = document.getElementById("new-password").value.trim();
    const confirmPassword = document.getElementById("confirm-password").value.trim();
    const resetBtn = document.getElementById("reset-btn");

    if (!oldPassword || !newPassword || !confirmPassword) {
        alert("All fields are required");
        return;
    }

    if (newPassword !== confirmPassword) {
        alert("New passwords do not match");
        return;
    }

    if (newPassword.length < 8) {
        alert("New password must be at least 8 characters long");
        return;
    }

    // Disable button and show loading state
    resetBtn.disabled = true;
    resetBtn.textContent = "Updating...";

    try {
        const userId = localStorage.getItem("userId"); // ✅ get ID from localStorage

        const res = await fetch(`${API_BASE_URL}/admin/user/reset-password/${userId}`, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ oldPassword, newPassword, confirmPassword })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.message || "Failed to reset password");

        alert("Password updated successfully!");
        closeResetModal();

    } catch (err) {
        console.error("Password reset error:", err);
        alert(`Error: ${err.message}`);
    } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = "Update Password";
    }
}


</script>

</body>
</html>
