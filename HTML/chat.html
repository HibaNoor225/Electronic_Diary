        .chat-list-container {

        .chat-item {

        .profile-pic {

        .profile-initials {

        .online-indicator {
            position: absolute;

            right: 2px;

            height: 16px;
            background: #4caf50;
            border: 3px solid #fdfbf7;
            border-radius: 50%;

        /* Chat Panel Styles */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fdfbf7;

        }

        .chat-header {
            padding: 25px 30px;

            border-bottom: 2px solid #d4c5a9;

            height: 50px;

            object-fit: cover;
            border: 3px solid #d4c5a9;
            box-shadow: 0 4px 12px rgba(139,69,19,0.2);
        }

       .message-actions {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    background: #fdfbf7;
    border-radius: 25px;
    box-shadow: 0 4px 20px rgba(139,69,19,0.2);
    padding: 5px;
    border: 2px solid #d4c5a9;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
}

/* Position actions for sent messages */
/* Sent (on the right side) → actions on the LEFT of the bubble */
.message.sent .message-actions {
    right: calc(100% + 10px); 
    left: auto;
}

/* Received (on the left side) → actions on the RIGHT of the bubble */
/* Default: outside */
/* Received messages → keep compact */
.message.received .message-actions {
    right: 10px; /* Position actions to the right of the message */
    left: auto; /* Remove left positioning */
    min-width: unset; /* Allow natural width */
    max-width: unset; /* Remove forced limit */
    display: flex; /* Ensure buttons align properly */
    gap: 5px; /* Space between buttons */
    padding: 5px 8px; /* Compact padding */
}

/* Hover state for received message actions */
.message.received:hover .message-actions {
    display: flex;
    opacity: 1;
    transform: translateY(-50%) scale(1);
    min-width: auto; /* No forced width */
    max-width: none;
    padding: 5px 8px; /* Smaller padding for compact fit */
}

/* Adjust for smaller screens to ensure actions stay visible */
@media (max-width: 480px) {
    .message.received .message-actions {
        right: 10px; /* Keep actions on the right */
        left: auto;
    }
}
/* Sent messages → wide action bar outside */
.message.sent:hover .message-actions {
    display: flex;
    opacity: 1;
    transform: translateY(-50%) scale(1);
    min-width: 120px; 
    padding: 5px 10px;
}

/* Style for the action bar */
.message-actions {
    position: absolute; /* Position it relative to the message */
    right: 10px; /* Place it 10px from the right edge */
    top: 50%; /* Center it vertically */
    transform: translateY(-50%); /* Adjust vertical centering */
    display: none; /* Hide it by default */
    background: #fdfbf7; /* Background color */
    border-radius: 25px; /* Rounded corners */
    box-shadow: 0 4px 20px rgba(139, 69, 19, 0.2); /* Shadow effect */
    padding: 5px; /* Inner spacing */
    border: 2px solid #d4c5a9; /* Border */
    z-index: 100; /* Ensure it appears above other elements */
}

/* Show the action bar when hovering over it */
.message-actions:hover {
    display: flex;
}

/* Add a pseudo-element to extend the hover area */
.message-actions::before {
    content: '';
    position: absolute;
    left: -20px;
    top: -10px;
    width: 20px;
    height: calc(100% + 20px);
    background: transparent;
}

/* Adjust positioning for sent messages */
.message-group.sent .message-actions::before {
    left: auto; /* Reset left positioning */
    right: -20px; /* Move the pseudo-element to the right */
}
.message-group.received .message-actions {
  /* Anchor the right edge of .message-actions */
  /* to the right edge of the .message. */
  /* -80px pushes it 80px *outward* from the right edge, keeping it visible. */
  right: -80px; /* <-- This should push it OUT to the right */
  left: auto; /* <-- Ensure no left positioning is interfering */
}
/* Adjust the action bar for sent messages */
.message-group.sent .message-actions {
    right: auto; /* Reset right positioning */
    left: -80px; /* Place it 10px from the left edge */
}

                </div>
                <div class="modal-footer">
                    <button class="modal-btn secondary" onclick="window.chatApp.closeManageMembersModal()">Close</button>
                </div>
            </div>
        </div>
    </div>
<script>
class PersonalChat {
    constructor() {
        this.socket = io("http://localhost:3000");
        this.currentUserId = localStorage.getItem('userId');
        this.currentChatId = null;
        this.currentChatType = null;
        this.currentGroupDetails = null;
        this.unreadCounts = {};
        this.lastMessages = {};
        this.onlineUsers = new Set();
        this.replyTo = null;
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.recordingStartTime = null;
        this.timerInterval = null;
        this.isSendingMessage = false;
        this.isRecordingCanceled = false;
        this.typingUsers = new Set();
        this.userMap = new Map();
        this.currentlyEditingMessageId = null;

        if (!this.currentUserId) {
            console.error("User ID not found in localStorage");
            this.showError("Please log in to access your conversations.");
            return;
        }

        this.initializeElements();
        this.setupEventListeners();
        this.setupSocketListeners();
        this.checkURLParams();
        this.loadChats();
    }

    initializeElements() {
        this.chatList = document.getElementById('chatList');
        this.chatMessages = document.getElementById('chatMessages');
        this.chatInput = document.getElementById('chatInput');
        this.sendBtn = document.getElementById('sendBtn');
        this.chatHeaderName = document.getElementById('chatHeaderName');
        this.chatHeaderPic = document.getElementById('chatHeaderPic');
        this.chatHeaderInitials = document.getElementById('chatHeaderInitials');
        this.onlineStatus = document.getElementById('onlineStatus');
        this.searchBox = document.getElementById('searchBox');
        this.emptyState = document.getElementById('emptyState');
        this.chatArea = document.getElementById('chatArea');
        this.typingIndicator = document.getElementById('typingIndicator');
        this.typingText = document.getElementById('typingText');
        this.emojiPicker = document.getElementById('emojiPicker');
        this.recordBtn = document.getElementById('recordBtn');
        this.recordingIndicator = document.getElementById('recordingIndicator');
        this.recordingTimer = document.getElementById('recordingTimer');
        this.createGroupModal = document.getElementById('createGroupModal');
        this.groupNameInput = document.getElementById('groupNameInput');
        this.friendList = document.getElementById('friendList');
        this.manageMembersModal = document.getElementById('manageMembersModal');
        this.memberList = document.getElementById('memberList');
        this.chatActions = document.getElementById('chatActions');
    }

    setupEventListeners() {
        this.sendBtn.addEventListener('click', () => this.sendMessage());
        this.chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.sendMessage();
            }
        });

        this.chatInput.addEventListener('input', () => {
            this.autoResize();
            this.handleTyping();
        });

        this.searchBox.addEventListener('input', (e) => {
            this.searchChats(e.target.value);
        });

        this.recordBtn.addEventListener('click', () => this.toggleRecording());
        const attachBtn = document.querySelector('.input-action-btn[title="Attach File"]');
        attachBtn.addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => this.handleFileUpload(file));
            fileInput.value = '';
        });

        const emojiBtn = document.getElementById('emojiBtn');
        emojiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isVisible = this.emojiPicker.style.display === 'grid';
            this.emojiPicker.style.display = isVisible ? 'none' : 'grid';
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#emojiPicker') && !e.target.closest('#emojiBtn')) {
                this.emojiPicker.style.display = 'none';
            }
        });

        const emojis = document.querySelectorAll('.emoji');
        emojis.forEach(emoji => {
            emoji.addEventListener('click', (e) => {
                e.stopPropagation();
                this.chatInput.value += emoji.dataset.emoji;
                this.chatInput.focus();
                this.autoResize();
                this.emojiPicker.style.display = 'none';
            });
        });

        this.chatMessages.addEventListener('dragover', (e) => {
            e.preventDefault();
            this.chatMessages.classList.add('drag-over');
        });

        this.chatMessages.addEventListener('dragleave', (e) => {
            e.preventDefault();
            this.chatMessages.classList.remove('drag-over');
        });

        this.chatMessages.addEventListener('drop', (e) => {
            e.preventDefault();
            this.chatMessages.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files);
            files.forEach(file => this.handleFileUpload(file));
        });
    }

    setupSocketListeners() {
        this.socket.on('connect_error', (error) => {
            console.error('Socket connection error:', error);
            this.showError('Failed to connect to the conversation server.');
        });

        this.socket.on('receiveMessage', (message) => {
            this.handleReceivedMessage(message);
            if (this.currentChatId === message.chatId) {
                this.chatMessages.querySelector('#noMessages')?.remove();
            } else {
                this.unreadCounts[message.chatId] = (this.unreadCounts[message.chatId] || 0) + 1;
                this.updateUnreadBadge(message.chatId);
                this.updateLastMessage(message.chatId, message.message || (message.fileType ? `[${message.fileType}]` : ''));
            }
        });
this.socket.on('messageEdited', ({ messageId, chatId, type, newText, updatedAt }) => {
        if (chatId === this.currentChatId && type === this.currentChatType) {
            const msgEl = document.querySelector(`[data-id="${messageId}"]`);
            if (msgEl && this.currentlyEditingMessageId !== messageId) { // Avoid updating if user is editing
                const textEl = msgEl.querySelector('.message-text');
                if (textEl) {
                    textEl.textContent = newText;
                    const metaEl = msgEl.querySelector('.message-meta');
                    metaEl.querySelector('.message-time').textContent = this.formatTime(new Date(updatedAt));
                    if (!metaEl.querySelector('.message-edited')) {
                        metaEl.insertAdjacentHTML('beforeend', '<span class="message-edited">Edited</span>');
                    }
                }
            }
        }
    });
        this.socket.on('messageDeletedForMe', ({ messageId, userId, type }) => {
            if (userId === this.currentUserId) {
                const msgEl = document.querySelector(`[data-id="${messageId}"]`);
                if (msgEl) {
                    msgEl.innerHTML = `<div class="message-deleted">This message was deleted for you</div>`;
                    msgEl.classList.add('deleted');
                }
            }
        });

        this.socket.on('messageDeletedForEveryone', ({ messageId, chatId, type }) => {
            const msgEl = document.querySelector(`[data-id="${messageId}"]`);
            if (msgEl) {
                msgEl.innerHTML = `<div class="message-deleted">This message was deleted</div>`;
                msgEl.classList.add('deleted');
                if (this.currentChatId === chatId) {
                    this.updateLastMessage(chatId, 'Message deleted');
                }
            }
        });

        this.socket.on('messageReacted', ({ messageId, reaction, type }) => {
            const msgEl = document.querySelector(`[data-id="${messageId}"]`);
            if (msgEl) {
                let reactionsDiv = msgEl.querySelector('.message-reactions');
                if (!reactionsDiv) {
                    reactionsDiv = document.createElement('div');
                    reactionsDiv.className = 'message-reactions';
                    msgEl.appendChild(reactionsDiv);
                }
                const reactionEl = document.createElement('span');
                reactionEl.className = 'reaction';
                reactionEl.textContent = reaction;
                reactionEl.addEventListener('click', () => this.addReaction(messageId, reaction));
                reactionsDiv.appendChild(reactionEl);
            }
        });

        this.socket.on('userOnline', (userId) => {
            this.onlineUsers.add(userId);
            this.updateOnlineStatus();
        });

        this.socket.on('userOffline', (userId) => {
            this.onlineUsers.delete(userId);
            this.updateOnlineStatus();
        });

        this.socket.on('typing', ({ senderId, chatId, type }) => {
            if (this.currentChatId === chatId && type === this.currentChatType) {
                this.typingUsers.add(senderId);
                this.showTypingIndicator();
            }
        });

        this.socket.on('stopTyping', ({ senderId, chatId, type }) => {
            if (this.currentChatId === chatId && type === this.currentChatType) {
                this.typingUsers.delete(senderId);
                if (this.typingUsers.size === 0) {
                    this.hideTypingIndicator();
                } else {
                    this.showTypingIndicator();
                }
            }
        });

        this.socket.on('memberAdded', ({ userId, groupId }) => {
            if (this.currentChatId === groupId) {
                this.currentGroupDetails.participants.push(userId);
                this.updateChatHeader();
                this.showError('A new member has joined the group!');
            }
            this.loadChats();
        });

        this.socket.on('memberRemoved', ({ userId, groupId }) => {
            if (this.currentChatId === groupId) {
                this.currentGroupDetails.participants = this.currentGroupDetails.participants.filter(id => id !== userId);
                this.updateChatHeader();
                this.showError('A member has been removed from the group.');
            }
            this.loadChats();
        });

        this.socket.on('memberLeft', ({ userId, groupId }) => {
            if (this.currentChatId === groupId) {
                this.currentGroupDetails.participants = this.currentGroupDetails.participants.filter(id => id !== userId);
                if (this.currentGroupDetails.adminId === userId && this.currentGroupDetails.participants.length > 0) {
                    this.currentGroupDetails.adminId = this.currentGroupDetails.participants[0];
                }
                this.updateChatHeader();
                this.showError('A member has left the group.');
            }
            this.loadChats();
        });

        this.socket.on('groupDeleted', ({ groupId }) => {
            if (this.currentChatId === groupId) {
                this.currentChatId = null;
                this.currentChatType = null;
                this.currentGroupDetails = null;
                this.chatArea.style.display = 'none';
                this.emptyState.style.display = 'flex';
                this.showError('This group has been deleted.');
            }
            this.loadChats();
        });

        this.socket.emit('userOnline', this.currentUserId);
    }

    checkURLParams() {
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('userId');
        const username = decodeURIComponent(params.get('username') || '');
        const profilePhoto = decodeURIComponent(params.get('profilePhoto') || '');

        if (userId && username) {
            this.openChat({ userId, username, profilePic: null, type: 'personal' }); // Force null for profilePic
        }
    }

    async toggleRecording() {
        if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
            this.stopRecording();
        } else {
            await this.startRecording();
        }
    }

    async startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.mediaRecorder = new MediaRecorder(stream);
            this.audioChunks = [];
            this.isRecordingCanceled = false;

            this.mediaRecorder.addEventListener('dataavailable', (e) => {
                this.audioChunks.push(e.data);
            });

            this.mediaRecorder.addEventListener('stop', () => {
                if (!this.isRecordingCanceled) {
                    const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                    const duration = this.calculateDuration();
                    this.sendVoiceMessage(audioBlob, duration);
                }
                stream.getTracks().forEach(track => track.stop());
                this.stopTimer();
            });

            this.mediaRecorder.start();
            this.recordBtn.classList.add('recording');
            this.recordBtn.querySelector('i').classList.replace('fa-microphone', 'fa-stop');
            this.recordingIndicator.style.display = 'flex';
            this.startTimer();
        } catch (err) {
            console.error('Error starting recording:', err);
            this.showError('Failed to start recording. Please check microphone permissions.');
        }
    }

    stopRecording() {
        if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
            this.mediaRecorder.stop();
            this.recordBtn.classList.remove('recording');
            this.recordBtn.querySelector('i').classList.replace('fa-stop', 'fa-microphone');
            this.recordingIndicator.style.display = 'none';
        }
    }

    cancelRecording() {
        if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
            this.isRecordingCanceled = true;
            this.mediaRecorder.stop();
            this.audioChunks = [];
            this.recordBtn.classList.remove('recording');
            this.recordBtn.querySelector('i').classList.replace('fa-stop', 'fa-microphone');
            this.recordingIndicator.style.display = 'none';
            this.stopTimer();
        }
    }

    startTimer() {
        this.recordingStartTime = Date.now();
        this.timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - this.recordingStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            this.recordingTimer.textContent = `${minutes}:${seconds}`;
        }, 1000);
    }

    stopTimer() {
        if (this.timerInterval) {
            clearInterval(this.timerInterval);
            this.timerInterval = null;
        }
        this.recordingTimer.textContent = '00:00';
    }

    calculateDuration() {
        if (!this.recordingStartTime) return 0;
        return Math.floor((Date.now() - this.recordingStartTime) / 1000);
    }

    async sendVoiceMessage(audioBlob, duration) {
        if (!this.currentChatId || !this.currentChatType) return;
        if (this.isRecordingCanceled) return;

        const tempId = `temp-${Date.now()}-${Math.random()}`;
        const formData = new FormData();
        formData.append('file', audioBlob, `voice-message-${Date.now()}.webm`);
        formData.append('senderId', this.currentUserId);
        formData.append('chatId', this.currentChatId);
        formData.append('type', this.currentChatType);
        formData.append('duration', duration);

        try {
            this.appendMessage({
                sender: this.currentUserId,
                fileUrl: URL.createObjectURL(audioBlob),
                fileType: 'audio',
                message: '',
                timestamp: new Date(),
                _id: tempId,
                isTemp: true,
                duration
            });

            const res = await fetch('http://localhost:3000/chat/api/upload', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (data.success) {
                this.socket.emit('sendMessage', {
                    chatId: this.currentChatId,
                    senderId: this.currentUserId,
                    fileUrl: data.fileUrl,
                    fileType: data.fileType,
                    message: data.message,
                    timestamp: new Date(),
                    tempId,
                    duration: data.duration,
                    type: this.currentChatType
                });
            } else {
                const tempMessage = document.querySelector(`[data-id="${tempId}"]`);
                if (tempMessage) tempMessage.remove();
                this.showError('Failed to upload voice message.');
            }
        } catch (err) {
            console.error('Error uploading voice message:', err);
            const tempMessage = document.querySelector(`[data-id="${tempId}"]`);
            if (tempMessage) tempMessage.remove();
            this.showError('Error uploading voice message. Please try again.');
        }
        this.isSendingMessage = false;
    }

    async loadChats() {
        try {
            const response = await fetch(`http://localhost:3000/chat/api/chat/${this.currentUserId}`);
            const data = await response.json();
            console.log('Conversations loaded:', data);

            this.chatList.innerHTML = '';
            if (data.success && data.chats.length > 0) {
                data.chats.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));
                data.chats.forEach(chat => {
                    this.addChatToSidebar(chat);
                });

                if (!this.currentChatId) {
                    const latestChat = data.chats[0];
                    this.openChat(latestChat);
                }
            } else {
                this.chatList.innerHTML = '<p style="text-align: center; color: #8d6e63; font-style: italic; padding: 30px;">No conversations yet</p>';
                if (!this.currentChatId) {
                    this.emptyState.style.display = 'flex';
                    this.chatArea.style.display = 'none';
                }
            }
        } catch (error) {
            console.error('Error loading conversations:', error);
            this.chatList.innerHTML = '<p style="text-align: center; color: #c62828; padding: 30px;">Error loading conversations</p>';
            this.showError('Failed to load conversations. Please try again.');
        }
    }

    getUserInitials(name) {
        if (!name || name === 'undefined') return 'U';
        const words = name.split(' ').filter(word => word.length > 0);
        if (words.length === 0) return 'U';
        if (words.length === 1) return words[0].charAt(0).toUpperCase();
        return (words[0].charAt(0) + words[words.length - 1].charAt(0)).toUpperCase();
    }

    addChatToSidebar(chat) {
        const existingChat = document.querySelector(`[data-chat-id="${chat.chatId}"]`);
        if (existingChat) {
            this.updateChatItem(existingChat, chat);
            return;
        }

        const isPersonal = chat.type === 'personal';
        const name = isPersonal ? (chat.username || 'Unknown Friend') : (chat.groupName || 'Unnamed Group');
        const isOnline = isPersonal && this.onlineUsers.has(chat.userId);
        const unreadCount = this.unreadCounts[chat.chatId] || 0;
        const initials = this.getUserInitials(name);

        const chatItem = document.createElement('div');
        chatItem.className = 'chat-item';
        chatItem.dataset.chatId = chat.chatId;

        // Always show initials, ignore profilePic
        const profileElement = `
            <div style="position: relative;">
                <div class="profile-initials">${initials}</div>
                ${isOnline && isPersonal ? '<div class="online-indicator"></div>' : ''}
            </div>
        `;

        chatItem.innerHTML = `
            ${profileElement}
            <div class="chat-info">
                <div class="chat-name">${name}</div>
                <div class="last-message">${chat.lastMessage || 'Begin your conversation...'}</div>
                ${!isPersonal ? `<div class="group-indicator">${chat.participants.length} members</div>` : ''}
            </div>
            <div class="chat-meta">
                <div class="message-time">${this.formatTime(chat.lastMessageTime)}</div>
                ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
            </div>
        `;

        chatItem.addEventListener('click', () => {
            this.openChat(chat);
        });

        this.chatList.appendChild(chatItem);
        console.log(`Added conversation to sidebar: ${name}`);
    }

    updateChatItem(chatItem, chat) {
        const isPersonal = chat.type === 'personal';
        const name = isPersonal ? (chat.username || 'Unknown Friend') : (chat.groupName || 'Unnamed Group');
        const isOnline = isPersonal && this.onlineUsers.has(chat.userId);
        const unreadCount = this.unreadCounts[chat.chatId] || 0;
        const initials = this.getUserInitials(name);

        // Always show initials, ignore profilePic
        const profileElement = `
            <div style="position: relative;">
                <div class="profile-initials">${initials}</div>
                ${isOnline && isPersonal ? '<div class="online-indicator"></div>' : ''}
            </div>
        `;

        chatItem.innerHTML = `
            ${profileElement}
            <div class="chat-info">
                <div class="chat-name">${name}</div>
                <div class="last-message">${chat.lastMessage || 'Begin your conversation...'}</div>
                ${!isPersonal ? `<div class="group-indicator">${chat.participants.length} members</div>` : ''}
            </div>
            <div class="chat-meta">
                <div class="message-time">${this.formatTime(chat.lastMessageTime)}</div>
                ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
            </div>
        `;
    }
async openChat(chat) {
    console.log(`Opening ${chat.type} chat:`, chat);
    this.currentChatId = chat.chatId;
    this.currentChatType = chat.type;
    this.currentGroupDetails = chat.type === 'group' ? {
        groupName: chat.groupName,
        participants: chat.participants,
        adminId: chat.adminId
    } : null;

    this.socket.emit('joinChat', { chatId: this.currentChatId, type: this.currentChatType });

    this.emptyState.style.display = 'none';
    this.chatArea.style.display = 'flex';

    const name = chat.type === 'personal' ? (chat.username || 'Unknown Friend') : (chat.groupName || 'Unnamed Group');
    this.chatHeaderName.textContent = name;

    // Always show initials in chat header, ignore profilePic
    this.chatHeaderPic.style.display = 'none';
    this.chatHeaderInitials.style.display = 'flex';
    this.chatHeaderInitials.textContent = this.getUserInitials(name);

    document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
    const chatItem = document.querySelector(`[data-chat-id="${chat.chatId}"]`);
    if (chatItem) {
        chatItem.classList.add('active');
    }

    this.unreadCounts[chat.chatId] = 0;
    this.updateUnreadBadge(chat.chatId);

    if (chat.type === 'group') {
        await this.loadGroupParticipants(chat.participants);
    }

    await this.loadMessages(chat.chatId);

    this.updateChatHeader();
    this.updateOnlineStatus();

    this.chatInput.style.display = 'block';
    this.chatInput.disabled = false; // Ensure input is not disabled
    this.chatInput.focus(); // Focus on the input field

    this.emojiPicker.style.display = 'none';

    if (window.innerWidth <= 768) {
        document.getElementById('chatSidebar').classList.remove('open');
    }
}
    // NEW: Method to fetch and cache usernames for group participants
    async loadGroupParticipants(participantIds) {
        this.userMap.clear();
        const promises = participantIds.map(async (id) => {
            if (id === this.currentUserId) {
                this.userMap.set(id, 'You'); // Not needed for display, but for completeness
                return;
            }
            try {
                const res = await fetch(`http://localhost:3000/chat/api/user/${id}`); // Assumes backend endpoint for user details
                const data = await res.json();
                if (data.success && data.user) {
                    this.userMap.set(id, data.user.username || 'Unknown');
                } else {
                    this.userMap.set(id, 'Unknown');
                }
            } catch (err) {
                console.error(`Error fetching user ${id}:`, err);
                this.userMap.set(id, 'Unknown');
            }
        });
        await Promise.all(promises);
    }
    updateChatHeader() {
        this.chatActions.innerHTML = '';
        if (this.currentChatType === 'personal') {
            this.chatActions.innerHTML = `
                <button class="action-btn" title="Video Call"><i class="fas fa-video"></i></button>
                <button class="action-btn" title="Voice Call"><i class="fas fa-phone"></i></button>
                <button class="action-btn" title="More Options"><i class="fas fa-ellipsis-v"></i></button>
            `;
        } else if (this.currentChatType === 'group') {
            let actions = `
                <button class="action-btn" title="Group Info" onclick="window.chatApp.openManageMembersModal()"><i class="fas fa-users"></i></button>
                <button class="action-btn" title="Leave Group" onclick="window.chatApp.leaveGroup()"><i class="fas fa-sign-out-alt"></i></button>
            `;
            if (this.currentGroupDetails.adminId === this.currentUserId) {
                actions += `
                    <button class="action-btn" title="Delete Group" onclick="window.chatApp.deleteGroup()"><i class="fas fa-trash"></i></button>
                `;
            }
            this.chatActions.innerHTML = actions;
        }

        if (this.currentChatType === 'group') {
            const participantCount = this.currentGroupDetails.participants.length;
            this.onlineStatus.textContent = `${participantCount} members${this.currentGroupDetails.adminId === this.currentUserId ? ' (You are admin)' : ''}`;
        }
    }

    async loadMessages(chatId) {
    try {
        const response = await fetch(`http://localhost:3000/chat/api/messages/${chatId}?userId=${this.currentUserId}`);
        const data = await response.json();
        console.log('Messages loaded:', data);

        this.chatMessages.innerHTML = '';
        if (data.success && data.messages.length > 0) {
            data.messages.forEach(message => {
                this.appendMessage(message);
            });
            this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
        } else {
            this.chatMessages.innerHTML = '<div id="noMessages" style="text-align: center; color: #8d6e63; font-style: italic; padding: 30px;">No messages yet</div>';
        }
    } catch (error) {
        console.error('Error loading messages:', error);
        this.chatMessages.innerHTML = '<div style="text-align: center; color: #c62828; padding: 30px;">Error loading messages</div>';
        this.showError('Failed to load messages. Please try again.');
    }
}


appendMessage(message) {
    const isSent = message.sender === this.currentUserId;
    const messageGroup = document.createElement('div');
    messageGroup.className = `message-group ${isSent ? 'sent' : 'received'}`;

    const messageEl = document.createElement('div');
    messageEl.className = `message ${isSent ? 'sent' : 'received'}`;
    messageEl.dataset.id = message._id;
    if (message.isTemp) messageEl.classList.add('temp');

    // Create message actions container
    const actionsContainer = document.createElement('div');
    actionsContainer.className = 'message-actions';
    actionsContainer.innerHTML = `

    handleReceivedMessage(message) {
    try {
        // If server confirms a temp message, replace the optimistic element
        if (message.tempId) {
            const tempEl = document.querySelector(`[data-id="${message.tempId}"]`);
            if (tempEl) {
                // Remove the temp element (its container) and append the confirmed message
                const tempGroup = tempEl.closest('.message-group');
                if (tempGroup) tempGroup.remove();
                this.appendMessage(message); // append confirmed message
                return;
            }
        }

        // If message belongs to the currently open chat, show it immediately
        if (message.chatId && message.chatId === this.currentChatId) {
            this.appendMessage(message);
            this.chatMessages.querySelector('#noMessages')?.remove();
            return;
        }

        // For other chats: increment unread counter keyed by chatId (not sender)
        if (message.chatId) {
            this.unreadCounts[message.chatId] = (this.unreadCounts[message.chatId] || 0) + 1;
            this.updateUnreadBadge(message.chatId);
        }

        // Build a short display text for the sidebar's last-message preview
        let display;
        if (message.fileUrl) {
            display = message.fileType === 'image'
                ? 'Shared a photo'
                : message.fileType === 'audio'
                    ? 'Shared a voice message'
                    : 'Shared a file';
        } else if (message.deletedForEveryone) {
            display = 'Message deleted';
        } else {
            display = message.message || '';
        }

        // Update the last message for the chat item (use chatId)
        if (message.chatId) {
            this.updateLastMessage(message.chatId, display);
        }

        // If the chat item isn't present in sidebar, reload chats so it appears
        if (message.chatId && !document.querySelector(`[data-chat-id="${message.chatId}"]`)) {
            this.loadChats();
        }
    } catch (err) {
        console.error('handleReceivedMessage error:', err);
    }
}
    async sendMessage() {
    if (!this.currentChatId || !this.currentChatType || this.isSendingMessage) return;

    const messageText = this.chatInput.value.trim();
    if (!messageText && !this.replyTo) return;

    this.isSendingMessage = true;
    const tempId = `temp-${Date.now()}-${Math.random()}`;
    this.appendMessage({
        sender: this.currentUserId,
        message: messageText,
        timestamp: new Date(),
        _id: tempId,
        isTemp: true,
        replyTo: this.replyTo
    });

    try {
        this.socket.emit('sendMessage', {
            chatId: this.currentChatId,
            senderId: this.currentUserId,
            message: messageText,
            replyTo: this.replyTo,
            type: this.currentChatType,
            tempId
        });
        this.chatInput.value = '';
        this.replyTo = null;
        this.updateReplyPreview();
        this.autoResize();
    } catch (error) {
        console.error('Error sending message:', error);
        const tempMessage = document.querySelector(`[data-id="${tempId}"]`);
        if (tempMessage) tempMessage.remove();
        this.showError('Failed to send message. Please try again.');
    } finally {
        this.isSendingMessage = false;
    }
}

    async handleFileUpload(file) {
        if (!this.currentChatId || !this.currentChatType) return;

        const tempId = `temp-${Date.now()}-${Math.random()}`;
        const formData = new FormData();
        formData.append('file', file);
        formData.append('senderId', this.currentUserId);
        formData.append('chatId', this.currentChatId);
        formData.append('type', this.currentChatType);

        try {
            this.appendMessage({
                sender: this.currentUserId,
                fileUrl: URL.createObjectURL(file),
                fileType: file.type.startsWith('image') ? 'image' : file.type.startsWith('audio') ? 'audio' : 'file',
                message: '',
                timestamp: new Date(),
                _id: tempId,
                isTemp: true,
                fileName: file.name,
                fileSize: file.size
            });

            const res = await fetch('http://localhost:3000/chat/api/upload', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (data.success) {
                this.socket.emit('sendMessage', {
                    chatId: this.currentChatId,
                    senderId: this.currentUserId,
                    fileUrl: data.fileUrl,
                    fileType: data.fileType,
                    message: data.message,
                    fileName: data.fileName,
                    fileSize: data.fileSize,
                    timestamp: new Date(),
                    tempId,
                    type: this.currentChatType
                });
            } else {
                const tempMessage = document.querySelector(`[data-id="${tempId}"]`);
                if (tempMessage) tempMessage.remove();
                this.showError('Failed to upload file.');
            }
        } catch (err) {
            console.error('Error uploading file:', err);
            const tempMessage = document.querySelector(`[data-id="${tempId}"]`);
            if (tempMessage) tempMessage.remove();
            this.showError('Error uploading file. Please try again.');
        }
    }

    async deleteMessageForMe(messageId) {
    this.chatInput.blur(); // Remove focus from input
    try {
        const response = await fetch('http://localhost:3000/chat/api/message/delete/me', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messageId,
                userId: this.currentUserId,
                type: this.currentChatType,
                chatId: this.currentChatId
            })
        });
        const data = await response.json();
        if (data.success) {
            const msgEl = document.querySelector(`[data-id="${messageId}"]`);
            if (msgEl) {
                msgEl.innerHTML = `<div class="message-deleted">This message was deleted for you</div>`;
                msgEl.classList.add('deleted');
                setTimeout(() => {
                    if (msgEl && msgEl.parentElement) {
                        msgEl.classList.add('remove');
                        setTimeout(() => {
                            if (msgEl && msgEl.parentElement) {
                                msgEl.parentElement.remove();
                            }
                        }, 500);
                    }
                }, 2500);
            }
        } else {
            this.showError('Failed to delete message: ' + data.message);
        }
    } catch (error) {
        console.error('Error deleting message:', error);
        this.showError('Error deleting message. Please try again.');
    }
}

    async createGroup() {
        const groupName = this.groupNameInput.value.trim();
        const selectedFriends = Array.from(this.friendList.querySelectorAll('input:checked')).map(input => input.value);
        if (!groupName) {
            this.showError('Please enter a group name.');
            return;
        }
        if (selectedFriends.length < 2) {
            this.showError('Please select at least 2 friends to create a group.');
            return;
        }

        try {
            const response = await fetch('http://localhost:3000/chat/api/group/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    groupName,
                    members: [...selectedFriends, this.currentUserId],
                    createdBy: this.currentUserId
                })
            });
            const data = await response.json();
            if (data.success) {
                this.closeCreateGroupModal();
                this.loadChats();
                this.openChat({
                    chatId: data.group._id,
                    type: 'group',
                    groupName: data.group.groupName,
                    participants: data.group.participants,
                    adminId: data.group.adminId,
                    lastMessage: '',
                    lastMessageTime: new Date()
                });
            } else {
                this.showError('Failed to create group: ' + data.message);
            }
        } catch (error) {
            console.error('Error creating group:', error);
            this.showError('Error creating group. Please try again.');
        }
    }

    async openManageMembersModal() {

        this.memberList.innerHTML = '';
        try {
            const response = await fetch(`http://localhost:3000/chat/api/friends/${this.currentUserId}`);
            const data = await response.json();
            if (data.success) {
                const friends = data.friends;
                const isAdmin = this.currentGroupDetails.adminId === this.currentUserId;
                const members = this.currentGroupDetails.participants;
                this.memberList.innerHTML = friends.map(friend => {
                    const isMember = members.includes(friend._id);
                    const isCurrentUser = friend._id === this.currentUserId;
                    let actionButton = '';
                    if (isAdmin && !isCurrentUser) {
                        if (isMember) {
                            actionButton = `<button class="modal-btn secondary" onclick="window.chatApp.removeMember('${friend._id}')">Remove</button>`;
                        } else {
                            actionButton = `<button class="modal-btn primary" onclick="window.chatApp.addMember('${friend._id}')">Add</button>`;
                        }
                    }
                    return `
                        <div class="friend-item">
                            <label>${friend.username}${isCurrentUser ? ' (You)' : ''}${isMember ? ' (Member)' : ''}</label>
                            ${actionButton}
                        </div>
                    `;
                }).join('');
                this.manageMembersModal.style.display = 'flex';
            } else {
                this.showError('Failed to load friends list.');
            }
        } catch (error) {
            console.error('Error loading friends:', error);
            this.showError('Failed to load friends list.');
        }
    }

    closeManageMembersModal() {
        this.manageMembersModal.style.display = 'none';
        this.memberList.innerHTML = '';
    }

    async addMember(userId) {
    try {
        const groupId = this.currentChatId;
        const adminId = this.currentUserId;

        console.log(`Adding user ${userId} to group ${groupId} by admin ${adminId}`);

        const response = await fetch(`http://localhost:3000/chat/api/group/${groupId}/add`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId,
                adminId
            })
        });

        const data = await response.json();

        if (data.success) {
            console.log('Member added successfully:', data.group);
            if (this.currentChatId === groupId && this.currentGroupDetails) {
                this.currentGroupDetails.participants = data.group.participants;
                this.updateChatHeader();
            }
            await this.loadChats();
            this.socket.emit('memberAdded', { userId, groupId });
            this.closeManageMembersModal();
            this.showError('Member added successfully!');
        } else {
            console.error('Add member failed:', response.status, response.statusText, data);
            this.showError('Failed to add member: ' + data.message);
        }
    } catch (error) {
        console.error('Error adding member:', error);
        this.showError('Error adding member. Please try again.');
    }
}
// inside class PersonalChat
async removeMember(userId) {
    try {
        const groupId = this.currentChatId;
        const adminId = this.currentUserId;

        console.log(`Removing user ${userId} from group ${groupId} by admin ${adminId}`);

        if (!groupId || !userId || !adminId) {
            throw new Error("Missing groupId, userId, or adminId");
        }

        const res = await fetch(`http://localhost:3000/chat/api/group/${groupId}/remove`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, adminId })
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch (e) { data = { success: false, message: text }; }

        if (!res.ok || !data.success) {
            console.error('Remove member failed:', res.status, res.statusText, data);
            throw new Error(data.message || `HTTP ${res.status}`);
        }

        console.log('Member removed successfully:', data.group);
        if (this.currentChatId === groupId && this.currentGroupDetails) {
            this.currentGroupDetails.participants = data.group.participants;
            this.updateChatHeader();
        }
        await this.loadChats();
        this.socket.emit('memberRemoved', { userId, groupId });
        this.closeManageMembersModal();
        this.showError('Member removed successfully!');
    } catch (err) {
        console.error('Error removing member:', err.message || err);
        this.showError('Error removing member: ' + (err.message || 'Please try again.'));
    }
}
async leaveGroup() {
    if (!confirm('Are you sure you want to leave this group?')) return;
    try {
        const groupId = this.currentChatId;
        const userId = this.currentUserId;

        console.log(`User ${userId} leaving group ${groupId}`);

        const res = await fetch(`http://localhost:3000/chat/api/group/${groupId}/leave`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            console.error('Leave group failed:', res.status, res.statusText, data);
            this.showError('Failed to leave group: ' + (data.message || res.statusText));
            return;
        }

        // success — update UI & reload chats
        this.socket.emit('memberLeft', { userId, groupId });
        this.currentChatId = null;
        this.currentChatType = null;
        this.currentGroupDetails = null;
        this.chatArea.style.display = 'none';
        this.emptyState.style.display = 'flex';
        await this.loadChats();
        this.showError('You have left the group.');
    } catch (error) {
        console.error('Error leaving group:', error);
        this.showError('Error leaving group: ' + (error.message || 'Please try again.'));
    }
}
// Refactored deleteGroup method
async deleteGroup() {
    if (!confirm('Are you sure you want to delete this group? This cannot be undone.')) return;
    try {
        const groupId = this.currentChatId;
        const adminId = this.currentUserId;

        console.log(`Admin ${adminId} deleting group ${groupId}`);

        const data = await fetch(`http://localhost:3000/chat/api/group/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ groupId, adminId })
        });

        console.log('Group deleted successfully:', data);

        this.socket.emit('groupDeleted', { groupId });
        this.currentChatId = null;
        this.currentChatType = null;
        this.currentGroupDetails = null;
        this.chatArea.style.display = 'none';
        this.emptyState.style.display = 'flex';
        await this.loadChats();
        this.showError('Group deleted successfully.');

    } catch (error) {
        console.error('Error deleting group:', error.message || error);
        this.showError('Error deleting group: ' + (error.message || 'Please try again.'));
    }
}
    showError(message) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.textContent = message;
        document.body.appendChild(errorDiv);
        setTimeout(() => {
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
                setTimeout(() => errorDiv.remove(), 300);
            }, 3000);
        }, 100);
    }

    updateOnlineStatus() {
        if (this.currentChatType === 'personal' && this.currentChatId) {
            const chat = Array.from(this.chatList.querySelectorAll('.chat-item')).find(item => item.dataset.chatId === this.currentChatId);
            if (chat && this.onlineUsers.has(chat.dataset.userId)) {
                this.onlineStatus.textContent = 'Online';
                this.onlineStatus.classList.add('online');
            } else {
                this.onlineStatus.textContent = 'Offline';
                this.onlineStatus.classList.remove('online');
            }
        }
    }

    updateUnreadBadge(chatId) {
        const chatItem = document.querySelector(`[data-chat-id="${chatId}"]`);
        if (chatItem) {
            const badge = chatItem.querySelector('.unread-badge');
            if (this.unreadCounts[chatId] > 0) {
                if (badge) {
                    badge.textContent = this.unreadCounts[chatId];
                } else {
                    const newBadge = document.createElement('div');
                    newBadge.className = 'unread-badge';
                    newBadge.textContent = this.unreadCounts[chatId];
                    chatItem.querySelector('.chat-meta').appendChild(newBadge);
                }
            } else if (badge) {
                badge.remove();
            }
        }
    }

    updateLastMessage(chatId, message) {
        this.lastMessages[chatId] = message;
        const chatItem = document.querySelector(`[data-chat-id="${chatId}"]`);
        if (chatItem) {
            const lastMessageEl = chatItem.querySelector('.last-message');
            if (lastMessageEl) {
                lastMessageEl.textContent = message || 'Begin your conversation...';
            }
        }
    }

    formatTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        const now = new Date();
        const diff = (now - date) / 1000;
        if (diff < 60) return 'Just now';
        if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
        return date.toLocaleDateString();
    }

    formatDuration(seconds) {
        if (!seconds) return '0:00';
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${minutes}:${secs.toString().padStart(2, '0')}`;
    }

    formatFileSize(bytes) {
        if (!bytes) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        let size = bytes;
        let unitIndex = 0;
        while (size >= 1024 && unitIndex < units.length - 1) {
            size /= 1024;
            unitIndex++;
        }
        return `${size.toFixed(1)} ${units[unitIndex]}`;
    }

    autoResize() {
        this.chatInput.style.height = 'auto';
        this.chatInput.style.height = `${Math.min(this.chatInput.scrollHeight, 100)}px`;
    }

    handleTyping() {
        if (!this.currentChatId || !this.currentChatType) return;
        this.socket.emit('typing', {
            senderId: this.currentUserId,
            chatId: this.currentChatId,
            type: this.currentChatType
        });
        clearTimeout(this.typingTimeout);
        this.typingTimeout = setTimeout(() => {
            this.socket.emit('stopTyping', {
                senderId: this.currentUserId,
                chatId: this.currentChatId,
                type: this.currentChatType
            });
        }, 2000);
    }

    showTypingIndicator() {
        this.typingIndicator.style.display = 'flex';
        this.typingText.textContent = this.typingUsers.size === 1 ? 'Someone is writing...' : 'Multiple users are writing...';
    }

    hideTypingIndicator() {
        this.typingIndicator.style.display = 'none';
    }

    showContextMenu(e, messageId, isSent, message) {
        const existingMenu = document.querySelector('.context-menu');
        if (existingMenu) existingMenu.remove();

        const menu = document.createElement('div');
        menu.className = 'context-menu';
        menu.style.top = `${e.clientY}px`;
        menu.style.left = `${e.clientX}px`;

        const options = [];
        if (!message.deletedForEveryone && !message.hiddenFor?.includes(this.currentUserId)) {
            options.push(`<div class="context-menu-item" onclick="window.chatApp.replyToMessage('${messageId}')">Reply</div>`);
            options.push(`<div class="context-menu-item" onclick="window.chatApp.addReaction('${messageId}', '😊')">React 😊</div>`);
            options.push(`<div class="context-menu-item" onclick="window.chatApp.addReaction('${messageId}', '👍')">React 👍</div>`);
            options.push(`<div class="context-menu-item" onclick="window.chatApp.addReaction('${messageId}', '❤️')">React ❤️</div>`);
            options.push(`<div class="context-menu-item" onclick="window.chatApp.deleteMessageForMe('${messageId}')">Delete for Me</div>`);
            if (isSent) {
                options.push(`<div class="context-menu-item" onclick="window.chatApp.deleteMessageForEveryone('${messageId}')">Delete for Everyone</div>`);
            }
        }

        menu.innerHTML = options.join('');
        document.body.appendChild(menu);

        const removeMenu = () => {
            menu.remove();
            document.removeEventListener('click', removeMenu);
        };
        document.addEventListener('click', removeMenu);
    }

    replyToMessage(messageId) {
    this.replyTo = messageId;
    this.updateReplyPreview();
    this.chatInput.focus(); // Ensure input is focused for typing
}

updateReplyPreview() {
    let replyPreview = document.querySelector('.reply-preview');
    if (this.replyTo) {
        if (!replyPreview) {
            replyPreview = document.createElement('div');
            replyPreview.className = 'reply-preview';
            replyPreview.dataset.replyId = this.replyTo;
            this.chatInput.parentElement.parentElement.insertBefore(replyPreview, this.chatInput.parentElement);
        }
        const messageEl = document.querySelector(`[data-id="${this.replyTo}"]`);
        let replyText = 'Replying to a previous message';
        
        if (messageEl) {
            const textEl = messageEl.querySelector('.message-text');
            const imageEl = messageEl.querySelector('.message-image');
            const audioEl = messageEl.querySelector('.message-audio');
            const fileEl = messageEl.querySelector('.file-message');
            
            if (textEl && textEl.textContent.trim()) {
                replyText = `Replying to: ${textEl.textContent.substring(0, 30)}${textEl.textContent.length > 30 ? '...' : ''}`;
            } else if (imageEl) {
                replyText = 'Replying to: Image';
            } else if (audioEl) {
                replyText = 'Replying to: Voice message';
            } else if (fileEl) {
                replyText = 'Replying to: File';
            } else {
                replyText = 'Replying to: Message';
            }
        } else {
            replyText = 'Replying to a deleted or unavailable message';
        }

        replyPreview.innerHTML = `
            <div class="reply-content">
                <span class="reply-text">${replyText}</span>
                <button class="close-reply" onclick="window.chatApp.cancelReply()">×</button>
            </div>
        `;
    } else if (replyPreview) {
        replyPreview.remove();
    }
}

    cancelReply() {
        this.replyTo = null;
        this.updateReplyPreview();
    }
}

window.chatApp = new PersonalChat();
</script>
