
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write New Memories</title>

<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./themes.css">
<script type="module" src="./theme.js"></script>
<style>
* { 
  margin:0; 
  padding:0; 
  box-sizing:border-box; 
  font-family:'Georgia','Times New Roman',serif; 
}

body { 
  background: var(--bg-gradient); 
  min-height:100vh; 
  padding:20px; 
  line-height:1.8; 
}

.container { 
  max-width:900px; 
  margin:0 auto; 
  background: var(--surface-1-bg); 
  border-radius:20px; 
  padding:50px 60px; 
  box-shadow:0 20px 60px var(--shadow-color); 
  border:3px solid var(--border-color); 
  position:relative; 
}
.container::before { 
  content:''; 
  position:absolute; 
  top:0; left:40px; 
  width:2px; height:100%; 
  background: var(--accent-1); 
  opacity:0.3; 
}

.back-btn { 
  margin-left:20px; 
  padding:12px 24px; 
  background: var(--btn-bg); 
  color: var(--btn-fg); 
  border:none; 
  border-radius:25px; 
  cursor:pointer; 
  font-weight:500; 
  transition:0.3s; 
  text-decoration:none; 
  display:inline-block; 
  margin-bottom:30px; 
  font-family:-apple-system,BlinkMacSystemFont,sans-serif; 
  box-shadow:0 4px 15px var(--shadow-color); 
}
.back-btn:hover { background: var(--btn-hover); transform:translateY(-2px); }

.diary-header { 
  text-align:center; 
  margin-bottom:40px; 
  border-bottom:2px solid var(--border-color); 
  padding-bottom:20px; 
}
.diary-title { 
  font-size:2.5rem; 
  color: var(--heading); 
  font-weight:bold; 
  text-shadow:1px 1px 3px var(--shadow-color); 
  margin-bottom:10px; 
}
.diary-subtitle { font-size:1.2rem; color: var(--muted-text); font-style:italic; }
.page-date { font-size:1.1rem; color: var(--accent-1); font-weight:600; margin-top:10px; }

.events-container { margin-bottom:30px; }

.event-card { 
  background: var(--surface-2-bg); 
  border-radius:15px; 
  padding:30px; 
  margin-bottom:25px; 
  box-shadow:0 8px 25px var(--shadow-color); 
  border:2px solid var(--border-color); 
  position:relative; 
  transition:all 0.3s ease; 
}
.event-card:hover { transform:translateY(-2px); box-shadow:0 12px 35px var(--shadow-color); }
.event-card::before { 
  content:'✍️'; 
  position:absolute; 
  top:20px; left:-25px; 
  font-size:1.5rem; 
  background: var(--surface-1-bg); 
  padding:5px; 
  border-radius:50%; 
  border:2px solid var(--border-color); 
}
/* Force form fields to stack properly */
.event-card {
  display: block; /* prevent flex collapsing everything into a row */
}

.form-group {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  margin-bottom: 20px;
}

.event-card input,
.event-card textarea,
.event-card select {
  display: block;
  width: 100%;
}

.card-header { 
  display:flex; 
  justify-content:space-between; 
  align-items:center; 
  margin-bottom:25px; 
  padding-bottom:15px; 
  border-bottom:1px solid var(--border-color); 
}

.event-number {
  background: var(--btn-bg);
  color: var(--btn-fg);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 600;
  box-shadow: 0 4px 15px var(--shadow-color);
}


.remove-event-btn { 
  padding:6px 14px; 
  background: var(--error-bg); 
  color: var(--btn-fg); 
  border:none; 
  border-radius:15px; 
  cursor:pointer; 
  font-weight:600; 
  font-size:0.8rem; 
  transition:all 0.3s ease; 
  box-shadow:0 3px 10px var(--error-shadow); 
}
.remove-event-btn:hover { background: var(--error-hover-bg); transform:scale(1.05); }

.form-group { margin-bottom:20px; }
.form-group label { 
  display:block; 
  margin-bottom:10px; 
  font-weight:600; 
  color: var(--heading); 
  font-size:1.1em; 
  text-shadow:1px 1px 2px var(--shadow-color); 
}
.event-card input, .event-card textarea { 
  width:100%; 
  padding:15px; 
  border-radius:12px; 
  border:2px solid var(--border-color); 
  font-size:1rem; 
  background: var(--surface-2-bg); 
  transition:all 0.3s ease; 
  color: var(--text); 
  line-height:1.6; 
}
.event-card input:focus, .event-card textarea:focus { 
  outline:none; 
  border-color: var(--btn-bg); 
  box-shadow:0 0 15px var(--shadow-color); 
  transform:translateY(-1px); 
  background: var(--surface-1-bg); 
}
.event-card textarea { resize:vertical; min-height:120px; text-align:justify; }

.file-input-label { 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  padding:15px; 
  background: var(--btn-gradient); 
  color: var(--btn-fg); 
  border-radius:12px; 
  cursor:pointer; 
  transition:all 0.3s ease; 
  font-weight:600; 
  gap:12px; 
  font-size:1rem; 
  box-shadow:0 4px 15px var(--shadow-color); 
  border:2px solid transparent; 
}
.file-input-label:hover { transform:translateY(-2px); box-shadow:0 6px 20px var(--shadow-color); border-color:var(--border-color); }
.file-input-label::before { content:"📷"; font-size:1.2em; }

.media-preview { 
  display:grid; 
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); 
  gap:15px; 
  margin-top:15px; 
  padding:15px; 
  background: var(--surface-3-bg); 
  border-radius:12px; 
  border:2px dashed var(--border-color); 
}
.media-preview img, .media-preview video, .media-preview audio { 
  width:100%; 
  max-height:100px; 
  object-fit:cover; 
  border-radius:8px; 
  box-shadow:0 4px 12px var(--shadow-color); 
  transition:all 0.3s ease; 
}
.media-preview img:hover, .media-preview video:hover { 
  transform:scale(1.05); 
  box-shadow:0 6px 18px var(--shadow-color); 
}

.action-buttons { display:flex; gap:20px; margin-top:30px; }
.btn { 
  flex:1; 
  padding:18px; 
  border:none; 
  border-radius:15px; 
  cursor:pointer; 
  font-size:1.2rem; 
  font-weight:600; 
  transition:all 0.3s ease; 
  font-family:'Georgia','Times New Roman',serif; 
  box-shadow:0 6px 20px var(--shadow-color); 
}
.btn-add {
 background: var(--btn-gradient);
  color: var(--btn-fg);
}
.btn-add:hover {
  background: var(--btn-secondary-gradient); /* keep gradient */
  transform: translateY(-3px);
  box-shadow: 0 8px 25px var(--shadow-color);
  border-color: var(--border-color);
}

.btn-save {
  background: var(--btn-gradient);
  color: var(--btn-fg);
}
.btn-save:hover {
   background: var(--btn-secondary-gradient);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px var(--shadow-color);
  border-color: var(--border-color);
}

.btn:disabled { opacity:.7; cursor:not-allowed; transform:none; }

/* Mood & Category */
.event-category, .event-mood { 
  width:100%; 
  padding:12px 15px; 
  border-radius:12px; 
  border:2px solid var(--border-color); 
  font-size:1rem; 
  background: var(--surface-2-bg); 
  transition:all 0.3s ease; 
  color: var(--text); 
}
.event-category:focus, .event-mood:focus { 
  outline:none; 
  border-color: var(--btn-bg); 
  box-shadow:0 0 15px var(--shadow-color); 
  transform:translateY(-1px); 
  background: var(--surface-1-bg); 
}
.mood-emoji { font-size:1.5rem; margin-left:8px; vertical-align:middle; }

/* AI modal reuses same tokens as edit page */
.ai-generate-btn {
  background: var(--btn-gradient);
  color: var(--btn-fg);
  border: none;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 12px var(--shadow-color);
  transition: all 0.3s ease;
  position: absolute;
  bottom: 10px;
  right: 10px;
  white-space: nowrap;
}

.ai-generate-btn:hover {
  background: var(--btn-gradient); /* keep color */
  transform: scale(1.05);
}

.ai-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: var(--modal-backdrop); justify-content:center; align-items:center; z-index:1001; }
.ai-modal-content { background: var(--surface-1-bg); padding:30px; border-radius:15px; width:90%; max-width:600px; max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px var(--shadow-color); border:3px solid var(--border-color); }
.ai-modal-content h2 { color: var(--heading); margin-bottom:20px; }
.ai-modal-content label { display:block; margin-bottom:10px; color: var(--heading); font-weight:600; }
.ai-modal-content textarea, .ai-modal-content select { width:100%; padding:10px; margin-bottom:15px; border:2px solid var(--border-color); border-radius:8px; background: var(--surface-2-bg); font-family:'Georgia','Times New Roman',serif; font-size:1rem; color: var(--text); }
.ai-modal-content textarea { min-height:120px; resize:vertical; }
.ai-modal-content select { padding:12px 15px; }
.ai-modal-content button { padding:10px 20px; margin-right:10px; margin-top:10px; background: var(--btn-bg); color: var(--btn-fg); border:none; border-radius:8px; cursor:pointer; transition:0.3s; font-weight:600; }
.ai-modal-content button:hover { transform:translateY(-2px); }
.ai-modal-content button.secondary { background: var(--btn-secondary-bg); }

#ai-result { margin-top:20px; padding:15px; background: var(--surface-2-bg); border:2px solid var(--border-color); border-radius:8px; min-height:100px; white-space:pre-wrap; }

#ai-result .use-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 16px;
   background: var(--btn-gradient);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s;
}

#ai-result .use-btn:hover {
   background: var(--btn-gradient);
}


.loading-overlay {
  display: none;           /* hidden by default */
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 2000;
  justify-content: center;
  align-items: center;
}

.loading-content {
  background: var(--surface-1-bg);
  padding: 20px 30px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 6px 20px var(--shadow-color);
  border: 2px solid var(--border-color);
}

.loading-spinner {
  font-size: 2rem;
  margin-bottom: 10px;
}

.loading-message {
  color: var(--btn-bg);
  font-size: 1.1rem;
  font-weight: 600;
}


/* Responsive */
@media (max-width:768px) {
  .container { margin:10px; padding:30px 40px; }
  .container::before { left:25px; }
  .back-btn { margin-left:10px; }
  .event-card { padding:25px; margin-left:15px; }
  .action-buttons { flex-direction:column; gap:15px; }
  .diary-title { font-size:2rem; }
  .media-preview { grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; }
  .card-header { flex-direction:column; gap:10px; align-items:flex-start; }
}

</style>
</head>

<body>
<div class="container">
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
    
    <div class="diary-header">
        <div class="diary-title">Chronicle New Memories</div>
        <div class="diary-subtitle">Capturing the moments that matter</div>
        <div class="page-date" id="page-date">Writing for today</div>
    </div>

    <div class="events-container" id="events-list">
        <!-- Events will be dynamically added here -->
    </div>

    <div class="action-buttons">
        <button class="btn btn-add" id="add-event-btn">
            📖 Add Another Memory
        </button>
        <button class="btn btn-save" id="save-all-btn">
            💾 Preserve All Memories
        </button>
    </div>
</div>

<div class="loading-overlay" id="loading-overlay"> <div class="loading-content"> <div class="loading-spinner">📝</div> <div class="loading-message"> Writing your memories into the diary... </div> </div>

    </div>
</div>

<div class="ai-modal" id="ai-modal">
    <div class="ai-modal-content">
        <h2>Generate Story with AI</h2>
        <label for="ai-prompt">Keywords, Command, or Additional Text:</label>
        <textarea id="ai-prompt" placeholder="Enter keywords like 'a family picnic in the park' or add continuation text..."></textarea>
        <label for="ai-tone">Tone:</label>
        <select id="ai-tone">
<option value="reflective">Reflective</option>
<option value="friendly">Friendly</option>
    <option value="professional">Professional</option>
<option value="casual">Casual</option>
<option value="formal">Formal</option>
<option value="playful">Playful</option>
<option value="emotional">Emotional</option>
<option value="melancholic">Melancholic</option>
<option value="optimistic">Optimistic</option>
<option value="adventurous">Adventurous</option>
<option value="inspirational">Inspirational</option>

        </select>
        <label for="ai-style">Style:</label>
        <select id="ai-style">
           <option value="descriptive">Descriptive</option>
<option value="minimal">Minimal</option>
<option value="narrative">Narrative</option>
<option value="poetic">Poetic</option>
<option value="modern">Modern</option>
<option value="dramatic">Dramatic</option>
<option value="reflective">Reflective</option>
<option value="humorous">Humorous</option>
<option value="diary-style">Diary-style</option>
        </select>
        <label for="ai-length">Length:</label>
        <select id="ai-length">
          <option value="short">Short (3-4 sentences)</option>
<option value="medium">Medium (7-8 sentences)</option>
<option value="long">Long (10-12 sentences)</option>

        </select>
        <button id="ai-generate">Generate</button>
        <button id="ai-regenerate" style="display: none;">Regenerate</button>
        <button id="ai-copy" style="display: none;">Copy</button>
        <button id="ai-close" class="secondary">Close</button>
        <div id="ai-result"></div>
    </div>
</div>

<script type="module">
import { fetchCategories, fetchMoods } from './api.js';

const API_BASE_URL = "http://localhost:3000/api";
const token = localStorage.getItem('token');

if (!token) {
    alert("Please log in to continue.");
    window.location.href = 'register_login.html';
}

const urlParams = new URLSearchParams(window.location.search);
const date = urlParams.get('date') || new Date().toISOString().split('T')[0];

// Format date for display
const readableDate = new Date(date).toLocaleDateString('en-US', { 
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
});
document.getElementById('page-date').textContent = `Writing memories for ${readableDate}`;

const eventsList = document.getElementById('events-list');
const addEventBtn = document.getElementById('add-event-btn');
const saveAllBtn = document.getElementById('save-all-btn');
const loadingOverlay = document.getElementById('loading-overlay');

// AI Modal Elements
const aiModal = document.getElementById('ai-modal');
const aiPrompt = document.getElementById('ai-prompt');
const aiTone = document.getElementById('ai-tone');
const aiStyle = document.getElementById('ai-style');
const aiLength = document.getElementById('ai-length');
const aiGenerate = document.getElementById('ai-generate');
const aiRegenerate = document.getElementById('ai-regenerate');
const aiCopy = document.getElementById('ai-copy');
const aiClose = document.getElementById('ai-close');
const aiResult = document.getElementById('ai-result');
let currentTextarea = null;

let eventCounter = 0;
let categories = [];
let moods = [];

// Load categories and moods
async function loadCategoriesAndMoods() {
  try {
    categories = await fetchCategories();
    moods = await fetchMoods();

    if (!categories.find(c => c.name === "Other")) categories.push({ name: "Other" });
    if (!moods.find(m => m.name === "Other")) moods.push({ name: "Other" });

  } catch (err) {
    console.error("Error loading categories/moods:", err);
    alert("Failed to load categories and moods. Please check your network/server");
  }
}

await loadCategoriesAndMoods();

// Create event form
function createEventForm() {
    eventCounter++;
    const div = document.createElement('div');
    div.className = 'event-card';
    div.innerHTML = `
        <div class="card-header">
            <div class="event-number">Memory ${eventCounter}</div>
            ${eventCounter > 1 ? '<button class="remove-event-btn" type="button">Remove</button>' : ''}
        </div>
        
        <div class="form-group">
            <label>Title of this Memory</label>
            <input type="text" placeholder="What happened? Give this moment a name..." class="event-title" required>
        </div>
        
        <div class="form-group">
            <label>Tell the Story</label>
            <div style="position: relative;">
                <textarea placeholder="Describe this memory..." class="event-desc"></textarea>
                <button class="ai-generate-btn" style="position: absolute; bottom: 10px; right: 10px;">Generate with AI</button>
            </div>
        </div>
        
        <div class="form-group">
            <label>Category</label>
            <select class="event-category">
                <option value="" disabled selected>Select Category</option>
            </select>
        </div>

        <div class="form-group">
            <label>Mood <span class="mood-emoji"></span></label>
            <select class="event-mood">
                <option value="" disabled selected>Select Mood</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Capture the Moment</label>
            <div class="file-input-wrapper">
                <input type="file" class="event-media" multiple accept="image/*,video/*,audio/*">
                <label class="file-input-label">Add Photos, Videos & Audio</label>
            </div>
        </div>
        <div class="media-preview"></div>
    `;

    const removeBtn = div.querySelector('.remove-event-btn');
    const mediaInput = div.querySelector('.event-media');
    const mediaPreview = div.querySelector('.media-preview');
    const fileLabel = div.querySelector('.file-input-label');
    const categorySelect = div.querySelector('.event-category');
    const moodSelect = div.querySelector('.event-mood');
    const moodEmoji = div.querySelector('.mood-emoji');
    const aiBtn = div.querySelector('.ai-generate-btn');

    categorySelect.innerHTML += categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    moodSelect.innerHTML += moods.map(m => `<option value="${m.name}">${m.name}</option>`).join('');

    categorySelect.addEventListener('change', (e) => {
        if (e.target.value === 'Other') {
            const customCategory = prompt("Enter your custom category:");
            if (customCategory) {
                const opt = document.createElement('option');
                opt.value = customCategory;
                opt.textContent = customCategory;
                opt.selected = true;
                categorySelect.appendChild(opt);
                categorySelect.dataset.custom = customCategory;
            } else e.target.value = '';
        }
    });

    moodSelect.addEventListener('change', (e) => {
        if (e.target.value === 'Other') {
            const customMood = prompt("Enter your custom mood:");
            if (customMood) {
                const opt = document.createElement('option');
                opt.value = customMood;
                opt.textContent = customMood;
                opt.selected = true;
                moodSelect.appendChild(opt);
                moodSelect.dataset.custom = customMood;
            } else e.target.value = '';
        }
    });

    if (removeBtn) removeBtn.onclick = () => { div.remove(); updateEventNumbers(); };

    fileLabel.onclick = () => mediaInput.click();
    mediaInput.addEventListener('change', (e) => {
        mediaPreview.innerHTML = '';
        const files = Array.from(e.target.files);
        if (files.length) {
            mediaPreview.style.display = 'grid';
            files.forEach((file, idx) => {
                const type = file.type.split('/')[0];
                const url = URL.createObjectURL(file);
                const wrapper = document.createElement('div');
                wrapper.style.display = 'flex';
                wrapper.style.flexDirection = 'column';
                wrapper.style.gap = '5px';

                let mediaEl;
                if (type === 'image') mediaEl = document.createElement('img');
                else if (type === 'video') { mediaEl = document.createElement('video'); mediaEl.controls = true; }
                else if (type === 'audio') { mediaEl = document.createElement('audio'); mediaEl.controls = true; }

                mediaEl.src = url;
                mediaEl.style.maxHeight = '100px';
                mediaEl.style.borderRadius = '5px';

                const captionInput = document.createElement('input');
                captionInput.type = 'text';
                captionInput.placeholder = 'Add caption...';
                captionInput.className = 'media-caption';
                captionInput.dataset.index = idx;

                wrapper.appendChild(mediaEl);
                wrapper.appendChild(captionInput);
                mediaPreview.appendChild(wrapper);
            });
        } else mediaPreview.style.display = 'none';
    });

    moodSelect.addEventListener('change', () => {
        const selectedMood = moods.find(m => m.name === moodSelect.value);
        moodEmoji.textContent = selectedMood?.emojis?.length ? selectedMood.emojis[Math.floor(Math.random() * selectedMood.emojis.length)] : '';
    });

    // AI Button Handler
    aiBtn.onclick = () => {
        currentTextarea = div.querySelector('.event-desc');
        aiPrompt.value = currentTextarea.value.trim() || '';
        aiResult.innerHTML = '';
        aiGenerate.style.display = 'inline-block';
        aiRegenerate.style.display = 'none';
        aiCopy.style.display = 'none';
        aiModal.style.display = 'flex';
    };

    eventsList.appendChild(div);
}

// Update memory numbers
function updateEventNumbers() {
    const cards = document.querySelectorAll('.event-card');
    eventCounter = 0;
    cards.forEach((card, index) => {
        eventCounter++;
        card.querySelector('.event-number').textContent = `Memory ${index + 1}`;
        const cardHeader = card.querySelector('.card-header');
        const existingRemoveBtn = cardHeader.querySelector('.remove-event-btn');
        if (index === 0 && existingRemoveBtn) existingRemoveBtn.remove();
        if (index > 0 && !existingRemoveBtn) {
            const btn = document.createElement('button');
            btn.className = 'remove-event-btn';
            btn.type = 'button';
            btn.textContent = 'Remove';
            btn.onclick = () => { card.remove(); updateEventNumbers(); };
            cardHeader.appendChild(btn);
        }
    });
}

addEventBtn.onclick = () => createEventForm();

// Save all events
saveAllBtn.onclick = async () => {
    const forms = document.querySelectorAll('.event-card');
    if (!forms.length) return alert("Add at least one memory to preserve!");
    loadingOverlay.style.display = 'flex';
    saveAllBtn.disabled = true;

    try {
        for (const form of forms) {
            const titleInput = form.querySelector('.event-title');
            const descInput = form.querySelector('.event-desc');
            const categorySelect = form.querySelector('.event-category');
            const moodSelect = form.querySelector('.event-mood');
            const mediaFiles = form.querySelector('.event-media')?.files || [];

            const title = titleInput.value.trim();
            const desc = descInput.value.trim();
            const customCategory = categorySelect?.dataset.custom?.trim() || "";
            const customMood = moodSelect?.dataset.custom?.trim() || "";
            const category = customCategory || categorySelect.value.trim();
            const mood = customMood || moodSelect.value.trim();

            if (!title || !category || !mood) {
                throw new Error("Please fill in title, category, and mood before saving!");
            }

            // Send metadata first, backend generates ObjectId
            const metaRes = await fetch(`${API_BASE_URL}/diary`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title, description: desc || "", category, mood,
                    customCategory, customMood, date,
                    captions: Array.from(form.querySelectorAll('.media-caption')).map(c => c.value.trim())
                })
            });
            if (!metaRes.ok) throw new Error((await metaRes.json()).message);

            const metaJson = await metaRes.json();
            const eventId = metaJson.data?.eventId;

            if (!eventId) {
                throw new Error("Failed to get eventId from server");
            }

            // Upload media files in chunks
            const chunkSize = 5 * 1024 * 1024; // 5MB
            for (const file of mediaFiles) {
                const totalChunks = Math.ceil(file.size / chunkSize);
                const fileId = `${eventId}-${file.name.replace(/\s+/g,'_')}`;

                for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
                    const start = chunkIndex * chunkSize;
                    const end = Math.min(start + chunkSize, file.size);
                    const chunk = file.slice(start, end);

                    const formData = new FormData();
                    formData.append('chunk', chunk, file.name);
                    formData.append('fileId', fileId);
                    formData.append('chunkIndex', chunkIndex);
                    formData.append('totalChunks', totalChunks);
                    formData.append('filename', file.name);
                    formData.append('eventId', eventId);

                    const res = await fetch(`${API_BASE_URL}/diary/upload-chunk`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    if (!res.ok) throw new Error(`Failed to upload chunk ${chunkIndex+1} of ${file.name}`);
                }

                // Merge chunks
                await fetch(`${API_BASE_URL}/diary/merge-chunks`, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        fileId,
                        filename: file.name,
                        eventId,
                        totalChunks: Number(totalChunks)
                    })
                });
            }

            // Save custom suggestions
            if (customCategory) await fetch(`${API_BASE_URL}/suggestions/category`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name: customCategory })
            });
            if (customMood) await fetch(`${API_BASE_URL}/suggestions/mood`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name: customMood })
            });
        }

        alert("All memories have been beautifully preserved in the diary!");
        window.location.href = 'dashboard.html';
    } catch (err) {
        console.error(err);
        alert(`Error saving memory: ${err.message || 'Unknown error occurred'}`);
    } finally {
        loadingOverlay.style.display = 'none';
        saveAllBtn.disabled = false;
    }
};

// AI Modal Handlers
aiClose.onclick = () => {
    aiModal.style.display = 'none';
    currentTextarea = null;
};

async function generateStory() {
    const promptText = aiPrompt.value.trim();
    if (!promptText) {
        return alert('Please enter keywords or a command.');
    }

    aiResult.innerHTML = '<p>Generating...</p>';
    aiGenerate.style.display = 'none';
    aiRegenerate.style.display = 'inline-block';
    aiCopy.style.display = 'none';

    try {
        const res = await fetch(`${API_BASE_URL}/ai/generate-story`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                prompt: promptText,
                tone: aiTone.value,
                style: aiStyle.value,
                length: aiLength.value
            })
        });

        if (!res.ok) {
            throw new Error('Failed to generate story.');
        }

        const { text } = await res.json();
        aiResult.innerHTML = `<p>${text}</p><button id="ai-use" class="use-btn">Use This</button>`;
        aiCopy.style.display = 'inline-block';

        document.getElementById('ai-use').onclick = () => {
            if (currentTextarea) {
                currentTextarea.value = text;
            }
            aiModal.style.display = 'none';
        };

        aiCopy.onclick = () => {
            navigator.clipboard.writeText(text).then(() => {
                alert('Story copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy story: ' + err.message);
            });
        };
    } catch (err) {
        aiResult.innerHTML = `<p>Error: ${err.message}</p>`;
        aiGenerate.style.display = 'inline-block';
        aiRegenerate.style.display = 'none';
        aiCopy.style.display = 'none';
    }
}

aiGenerate.onclick = generateStory;
aiRegenerate.onclick = generateStory;

createEventForm();

window.addEventListener('beforeunload', () => {
    document.querySelectorAll('.media-preview img, .media-preview video, .media-preview audio').forEach(el => {
        if (el.src.startsWith('blob:')) URL.revokeObjectURL(el.src);
    });
});
</script>
