<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./themes.css">
<script type="module" src="./theme.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Georgia', 'Times New Roman', serif; }
body {
    background: var(--bg-gradient);
    min-height:100vh;
    padding:20px;
    line-height: 1.8;
}
.container {
    max-width:900px;
    margin:0 auto;
    background: var(--surface-1-bg);
    border-radius:20px;
    padding:50px 60px;
    box-shadow:0 20px 60px var(--shadow-color);
    border: 3px solid var(--border-color);
    position: relative;
}
.container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 40px;
    width: 2px;
    height: 100%;
    background: var(--accent-1);
    opacity: 0.3;
}

.top-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 15px;
}

.btn {
    padding: 12px 24px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.3s;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 4px 15px var(--shadow-color);
    font-size: 1rem;
}

.btn:hover { 
    background: var(--btn-hover); 
    transform: translateY(-2px); 
}

.btn.secondary {
    background: var(--muted-text);
    box-shadow: 0 4px 15px rgba(141,110,99,0.3);
}

.btn.secondary:hover {
    background: #a1887f;
}

.notifications-header { 
    text-align: center; 
    margin-bottom: 40px; 
    border-bottom: 2px solid var(--border-color); 
    padding-bottom: 20px; 
}

.notifications-title { 
    font-size: 2.5rem; 
    color: var(--heading); 
    font-weight: bold; 
    text-shadow: 1px 1px 3px var(--shadow-color); 
    margin-bottom: 10px; 
}

.notifications-subtitle { 
    font-size: 1.2rem; 
    color: var(--muted-text); 
    font-style: italic; 
}

.notifications-stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.stat-item {
    background: var(--surface-2-bg);
    padding: 15px 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 12px var(--shadow-color);
    border: 1px solid var(--panel-border);
}

.stat-number {
    font-size: 1.8rem;
    font-weight: bold;
    color: var(--btn-bg);
    display: block;
}

.stat-label {
    font-size: 0.9rem;
    color: var(--muted-text);
    font-style: italic;
}

.notifications-container {
    margin-top: 20px;
}

.notification-item {
    background: var(--surface-2-bg);
    border-radius: 15px;
    padding: 20px 25px;
    margin-bottom: 15px;
    box-shadow: 0 4px 12px var(--shadow-color);
    border: 1px solid var(--panel-border);
    position: relative;
    transition: all 0.3s ease;
    display: flex;
    align-items: flex-start;
    gap: 15px;
}

.notification-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--shadow-color);
}

.notification-item.unread {
    background: #f3f8ff;
    border-left: 4px solid var(--accent-1);
}

.notification-item.unread::before {
    content: '●';
    position: absolute;
    left: -8px;
    top: 15px;
    color: var(--accent-1);
    font-size: 1.2rem;
}

.notification-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
    position: relative;
    overflow: hidden;
}

.avatar-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.avatar-fallback {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--btn-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--btn-fg);
    text-transform: uppercase;
}

.notification-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.notification-sender {
    font-weight: bold;
    color: var(--btn-bg);
    font-size: 1rem;
}

.notification-content {
    flex: 1;
    min-width: 0;
}

.notification-message {
    font-size: 1rem;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.5;
}

.notification-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.notification-time {
    font-size: 0.85rem;
    color: var(--muted-text);
    font-style: italic;
}

.notification-type {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
}

.notification-type.chat {
    background: rgba(76, 175, 80, 0.1);
    color: #4CAF50;
}

.notification-type.tag {
    background: rgba(33, 150, 243, 0.1);
    color: #2196F3;
}

.notification-type.invite {
    background: rgba(255, 152, 0, 0.1);
    color: #FF9800;
}

.notification-type.like {
    background: rgba(244, 67, 54, 0.1);
    color: #f44336;
}

.notification-type.comment {
    background: rgba(156, 39, 176, 0.1);
    color: #9c27b0;
}

.notification-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

.action-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.3s ease;
}

.mark-read-btn {
    background: #e8f5e8;
    color: #4CAF50;
    border: 1px solid #c8e6c9;
}

.mark-read-btn:hover {
    background: #4CAF50;
    color: white;
}

.delete-btn {
    background: #ffebee;
    color: #f44336;
    border: 1px solid #ffcdd2;
}

.delete-btn:hover {
    background: #f44336;
    color: white;
}

.no-notifications {
    text-align: center;
    color: var(--muted-text);
    font-style: italic;
    font-size: 1.2rem;
    padding: 60px 20px;
    background: var(--no-media-bg);
    border-radius: 15px;
    border: 2px dashed var(--border-color);
}

.no-notifications-icon {
    font-size: 4rem;
    margin-bottom: 20px;
    opacity: 0.5;
}

.loading {
    text-align: center;
    color: var(--muted-text);
    font-style: italic;
    font-size: 1.1rem;
    padding: 40px;
}

.filter-tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.filter-tab {
    padding: 10px 20px;
    border: none;
    background: var(--surface-2-bg);
    border-radius: 25px;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--muted-text);
    transition: all 0.3s ease;
    border: 1px solid var(--panel-border);
}

.filter-tab.active {
    background: var(--btn-bg);
    color: var(--btn-fg);
    box-shadow: 0 2px 8px var(--shadow-color);
}

.filter-tab:hover:not(.active) {
    background: var(--surface-3-bg);
}

@media (max-width: 768px) {
    .container {
        padding: 30px 25px;
    }
    
    .top-buttons {
        justify-content: center;
    }
    
    .notifications-stats {
        gap: 15px;
    }
    
    .stat-item {
        padding: 10px 15px;
    }
    
    .notification-item {
        padding: 15px 20px;
        gap: 10px;
    }
    
    .notification-avatar {
        width: 40px;
        height: 40px;
    }
    
    .avatar-fallback {
        font-size: 1rem;
    }
    
    .notification-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
    }
    
    .notification-meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
    
    .notification-actions {
        align-self: flex-end;
    }
    
    .filter-tabs {
        gap: 5px;
    }
    
    .filter-tab {
        padding: 8px 15px;
        font-size: 0.8rem;
    }
}

:root {
    --bg-gradient: linear-gradient(135deg, #f7f3e9, #e8dcc6);
    --surface-1-bg: #fdfbf7;
    --surface-2-bg: #fff8f0;
    --surface-3-bg: #f8f6f1;
    --border-color: #d4c5a9;
    --panel-border: #e6d8c5;
    --shadow-color: rgba(0,0,0,0.15);

    --text: #2c2c2c;
    --muted-text: #8d6e63;
    --heading: #5d4037;

    --accent-1: #e74c3c;

    --btn-bg: #8b4513;
    --btn-hover: #a0522d;
    --btn-fg: #ffffff;
    --btn-gradient: linear-gradient(135deg, #8b4513, #a0522d);

    --tab-bg: #ffffff;
    --tab-text: #8d6e63;
    --tab-active-bg: #8b4513;
    --tab-active-text: #ffffff;

    --badge-bg: #d4c5a9;
    --badge-text: #5d4037;

    --modal-backdrop: rgba(0,0,0,0.95);
    --modal-surface: #1a1a1a;
    --modal-text: #ffffff;
    --modal-border: #333333;
    --modal-close-bg: rgba(255,255,255,0.9);
    --modal-close-fg: #333333;

    --audio-gradient-start: #667eea;
    --audio-gradient-end: #764ba2;
    --no-media-bg: rgba(212,197,169,0.1);
}
</style>
</head>
<body>
<div class="container">
    <div class="top-buttons">
        <a href="dashboard.html" class="btn">← Back to Dashboard</a>
        <button id="mark-all-read-btn" class="btn secondary">✓ Mark All Read</button>
    </div>

    <div class="notifications-header">
        <div class="notifications-title">📬 Notifications</div>
        <div class="notifications-subtitle">Stay updated with your diary community</div>
    </div>

    <div class="notifications-stats" id="stats-container">
        <div class="stat-item">
            <span class="stat-number" id="total-count">0</span>
            <span class="stat-label">Total</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" id="unread-count">0</span>
            <span class="stat-label">Unread</span>
        </div>
    </div>

    <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="unread">Unread</button>
        <button class="filter-tab" data-filter="chat">💬 Chats</button>
        <button class="filter-tab" data-filter="tag">🏷️ Tags</button>
        <button class="filter-tab" data-filter="invite">📨 Invites</button>
        <button class="filter-tab" data-filter="like">👍 Likes</button>
        <button class="filter-tab" data-filter="comment">💭 Comments</button>
    </div>

    <div class="notifications-container" id="notifications-container">
        <div class="loading">Loading your notifications...</div>
    </div>
</div>

<script>
const API_BASE_URL = "http://localhost:3000/api";
const token = localStorage.getItem('token');

let allNotifications = [];
let currentFilter = 'all';

// Helper function to format time
function formatTime(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffTime = Math.abs(now - date);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    if (diffDays === 1) {
        return 'Today';
    } else if (diffDays === 2) {
        return 'Yesterday';
    } else if (diffDays <= 7) {
        return `${diffDays - 1} days ago`;
    } else {
        return date.toLocaleDateString('en-US', { 
            month: 'short', 
            day: 'numeric',
            year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
        });
    }
}

// Get notification icon based on type
function getNotificationIcon(type) {
    const icons = {
        'chat': '💬',
        'tag': '🏷️',
        'invite': '📨',
        'like': '👍',
        'comment': '💭'
    };
    return icons[type] || '📬';
}

// Create notification item HTML
function createNotificationItem(notification) {
    const isUnread = !notification.isRead;
    
    // Better sender name extraction - handle cases where sender might be an ID string
    let senderName = 'System';
    let senderPhoto = null;
    
    if (notification.sender) {
        if (typeof notification.sender === 'object') {
            // Sender is populated object
            senderName = notification.sender.username || notification.sender.name || 'User';
            senderPhoto = notification.sender.profilePhoto;
        } else if (typeof notification.sender === 'string') {
            // Sender is just an ID - extract name from message or use generic
            const messageMatch = notification.message.match(/^(\w+)\s/);
            senderName = messageMatch ? messageMatch[1] : 'User';
        }
    }
    
    // Create profile photo URL or fallback
    let profileImageSrc = '';
    if (senderPhoto) {
        if (typeof senderPhoto === 'object' && senderPhoto.url) {
            profileImageSrc = `http://localhost:3000/uploads/${senderPhoto.url}`;
        } else if (typeof senderPhoto === 'string') {
            profileImageSrc = senderPhoto.startsWith('http') ? senderPhoto : `http://localhost:3000/uploads/${senderPhoto}`;
        }
    }
    
    return `
        <div class="notification-item ${isUnread ? 'unread' : ''}" data-id="${notification._id}" data-type="${notification.type}">
            <div class="notification-avatar">
                ${profileImageSrc ? 
                    `<img src="${profileImageSrc}" alt="${senderName}" class="avatar-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                     <div class="avatar-fallback" style="display:none;">${senderName.charAt(0).toUpperCase()}</div>` :
                    `<div class="avatar-fallback">${senderName.charAt(0).toUpperCase()}</div>`
                }
            </div>
            <div class="notification-content">
                <div class="notification-header">
                    <span class="notification-sender">${senderName}</span>
                    <span class="notification-time">${formatTime(notification.createdAt)}</span>
                </div>
                <div class="notification-message">
                    ${notification.message}
                </div>
                <div class="notification-meta">
                    <span class="notification-type ${notification.type}">${notification.type}</span>
                    <div class="notification-actions">
                        ${isUnread ? `<button class="action-btn mark-read-btn" onclick="markAsRead('${notification._id}')">Mark Read</button>` : ''}
                        <button class="action-btn delete-btn" onclick="deleteNotification('${notification._id}')">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

// Filter notifications
function filterNotifications(filter) {
    let filteredNotifications = allNotifications;
    
    if (filter === 'unread') {
        filteredNotifications = allNotifications.filter(n => !n.isRead);
    } else if (filter !== 'all') {
        filteredNotifications = allNotifications.filter(n => n.type === filter);
    }
    
    return filteredNotifications;
}

// Render notifications
function renderNotifications(filter = 'all') {
    const container = document.getElementById('notifications-container');
    const filteredNotifications = filterNotifications(filter);
    
    if (filteredNotifications.length === 0) {
        const noNotificationsMsg = filter === 'all' 
            ? "No notifications yet. Start connecting with your diary community!"
            : filter === 'unread'
            ? "All caught up! No unread notifications."
            : `No ${filter} notifications found.`;
            
        container.innerHTML = `
            <div class="no-notifications">
                <div class="no-notifications-icon">📭</div>
                <p>${noNotificationsMsg}</p>
            </div>
        `;
        return;
    }
    
    const notificationsHTML = filteredNotifications
        .map(notification => createNotificationItem(notification))
        .join('');
    
    container.innerHTML = notificationsHTML;
}

// Update stats
function updateStats() {
    const totalCount = allNotifications.length;
    const unreadCount = allNotifications.filter(n => !n.isRead).length;
    
    document.getElementById('total-count').textContent = totalCount;
    document.getElementById('unread-count').textContent = unreadCount;
}

// Load notifications from API
async function loadNotifications() {
    try {
        const response = await fetch(`${API_BASE_URL}/notifications`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            alert("Session expired. Please log in again.");
            localStorage.removeItem('token');
            window.location.href = 'register_login.html';
            return;
        }

        if (!response.ok) {
            throw new Error('Failed to fetch notifications');
        }

        allNotifications = await response.json();
        updateStats();
        renderNotifications(currentFilter);

    } catch (error) {
        console.error('Error loading notifications:', error);
        document.getElementById('notifications-container').innerHTML = `
            <div class="no-notifications">
                <div class="no-notifications-icon">⚠️</div>
                <p>Failed to load notifications. Please try again later.</p>
            </div>
        `;
    }
}

// Mark single notification as read
async function markAsRead(notificationId) {
    try {
        const response = await fetch(`${API_BASE_URL}/notifications/${notificationId}/read`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.ok) {
            // Update local data
            const notification = allNotifications.find(n => n._id === notificationId);
            if (notification) {
                notification.isRead = true;
            }
            
            updateStats();
            renderNotifications(currentFilter);
        } else {
            alert('Failed to mark notification as read');
        }
    } catch (error) {
        console.error('Error marking notification as read:', error);
        alert('Error marking notification as read');
    }
}

// Mark all notifications as read
async function markAllAsRead() {
    try {
        const response = await fetch(`${API_BASE_URL}/notifications/mark-all-read`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.ok) {
            // Update local data
            allNotifications.forEach(n => n.isRead = true);
            updateStats();
            renderNotifications(currentFilter);
            alert('All notifications marked as read!');
        } else {
            alert('Failed to mark all notifications as read');
        }
    } catch (error) {
        console.error('Error marking all notifications as read:', error);
        alert('Error marking all notifications as read');
    }
}

// Delete notification
async function deleteNotification(notificationId) {
    if (!confirm('Are you sure you want to delete this notification?')) {
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/notifications/${notificationId}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.ok) {
            // Remove from local data
            allNotifications = allNotifications.filter(n => n._id !== notificationId);
            updateStats();
            renderNotifications(currentFilter);
        } else {
            alert('Failed to delete notification');
        }
    } catch (error) {
        console.error('Error deleting notification:', error);
        alert('Error deleting notification');
    }
}

// Filter tab handling
document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        // Update active tab
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // Update filter and re-render
        currentFilter = tab.dataset.filter;
        renderNotifications(currentFilter);
    });
});

// Mark all as read button
document.getElementById('mark-all-read-btn').addEventListener('click', markAllAsRead);

// Check authentication
if (!token) {
    alert("Please log in to view notifications");
    window.location.href = 'register_login.html';
} else {
    loadNotifications();
}

// Auto-refresh notifications every 30 seconds
setInterval(() => {
    loadNotifications();
}, 30000);
</script>
</body>
</html>
